<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WILDCARD - Game Benchmark</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-family: 'Orbitron', monospace;
            text-align: center;
            background: linear-gradient(90deg, #ff6b00, #ff9500);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        button {
            font-family: 'Orbitron', monospace;
            padding: 15px 30px;
            font-size: 1rem;
            background: linear-gradient(135deg, #ff6b00, #ff9500);
            border: none;
            border-radius: 10px;
            color: #000;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results {
            max-width: 800px;
            margin: 0 auto;
        }

        .section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section h2 {
            font-family: 'Orbitron', monospace;
            color: #ffd700;
            margin-bottom: 15px;
        }

        .game-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avg {
            color: #00ff88;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .running {
            color: #ffd700;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from {
                opacity: 0.5;
            }

            to {
                opacity: 1;
            }
        }

        .summary {
            text-align: center;
            font-size: 1.5rem;
            padding: 30px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            border-radius: 15px;
        }

        .status {
            text-align: center;
            margin: 20px 0;
            font-size: 1.2rem;
        }
    </style>
</head>

<body>
    <h1>🃏 WILDCARD BENCHMARK</h1>

    <div class="controls">
        <button id="runBtn" onclick="runBenchmark()">▶️ Run 15 Simulations</button>
    </div>

    <div class="status" id="status">Click to run 5 games each for 3, 4, and 5 teams</div>

    <div class="results">
        <div class="section">
            <h2>3 Teams (9 players)</h2>
            <div id="results3"></div>
            <div class="game-row avg"><span>Average:</span><span id="avg3">-</span></div>
        </div>

        <div class="section">
            <h2>4 Teams (12 players)</h2>
            <div id="results4"></div>
            <div class="game-row avg"><span>Average:</span><span id="avg4">-</span></div>
        </div>

        <div class="section">
            <h2>5 Teams (15 players)</h2>
            <div id="results5"></div>
            <div class="game-row avg"><span>Average:</span><span id="avg5">-</span></div>
        </div>

        <div class="section summary" id="summary" style="display: none;">
            <div id="summaryText"></div>
        </div>
    </div>

    <script>
        // Game simulation constants (matching arena.html)
        const CLASS_CONFIG = {
            support: { size: 1.00 },
            controller: { size: 1.05 },
            assault: { size: 1.08 },
            recon: { size: 1.02 },
            skirmisher: { size: 1.03 }
        };

        const PERK_SELECTION_TIME = 8;
        const READY_COUNTDOWN_TIME = 3;

        // Simplified game simulation
        function simulateGame(numTeams) {
            const startTime = performance.now();

            // Create players
            const classes = ['support', 'controller', 'assault', 'recon', 'skirmisher'];
            let players = [];

            for (let team = 1; team <= numTeams; team++) {
                for (let i = 0; i < 3; i++) {
                    players.push({
                        team,
                        hp: 100,
                        maxHp: 100,
                        alive: true,
                        classKey: classes[(team + i) % 5],
                        attackCooldown: 0
                    });
                }
            }

            let simulatedTime = 0;
            let teamsAlive = numTeams;
            const dt = 0.05; // 50ms simulation steps

            while (teamsAlive > 1) {
                simulatedTime += dt;

                // Combat: each alive player shoots
                players.forEach(attacker => {
                    if (!attacker.alive) return;
                    attacker.attackCooldown -= dt;

                    if (attacker.attackCooldown <= 0) {
                        // Find random enemy
                        const enemies = players.filter(p => p.team !== attacker.team && p.alive);
                        if (enemies.length === 0) return;

                        const target = enemies[Math.floor(Math.random() * enemies.length)];
                        const damage = 15 + Math.floor(Math.random() * 20);
                        target.hp -= damage;

                        if (target.hp <= 0) {
                            target.alive = false;
                        }

                        attacker.attackCooldown = 1.5 + Math.random();
                    }
                });

                // Check teams alive
                const aliveTeamIds = [...new Set(players.filter(p => p.alive).map(p => p.team))];

                if (aliveTeamIds.length < teamsAlive && aliveTeamIds.length > 1) {
                    // Team eliminated - perk selection phase
                    simulatedTime += PERK_SELECTION_TIME + READY_COUNTDOWN_TIME;
                    teamsAlive = aliveTeamIds.length;
                } else {
                    teamsAlive = aliveTeamIds.length;
                }

                // Safety: max 5 minutes simulated
                if (simulatedTime > 300) break;
            }

            return {
                simulatedTime: simulatedTime,
                realTime: performance.now() - startTime
            };
        }

        const results = { 3: [], 4: [], 5: [] };

        async function runBenchmark() {
            const btn = document.getElementById('runBtn');
            btn.disabled = true;

            // Clear previous results
            [3, 4, 5].forEach(n => {
                results[n] = [];
                document.getElementById(`results${n}`).innerHTML = '';
                document.getElementById(`avg${n}`).textContent = '-';
            });
            document.getElementById('summary').style.display = 'none';

            for (const numTeams of [3, 4, 5]) {
                for (let game = 1; game <= 5; game++) {
                    document.getElementById('status').innerHTML =
                        `<span class="running">Running: ${numTeams} teams - Game ${game}/5...</span>`;

                    // Small delay to update UI
                    await new Promise(r => setTimeout(r, 50));

                    const result = simulateGame(numTeams);
                    results[numTeams].push(result.simulatedTime);

                    // Display result
                    const container = document.getElementById(`results${numTeams}`);
                    container.innerHTML += `
                        <div class="game-row">
                            <span>Game ${game}</span>
                            <span>${result.simulatedTime.toFixed(1)}s</span>
                        </div>
                    `;
                }

                // Calculate average
                const avg = results[numTeams].reduce((a, b) => a + b, 0) / 5;
                document.getElementById(`avg${numTeams}`).textContent = avg.toFixed(1) + 's';
            }

            // Summary
            const avg3 = results[3].reduce((a, b) => a + b, 0) / 5;
            const avg4 = results[4].reduce((a, b) => a + b, 0) / 5;
            const avg5 = results[5].reduce((a, b) => a + b, 0) / 5;
            const overallAvg = (avg3 + avg4 + avg5) / 3;

            document.getElementById('summary').style.display = 'block';
            document.getElementById('summaryText').innerHTML = `
                <div style="margin-bottom: 10px;">📊 <strong>BENCHMARK COMPLETE</strong></div>
                <div>3 Teams: <strong>${avg3.toFixed(1)}s</strong> avg</div>
                <div>4 Teams: <strong>${avg4.toFixed(1)}s</strong> avg</div>
                <div>5 Teams: <strong>${avg5.toFixed(1)}s</strong> avg</div>
                <div style="margin-top: 15px; color: #ffd700;">Overall Average: <strong>${overallAvg.toFixed(1)}s</strong></div>
            `;

            document.getElementById('status').textContent = '✅ Benchmark complete!';
            btn.disabled = false;
        }
    </script>
</body>

</html>
