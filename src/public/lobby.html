<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WILDCARD - Lobby</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a1a 100%);
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        /* Animated background */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(rgba(255, 107, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 107, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(50px, 50px);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b00, #ffd700, #ff6b00);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
            text-shadow: 0 0 50px rgba(255, 107, 0, 0.5);
        }

        @keyframes shimmer {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .subtitle {
            font-size: 1.5rem;
            color: #888;
            margin-top: 10px;
        }

        /* Room Code */
        .room-code-container {
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #ff6b00;
            border-radius: 20px;
            padding: 20px 40px;
            margin-bottom: 30px;
            text-align: center;
        }

        .room-label {
            font-size: 1rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .room-code {
            font-family: 'Orbitron', monospace;
            font-size: 3.5rem;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 10px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .join-hint {
            font-size: 1rem;
            color: #4ecdc4;
            margin-top: 10px;
        }

        /* Seats Grid */
        .seats-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 1000px;
            margin-bottom: 30px;
        }

        .seat {
            width: 120px;
            height: 140px;
            background: rgba(30, 30, 50, 0.8);
            border: 3px dashed rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .seat.empty {
            animation: pulse-empty 2s ease-in-out infinite;
        }

        @keyframes pulse-empty {

            0%,
            100% {
                border-color: rgba(255, 255, 255, 0.2);
            }

            50% {
                border-color: rgba(255, 107, 0, 0.5);
            }
        }

        .seat.filled {
            border: 3px solid;
            animation: none;
            background: linear-gradient(135deg, rgba(50, 50, 80, 0.9), rgba(30, 30, 50, 0.9));
        }

        .seat.team-1 {
            border-color: #ff6b6b;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
        }

        .seat.team-2 {
            border-color: #4ecdc4;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
        }

        .seat.team-3 {
            border-color: #ffe66d;
            box-shadow: 0 0 20px rgba(255, 230, 109, 0.3);
        }

        .seat.team-4 {
            border-color: #95e1d3;
            box-shadow: 0 0 20px rgba(149, 225, 211, 0.3);
        }

        .seat.team-5 {
            border-color: #dda0dd;
            box-shadow: 0 0 20px rgba(221, 160, 221, 0.3);
        }

        .seat.birthday {
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.2), rgba(255, 215, 0, 0.2));
        }

        .seat.birthday::before {
            content: '🎂';
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 1.2rem;
        }

        .seat-number {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.2);
        }

        .seat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b00, #ffd700);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .seat-name {
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .seat-platform {
            font-size: 0.7rem;
            color: #888;
            margin-top: 3px;
        }

        .seat-platform.discord {
            color: #7289da;
        }

        .seat-platform.twitch {
            color: #9146ff;
        }

        .seat-class {
            font-size: 0.75rem;
            color: #ffd700;
            margin-top: 5px;
        }

        /* Join animation */
        .seat.joining {
            animation: seatJoin 0.5s ease-out;
        }

        @keyframes seatJoin {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Status Bar */
        .status-bar {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            padding: 20px 40px;
            text-align: center;
            margin-bottom: 20px;
        }

        .player-count {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
        }

        .player-count .current {
            color: #00ff88;
        }

        .player-count .max {
            color: #888;
        }

        .status-message {
            font-size: 1.2rem;
            color: #ffd700;
            margin-top: 10px;
        }

        .start-hint {
            font-size: 1rem;
            color: #4ecdc4;
            margin-top: 15px;
            padding: 10px 20px;
            border: 2px solid #4ecdc4;
            border-radius: 10px;
            display: inline-block;
        }

        .start-hint.ready {
            animation: ready-pulse 1s ease-in-out infinite;
            background: rgba(0, 255, 136, 0.1);
        }

        @keyframes ready-pulse {

            0%,
            100% {
                box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            }

            50% {
                box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
            }
        }

        /* Team legend */
        .team-legend {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .team-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.4);
        }

        .team-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        /* Countdown overlay */
        .countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .countdown-number {
            font-family: 'Orbitron', monospace;
            font-size: 15rem;
            font-weight: 900;
            color: #ff6b00;
            text-shadow: 0 0 100px rgba(255, 107, 0, 0.8);
            animation: countPulse 1s ease-in-out;
        }

        @keyframes countPulse {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>

    <div class="container">
        <div class="header">
            <div class="logo">🃏 WILDCARD</div>
            <div class="subtitle">Battle Royale Lobby</div>
        </div>

        <div class="room-code-container">
            <div class="room-label">Room Code</div>
            <div class="room-code" id="roomCode">ABCD</div>
            <div class="join-hint">Type <strong>!lbjoin</strong> in chat to join!</div>
        </div>

        <div class="status-bar">
            <div class="player-count">
                <span class="current" id="playerCount">0</span>
                <span class="max">/ <span id="maxPlayers">9</span></span>
            </div>
            <div class="status-message" id="statusMessage">Waiting for players...</div>
            <div class="start-hint" id="startHint">Need at least 9 players to start</div>
        </div>

        <div class="seats-container" id="seatsContainer">
            <!-- Seats generated by JS -->
        </div>

        <div class="team-legend">
            <div class="team-badge">
                <div class="team-dot" style="background: #ff6b6b;"></div> Team 1
            </div>
            <div class="team-badge">
                <div class="team-dot" style="background: #4ecdc4;"></div> Team 2
            </div>
            <div class="team-badge">
                <div class="team-dot" style="background: #ffe66d;"></div> Team 3
            </div>
        </div>
    </div>

    <div class="countdown-overlay" id="countdownOverlay">
        <div class="countdown-number" id="countdownNumber">3</div>
    </div>

    <script>
        // Configuration
        const PLAYERS_PER_TEAM = 3;
        const MIN_TEAMS = 3;
        const MAX_TEAMS = 5;

        const CLASS_EMOJIS = {
            support: '⚪',
            controller: '🟣',
            assault: '🔴',
            recon: '🔵',
            skirmisher: '🟢'
        };

        const TEAM_COLORS = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3', '#dda0dd'];

        // State
        let players = [];
        let roomCode = generateRoomCode();
        let numTeams = 3;
        let gameStarting = false;

        // Generate room code
        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars[Math.floor(Math.random() * chars.length)];
            }
            return code;
        }

        // Initialize seats
        function initSeats() {
            const container = document.getElementById('seatsContainer');
            container.innerHTML = '';

            const totalSeats = numTeams * PLAYERS_PER_TEAM;
            document.getElementById('maxPlayers').textContent = totalSeats;

            for (let i = 0; i < totalSeats; i++) {
                const team = Math.floor(i / PLAYERS_PER_TEAM) + 1;
                const seat = document.createElement('div');
                seat.className = `seat empty team-${team}`;
                seat.id = `seat-${i}`;
                seat.innerHTML = `<div class="seat-number">${i + 1}</div>`;
                container.appendChild(seat);
            }

            updateTeamLegend();
        }

        // Update team legend based on numTeams
        function updateTeamLegend() {
            const legend = document.querySelector('.team-legend');
            legend.innerHTML = '';
            for (let t = 1; t <= numTeams; t++) {
                legend.innerHTML += `
                    <div class="team-badge">
                        <div class="team-dot" style="background: ${TEAM_COLORS[t - 1]};"></div>
                        Team ${t}
                    </div>
                `;
            }
        }

        // Add player to lobby
        function addPlayer(player) {
            const totalSeats = numTeams * PLAYERS_PER_TEAM;
            if (players.length >= totalSeats) {
                // Expand to more teams if possible
                if (numTeams < MAX_TEAMS) {
                    numTeams++;
                    initSeats();
                    // Re-fill existing players
                    players.forEach((p, i) => fillSeat(i, p));
                } else {
                    return false; // Full
                }
            }

            const seatIndex = players.length;
            players.push(player);
            fillSeat(seatIndex, player);
            updateStatus();
            return true;
        }

        // Fill a seat with player data
        function fillSeat(index, player) {
            const seat = document.getElementById(`seat-${index}`);
            if (!seat) return;

            const team = Math.floor(index / PLAYERS_PER_TEAM) + 1;
            const classEmoji = CLASS_EMOJIS[player.class] || '⚪';

            seat.className = `seat filled team-${team} joining ${player.isBirthday ? 'birthday' : ''}`;
            seat.innerHTML = `
                <div class="seat-avatar">${classEmoji}</div>
                <div class="seat-name">${player.username}</div>
                <div class="seat-platform ${player.platform}">${player.platform === 'discord' ? '🎮 Discord' : '📺 Twitch'}</div>
                <div class="seat-class">${player.class.toUpperCase()}</div>
            `;
        }

        // Update status display
        function updateStatus() {
            const total = numTeams * PLAYERS_PER_TEAM;
            const current = players.length;

            document.getElementById('playerCount').textContent = current;
            document.getElementById('maxPlayers').textContent = total;

            const minToStart = MIN_TEAMS * PLAYERS_PER_TEAM;
            const startHint = document.getElementById('startHint');
            const statusMsg = document.getElementById('statusMessage');

            if (current >= minToStart) {
                statusMsg.textContent = `Ready to start! ${current} players joined`;
                startHint.textContent = `Admin: Type !lbstartgame ${roomCode} to begin!`;
                startHint.classList.add('ready');
            } else {
                const needed = minToStart - current;
                statusMsg.textContent = `Waiting for ${needed} more player${needed > 1 ? 's' : ''}...`;
                startHint.textContent = `Need at least ${minToStart} players to start`;
                startHint.classList.remove('ready');
            }
        }

        // Start game countdown
        function startCountdown() {
            if (gameStarting) return;
            gameStarting = true;

            const overlay = document.getElementById('countdownOverlay');
            const number = document.getElementById('countdownNumber');
            overlay.style.display = 'flex';

            let count = 3;
            number.textContent = count;

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    number.textContent = count;
                    number.style.animation = 'none';
                    void number.offsetWidth; // Trigger reflow
                    number.style.animation = 'countPulse 1s ease-in-out';
                } else {
                    clearInterval(interval);
                    number.textContent = 'GO!';
                    number.style.color = '#00ff88';

                    setTimeout(() => {
                        // Redirect to arena
                        window.location.href = `/arena?teams=${numTeams}`;
                    }, 1000);
                }
            }, 1000);
        }

        // Demo: Simulate players joining
        function simulateJoins() {
            const demoPlayers = [
                { username: 'Zeus', platform: 'discord', class: 'assault', isBirthday: true },
                { username: 'Fooz', platform: 'twitch', class: 'support', isBirthday: false },
                { username: 'Yokal', platform: 'discord', class: 'controller', isBirthday: false },
                { username: 'Evil', platform: 'twitch', class: 'recon', isBirthday: false },
                { username: 'Ham', platform: 'discord', class: 'skirmisher', isBirthday: false },
                { username: 'Dark', platform: 'twitch', class: 'assault', isBirthday: false },
                { username: 'Ash', platform: 'discord', class: 'support', isBirthday: false },
                { username: 'Grix', platform: 'twitch', class: 'controller', isBirthday: false },
                { username: 'Mald', platform: 'discord', class: 'recon', isBirthday: false },
            ];

            let i = 0;
            const interval = setInterval(() => {
                if (i < demoPlayers.length) {
                    addPlayer(demoPlayers[i]);
                    i++;
                } else {
                    clearInterval(interval);
                    // Auto-start after demo fills
                    setTimeout(() => {
                        if (players.length >= MIN_TEAMS * PLAYERS_PER_TEAM) {
                            startCountdown();
                        }
                    }, 2000);
                }
            }, 800);
        }

        // Initialize
        document.getElementById('roomCode').textContent = roomCode;
        initSeats();
        updateStatus();

        // Check URL params
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('demo') === '1') {
            setTimeout(simulateJoins, 1000);
        }

        // Listen for real events (would be WebSocket in production)
        // For now, expose global functions for testing
        window.addPlayer = addPlayer;
        window.startCountdown = startCountdown;
    </script>
</body>

</html>
