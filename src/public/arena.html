<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WILDCARD - Battle Arena</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: transparent;
            overflow: hidden;
        }

        #arena {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .hud {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid rgba(255, 107, 0, 0.5);
            font-family: 'Orbitron', monospace;
            color: #fff;
            z-index: 100;
        }

        .hud h1 {
            font-size: 1.2rem;
            background: linear-gradient(90deg, #ff6b00, #ff9500);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hud .round {
            font-size: 0.9rem;
            color: #00ff88;
        }

        .team-scores {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .team-score {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 8px;
            text-align: center;
            font-family: 'Orbitron', monospace;
            min-width: 80px;
        }

        .team-score.team-1 {
            border: 2px solid #ff6b6b;
        }

        .team-score.team-2 {
            border: 2px solid #4ecdc4;
        }

        .team-score.team-3 {
            border: 2px solid #ffe66d;
        }

        .team-score .label {
            font-size: 0.7rem;
            color: #888;
        }

        .team-score .alive {
            font-size: 1.2rem;
            color: #00ff88;
        }

        .perk-alert {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ffd700, #ff9500);
            color: #000;
            padding: 15px 40px;
            border-radius: 30px;
            font-family: 'Orbitron', monospace;
            font-weight: bold;
            font-size: 1.2rem;
            animation: perkGlow 0.5s infinite alternate;
            z-index: 100;
        }

        @keyframes perkGlow {
            from {
                box-shadow: 0 0 20px #ffd700;
            }

            to {
                box-shadow: 0 0 40px #ffd700, 0 0 60px #ff9500;
            }
        }

        .winner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .winner-text {
            font-family: 'Orbitron', monospace;
            font-size: 4rem;
            color: #ffd700;
            text-shadow: 0 0 50px #ffd700;
            animation: winPulse 0.5s infinite alternate;
        }

        @keyframes winPulse {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.1);
            }
        }

        .winner-team {
            font-size: 2rem;
            color: #00ff88;
            margin-top: 20px;
        }

        .combat-log {
            position: fixed;
            bottom: 80px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 8px;
            max-width: 300px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.8rem;
            z-index: 100;
        }

        .log-entry {
            padding: 3px 0;
            color: #aaa;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-entry.kill {
            color: #ff4444;
        }

        .log-entry.hit {
            color: #ffaa00;
        }
    </style>
</head>

<body>
    <canvas id="arena"></canvas>

    <div class="hud">
        <h1>🃏 WILDCARD</h1>
        <div class="round">ROUND <span id="roundNum">1</span></div>
    </div>

    <div class="team-scores" id="teamScores"></div>

    <div class="perk-alert" id="perkAlert" style="display: none;">
        🃏 PERK SELECTION - 30s
    </div>

    <div class="combat-log" id="combatLog"></div>

    <div class="winner-overlay" id="winnerOverlay">
        <div class="winner-text">🏆 VICTORY! 🏆</div>
        <div class="winner-team" id="winnerTeam">Team X Wins!</div>
    </div>

    <script>
        const canvas = document.getElementById('arena');
        const ctx = canvas.getContext('2d');

        // Classes with colors and sizes based on hitbox
        const CLASS_CONFIG = {
            support: { emoji: '⚪', color: '#ffffff', size: 1.00, name: 'Support' },
            controller: { emoji: '🟣', color: '#9b59b6', size: 1.05, name: 'Controller' },
            assault: { emoji: '🔴', color: '#e74c3c', size: 1.08, name: 'Assault' },
            recon: { emoji: '🔵', color: '#3498db', size: 1.02, name: 'Recon' },
            skirmisher: { emoji: '🟢', color: '#2ecc71', size: 1.03, name: 'Skirmisher' }
        };

        const TEAM_COLORS = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3', '#dda0dd'];

        let characters = [];
        let projectiles = [];
        let effects = [];
        let combatLog = [];
        let round = 1;
        let gameState = 'waiting'; // waiting, playing, perk_selection, winner

        // Round/Perk state
        let teamsAliveAtRoundStart = 0;
        let perkSelectionTimer = 0;
        const PERK_SELECTION_TIME = 8; // seconds to pick perks
        const READY_COUNTDOWN_TIME = 3; // seconds after all picked
        let readyCountdown = 0;
        let allPlayersReady = false;
        let replicatorPulse = 0;
        let eliminatedTeamThisRound = null;

        // === HAZARD ZONES ===
        let hazardZones = []; // Array of {x, y, radius, damage, duration}
        const HAZARD_SPAWN_CHANCE = 0.25; // 25% chance per round
        const HAZARD_DAMAGE_PER_SEC = 12;
        const HAZARD_DURATION = 15; // seconds

        // === COVER BARRIERS ===
        let barriers = []; // Array of {x, y, width, height, hp}
        const BARRIER_HP = 100;

        // Replicator position (center, larger)
        function getReplicatorPos() {
            return { x: canvas.width / 2, y: canvas.height * 0.55 };
        }

        // Update ring center to always be at replicator
        function updateRingCenter() {
            const rep = getReplicatorPos();
            ringCenter = { x: rep.x, y: rep.y };
        }

        // Resize canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Character class
        class Character {
            constructor(id, username, classKey, team, x, y) {
                this.id = id;
                this.username = username;
                this.classKey = classKey;
                this.team = team;
                this.config = CLASS_CONFIG[classKey] || CLASS_CONFIG.support;

                this.x = x;
                this.y = y;
                this.homeX = x; // Remember starting position
                this.homeY = y;
                this.targetX = x;
                this.targetY = y;
                this.vx = 0;
                this.vy = 0;

                this.baseRadius = 25;
                this.radius = this.baseRadius * this.config.size;

                // Birthday bonus: 15% HP boost
                this.isBirthday = false; // Set from game data
                this.hp = 100;
                this.maxHp = 100;
                this.damageBonus = 1.0; // Multiplier
                this.alive = true;

                this.attackCooldown = 0;
                this.flashTimer = 0;
                this.deathAnimation = 0;

                // Perk selection
                this.hasPicked = false;
                this.perkChoice = null; // 1 or 2
                this.atReplicator = false;
            }

            // Apply birthday bonuses
            applyBirthdayBonus() {
                if (this.isBirthday) {
                    this.maxHp = Math.floor(100 * 1.15); // 15% HP boost
                    this.hp = this.maxHp;
                    this.damageBonus = 1.15; // 15% damage boost
                }
            }

            update(dt) {
                if (!this.alive) {
                    this.deathAnimation = Math.min(1, this.deathAnimation + dt * 2);
                    return;
                }

                // Move towards target
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // Speed: faster during perk selection, normal during combat
                const speed = (gameState === 'perk_selection') ? 200 : 80;

                if (dist > 5) {
                    this.vx = (dx / dist) * speed;
                    this.vy = (dy / dist) * speed;
                } else {
                    this.vx *= 0.8;
                    this.vy *= 0.8;

                    // Snap to target when close
                    if (dist < 2) {
                        this.x = this.targetX;
                        this.y = this.targetY;
                    }
                }

                this.x += this.vx * dt;
                this.y += this.vy * dt;

                // Random wandering (only during combat, not perk selection)
                if (gameState === 'playing' && Math.random() < 0.02) {
                    const zone = this.getTeamZone();
                    this.targetX = zone.x + (Math.random() - 0.5) * zone.w * 0.8;
                    this.targetY = zone.y + (Math.random() - 0.5) * zone.h * 0.8;
                }

                if (this.attackCooldown > 0) this.attackCooldown -= dt;
                if (this.flashTimer > 0) this.flashTimer -= dt;
            }

            getTeamZone() {
                const w = canvas.width;
                const h = canvas.height;
                const zones = [
                    { x: w * 0.2, y: h * 0.3, w: w * 0.25, h: h * 0.4 },
                    { x: w * 0.8, y: h * 0.3, w: w * 0.25, h: h * 0.4 },
                    { x: w * 0.5, y: h * 0.75, w: w * 0.3, h: h * 0.3 },
                    { x: w * 0.3, y: h * 0.7, w: w * 0.2, h: h * 0.25 },
                    { x: w * 0.7, y: h * 0.7, w: w * 0.2, h: h * 0.25 }
                ];
                return zones[this.team - 1] || zones[0];
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Death animation
                if (!this.alive) {
                    ctx.globalAlpha = 1 - this.deathAnimation;
                    ctx.scale(1 + this.deathAnimation * 0.5, 1 + this.deathAnimation * 0.5);
                }

                // BIRTHDAY FRAME - Special celebratory border
                if (this.isBirthday && this.alive) {
                    const bdayPulse = Math.sin(Date.now() / 200) * 0.2 + 1;

                    // Outer rainbow/party glow
                    const gradient = ctx.createRadialGradient(0, 0, this.radius, 0, 0, this.radius * 2);
                    gradient.addColorStop(0, 'rgba(255, 0, 128, 0.3)');
                    gradient.addColorStop(0.5, 'rgba(255, 215, 0, 0.3)');
                    gradient.addColorStop(1, 'rgba(0, 255, 128, 0)');
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 1.8 * bdayPulse, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    // Sparkle border
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 1.4, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ff69b4';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Birthday cake emoji above
                    ctx.font = '16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('🎂', 0, -this.radius - 45);

                    // "+15% HP/DMG" label
                    ctx.font = 'bold 9px Orbitron';
                    ctx.fillStyle = '#ff69b4';
                    ctx.fillText('+15% HP/DMG', 0, this.radius + 48);
                }

                // At Replicator indicator - pulsing golden ring
                if (this.atReplicator && !this.hasPicked && gameState === 'perk_selection') {
                    const ringPulse = Math.sin(Date.now() / 150) * 0.3 + 1;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 1.5 * ringPulse, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    // "PICKING..." text
                    ctx.font = 'bold 10px Orbitron';
                    ctx.fillStyle = '#ffd700';
                    ctx.textAlign = 'center';
                    ctx.fillText('PICKING...', 0, this.radius + 35);
                }

                // Picked indicator - green checkmark ring
                if (this.hasPicked && gameState === 'perk_selection') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 1.3, 0, Math.PI * 2);
                    ctx.strokeStyle = '#00ff88';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // "READY" text
                    ctx.font = 'bold 10px Orbitron';
                    ctx.fillStyle = '#00ff88';
                    ctx.textAlign = 'center';
                    ctx.fillText('✓ READY', 0, this.radius + 35);
                }

                // Flash on hit
                const isFlashing = this.flashTimer > 0;

                // Shadow
                ctx.beginPath();
                ctx.ellipse(0, this.radius * 0.9, this.radius * 0.8, this.radius * 0.25, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fill();

                // Draw class-specific shape
                const r = this.radius;
                const teamColor = TEAM_COLORS[this.team - 1];
                const classColor = isFlashing ? '#ffffff' : this.config.color;

                // Outer glow
                ctx.shadowColor = this.config.color;
                ctx.shadowBlur = 15;

                switch (this.classKey) {
                    case 'support':
                        // Shield/Cross shape (healer)
                        ctx.beginPath();
                        ctx.arc(0, 0, r, 0, Math.PI * 2);
                        ctx.fillStyle = classColor;
                        ctx.fill();
                        // Cross
                        ctx.fillStyle = teamColor;
                        ctx.fillRect(-r * 0.15, -r * 0.6, r * 0.3, r * 1.2);
                        ctx.fillRect(-r * 0.6, -r * 0.15, r * 1.2, r * 0.3);
                        break;

                    case 'controller':
                        // Hexagon (area control)
                        ctx.beginPath();
                        for (let i = 0; i < 6; i++) {
                            const angle = (i * Math.PI) / 3 - Math.PI / 6;
                            const px = Math.cos(angle) * r;
                            const py = Math.sin(angle) * r;
                            if (i === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.fillStyle = classColor;
                        ctx.fill();
                        // Inner rings
                        ctx.strokeStyle = teamColor;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2);
                        ctx.stroke();
                        break;

                    case 'assault':
                        // Spiked star (aggressive)
                        ctx.beginPath();
                        for (let i = 0; i < 8; i++) {
                            const angle = (i * Math.PI) / 4;
                            const rad = i % 2 === 0 ? r * 1.1 : r * 0.6;
                            const px = Math.cos(angle) * rad;
                            const py = Math.sin(angle) * rad;
                            if (i === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.fillStyle = classColor;
                        ctx.fill();
                        // Inner circle
                        ctx.beginPath();
                        ctx.arc(0, 0, r * 0.4, 0, Math.PI * 2);
                        ctx.fillStyle = teamColor;
                        ctx.fill();
                        break;

                    case 'recon':
                        // Diamond/Triangle (precision)
                        ctx.beginPath();
                        ctx.moveTo(0, -r);
                        ctx.lineTo(r * 0.8, r * 0.5);
                        ctx.lineTo(-r * 0.8, r * 0.5);
                        ctx.closePath();
                        ctx.fillStyle = classColor;
                        ctx.fill();
                        // Eye/scope
                        ctx.beginPath();
                        ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
                        ctx.fillStyle = '#fff';
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(0, 0, r * 0.15, 0, Math.PI * 2);
                        ctx.fillStyle = teamColor;
                        ctx.fill();
                        break;

                    case 'skirmisher':
                        // Lightning bolt / speed shape
                        ctx.beginPath();
                        ctx.arc(0, 0, r, 0, Math.PI * 2);
                        ctx.fillStyle = classColor;
                        ctx.fill();
                        // Speed lines
                        ctx.strokeStyle = teamColor;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(-r * 0.6, -r * 0.3);
                        ctx.lineTo(r * 0.3, -r * 0.3);
                        ctx.lineTo(-r * 0.1, 0);
                        ctx.lineTo(r * 0.6, 0);
                        ctx.lineTo(-r * 0.1, r * 0.3);
                        ctx.lineTo(r * 0.3, r * 0.3);
                        ctx.stroke();
                        break;

                    default:
                        ctx.beginPath();
                        ctx.arc(0, 0, r, 0, Math.PI * 2);
                        ctx.fillStyle = classColor;
                        ctx.fill();
                }

                ctx.shadowBlur = 0;

                // Team border
                ctx.strokeStyle = teamColor;
                ctx.lineWidth = 4;
                ctx.beginPath();
                if (this.classKey === 'controller') {
                    for (let i = 0; i < 6; i++) {
                        const angle = (i * Math.PI) / 3 - Math.PI / 6;
                        const px = Math.cos(angle) * r;
                        const py = Math.sin(angle) * r;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                } else if (this.classKey === 'recon') {
                    ctx.moveTo(0, -r);
                    ctx.lineTo(r * 0.8, r * 0.5);
                    ctx.lineTo(-r * 0.8, r * 0.5);
                    ctx.closePath();
                } else {
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                }
                ctx.stroke();

                // HP bar (above character)
                if (this.alive) {
                    const barWidth = r * 2.5;
                    const barHeight = 8;
                    const barY = -r - 25;

                    // Background
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(-barWidth / 2 - 2, barY - 2, barWidth + 4, barHeight + 4);

                    const hpPercent = this.hp / this.maxHp;
                    let hpColor = '#00ff88';
                    if (hpPercent < 0.3) hpColor = '#ff4444';
                    else if (hpPercent < 0.6) hpColor = '#ffaa00';

                    ctx.fillStyle = 'rgba(50, 50, 50, 0.8)';
                    ctx.fillRect(-barWidth / 2, barY, barWidth, barHeight);
                    ctx.fillStyle = hpColor;
                    ctx.fillRect(-barWidth / 2, barY, barWidth * hpPercent, barHeight);

                    // Username + Class
                    ctx.font = 'bold 14px Rajdhani';
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.fillText(this.username, 0, -r - 35);

                    // Class label with color
                    ctx.font = 'bold 11px Orbitron';
                    ctx.fillStyle = this.config.color;
                    ctx.fillText(this.config.name.toUpperCase(), 0, r + 20);
                }

                ctx.restore();
            }

            shoot(target) {
                if (this.attackCooldown > 0 || !this.alive || !target.alive) return;

                this.attackCooldown = 1.5 + Math.random();

                projectiles.push(new Projectile(
                    this.x, this.y,
                    target.x, target.y,
                    this.config.color,
                    this.team,
                    target,
                    this  // Pass attacker for damage bonus
                ));
            }

            takeDamage(amount, attacker) {
                if (!this.alive) return;

                this.hp -= amount;
                this.flashTimer = 0.15;

                if (this.hp <= 0) {
                    this.hp = 0;
                    this.alive = false;
                    addLog(`💀 ${attacker.username} eliminated ${this.username}!`, 'kill');

                    // Death explosion
                    for (let i = 0; i < 8; i++) {
                        effects.push(new Particle(this.x, this.y, this.config.color));
                    }
                } else {
                    addLog(`💥 ${attacker.username} hit ${this.username} for ${amount}`, 'hit');
                }
            }
        }

        // Projectile class
        class Projectile {
            constructor(x, y, targetX, targetY, color, team, target, attacker) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.team = team;
                this.target = target;
                this.attacker = attacker; // Track who fired for damage bonus
                this.radius = 6;
                this.speed = 400;
                this.trail = [];
                this.alive = true;

                const dx = targetX - x;
                const dy = targetY - y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                this.vx = (dx / dist) * this.speed;
                this.vy = (dy / dist) * this.speed;
            }

            update(dt) {
                // Trail
                this.trail.push({ x: this.x, y: this.y, alpha: 1 });
                if (this.trail.length > 10) this.trail.shift();
                this.trail.forEach(t => t.alpha -= dt * 3);

                this.x += this.vx * dt;
                this.y += this.vy * dt;

                // Check barrier collision FIRST
                if (checkBarrierCollision(this)) {
                    // Impact effect on barrier
                    for (let i = 0; i < 3; i++) {
                        effects.push(new Particle(this.x, this.y, '#4ecdc4'));
                    }
                    this.alive = false;
                    return;
                }
                // Check collision with target
                if (this.target && this.target.alive) {
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < this.target.radius + this.radius) {
                        // Hit! Apply attacker's damage bonus
                        const baseDamage = 15 + Math.floor(Math.random() * 20);
                        const damageBonus = this.attacker?.damageBonus || 1.0;
                        const damage = Math.floor(baseDamage * damageBonus);
                        this.target.takeDamage(damage, this.attacker || { username: 'Player' });

                        // Impact effect
                        for (let i = 0; i < 5; i++) {
                            effects.push(new Particle(this.x, this.y, '#ffff00'));
                        }

                        this.alive = false;
                    }
                }

                // Off screen
                if (this.x < -50 || this.x > canvas.width + 50 ||
                    this.y < -50 || this.y > canvas.height + 50) {
                    this.alive = false;
                }
            }

            draw() {
                const classKey = this.attacker?.classKey || 'assault';
                const classColor = this.attacker?.config?.color || '#ff6b00';

                // Trail with class color
                this.trail.forEach(t => {
                    if (t.alpha > 0) {
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, this.radius * t.alpha * 0.8, 0, Math.PI * 2);
                        ctx.fillStyle = classColor;
                        ctx.globalAlpha = t.alpha * 0.4;
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    }
                });

                ctx.save();
                ctx.translate(this.x, this.y);

                // Outer glow
                ctx.shadowColor = classColor;
                ctx.shadowBlur = 20;

                // Class-specific magic projectile shapes
                switch (classKey) {
                    case 'support':
                        // Healing orb - white sparkle
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffffff';
                        ctx.fill();
                        // Cross sparkle
                        ctx.strokeStyle = '#88ffff';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(-this.radius * 1.2, 0);
                        ctx.lineTo(this.radius * 1.2, 0);
                        ctx.moveTo(0, -this.radius * 1.2);
                        ctx.lineTo(0, this.radius * 1.2);
                        ctx.stroke();
                        break;

                    case 'controller':
                        // Void magic - purple swirl
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radius * 1.2, 0, Math.PI * 2);
                        ctx.fillStyle = '#9b59b6';
                        ctx.fill();
                        // Inner dark core
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radius * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = '#1a0a2e';
                        ctx.fill();
                        break;

                    case 'assault':
                        // Fire magic - orange/red flame
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                        const fireGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius);
                        fireGrad.addColorStop(0, '#ffff00');
                        fireGrad.addColorStop(0.5, '#ff6b00');
                        fireGrad.addColorStop(1, '#e74c3c');
                        ctx.fillStyle = fireGrad;
                        ctx.fill();
                        break;

                    case 'recon':
                        // Ice/precision magic - blue shard
                        ctx.beginPath();
                        ctx.moveTo(0, -this.radius * 1.5);
                        ctx.lineTo(this.radius * 0.6, this.radius);
                        ctx.lineTo(-this.radius * 0.6, this.radius);
                        ctx.closePath();
                        const iceGrad = ctx.createLinearGradient(0, -this.radius, 0, this.radius);
                        iceGrad.addColorStop(0, '#88ffff');
                        iceGrad.addColorStop(1, '#3498db');
                        ctx.fillStyle = iceGrad;
                        ctx.fill();
                        break;

                    case 'skirmisher':
                        // Lightning magic - green bolt
                        ctx.beginPath();
                        ctx.moveTo(-this.radius, 0);
                        ctx.lineTo(-this.radius * 0.3, -this.radius * 0.5);
                        ctx.lineTo(this.radius * 0.3, this.radius * 0.5);
                        ctx.lineTo(this.radius, 0);
                        ctx.lineTo(this.radius * 0.3, -this.radius * 0.5);
                        ctx.lineTo(-this.radius * 0.3, this.radius * 0.5);
                        ctx.closePath();
                        ctx.fillStyle = '#2ecc71';
                        ctx.fill();
                        break;

                    default:
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                        ctx.fillStyle = classColor;
                        ctx.fill();
                }

                ctx.restore();
                ctx.shadowBlur = 0;
            }
        }

        // Particle effect
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 200;
                this.vy = (Math.random() - 0.5) * 200;
                this.life = 1;
                this.radius = 4 + Math.random() * 4;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += 200 * dt; // gravity
                this.life -= dt * 2;
            }

            draw() {
                if (this.life <= 0) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * this.life, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // Combat log
        function addLog(text, type) {
            combatLog.unshift({ text, type, time: Date.now() });
            if (combatLog.length > 5) combatLog.pop();
            renderLog();
        }

        function renderLog() {
            const logEl = document.getElementById('combatLog');
            logEl.innerHTML = combatLog.map(l =>
                `<div class="log-entry ${l.type}">${l.text}</div>`
            ).join('');
        }

        // === HAZARD ZONES ===
        function spawnHazardZone() {
            if (Math.random() > HAZARD_SPAWN_CHANCE) return;

            // Spawn away from center (ring center)
            const angle = Math.random() * Math.PI * 2;
            const dist = 150 + Math.random() * 200;
            const x = ringCenter.x + Math.cos(angle) * dist;
            const y = ringCenter.y + Math.sin(angle) * dist;

            // Clamp to screen
            const clampedX = Math.max(80, Math.min(canvas.width - 80, x));
            const clampedY = Math.max(80, Math.min(canvas.height - 80, y));

            hazardZones.push({
                x: clampedX,
                y: clampedY,
                radius: 60 + Math.random() * 40,
                duration: HAZARD_DURATION
            });

            addLog(`☢️ HAZARD ZONE appeared!`, 'kill');
        }

        function updateHazardZones(dt) {
            hazardZones = hazardZones.filter(hz => {
                hz.duration -= dt;
                return hz.duration > 0;
            });

            // Apply damage to characters in hazard zones
            hazardZones.forEach(hz => {
                characters.forEach(c => {
                    if (!c.alive) return;
                    const dx = c.x - hz.x;
                    const dy = c.y - hz.y;
                    if (Math.sqrt(dx * dx + dy * dy) < hz.radius) {
                        c.hp -= HAZARD_DAMAGE_PER_SEC * dt;
                        c.flashTimer = 0.1;
                        if (c.hp <= 0) {
                            c.hp = 0;
                            c.alive = false;
                            addLog(`☢️ ${c.username} died in a hazard zone!`, 'kill');
                        }
                    }
                });
            });
        }

        function drawHazardZones() {
            hazardZones.forEach(hz => {
                const pulse = Math.sin(Date.now() / 200) * 0.1 + 0.9;

                // Outer glow
                ctx.beginPath();
                ctx.arc(hz.x, hz.y, hz.radius * pulse, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 100, 0, 0.3)';
                ctx.fill();

                // Inner pattern
                ctx.beginPath();
                ctx.arc(hz.x, hz.y, hz.radius * 0.7 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 50, 0, 0.5)';
                ctx.fill();

                // Warning icon
                ctx.font = 'bold 24px Orbitron';
                ctx.fillStyle = '#ff4444';
                ctx.textAlign = 'center';
                ctx.fillText('☢️', hz.x, hz.y + 8);

                // Timer
                ctx.font = '12px Rajdhani';
                ctx.fillStyle = '#fff';
                ctx.fillText(`${Math.ceil(hz.duration)}s`, hz.x, hz.y + 30);
            });
        }

        // === COVER BARRIERS ===
        function spawnBarriers() {
            barriers = [];
            const count = 3 + Math.floor(Math.random() * 3); // 3-5 barriers

            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5;
                const dist = 180 + Math.random() * 100;
                barriers.push({
                    x: ringCenter.x + Math.cos(angle) * dist,
                    y: ringCenter.y + Math.sin(angle) * dist,
                    width: 60 + Math.random() * 40,
                    height: 15,
                    hp: BARRIER_HP,
                    angle: angle + Math.PI / 2
                });
            }
        }

        function drawBarriers() {
            barriers.forEach(b => {
                if (b.hp <= 0) return;

                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.angle);

                // Barrier body
                const hpPercent = b.hp / BARRIER_HP;
                ctx.fillStyle = `rgba(100, 100, 150, ${0.5 + hpPercent * 0.5})`;
                ctx.fillRect(-b.width / 2, -b.height / 2, b.width, b.height);

                // Border
                ctx.strokeStyle = '#4ecdc4';
                ctx.lineWidth = 2;
                ctx.strokeRect(-b.width / 2, -b.height / 2, b.width, b.height);

                // HP indicator
                ctx.fillStyle = '#00ff88';
                ctx.fillRect(-b.width / 2, b.height / 2 + 3, b.width * hpPercent, 4);

                ctx.restore();
            });
        }

        function checkBarrierCollision(projectile) {
            for (const b of barriers) {
                if (b.hp <= 0) continue;

                // Simple distance check (approximate)
                const dx = projectile.x - b.x;
                const dy = projectile.y - b.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < b.width / 2 + projectile.radius) {
                    b.hp -= 15;
                    if (b.hp <= 0) {
                        addLog(`💥 Barrier destroyed!`, 'hit');
                    }
                    return true; // Projectile blocked
                }
            }
            return false;
        }

        // Initialize mock game
        function initMockGame() {
            characters = [];
            const classes = ['support', 'controller', 'assault', 'recon', 'skirmisher'];
            const names = ['Zeus', 'Fooz', 'Yokal', 'Evil', 'Ham', 'Dark', 'Ash', 'Grix', 'Mald',
                'Scott', 'Will', 'Hello', 'Liz', 'Mag', 'Frost'];

            // Get team count from URL: ?teams=3 or ?teams=4 or ?teams=5
            const urlParams = new URLSearchParams(window.location.search);
            const numTeams = Math.min(5, Math.max(3, parseInt(urlParams.get('teams')) || 3));

            // Team positions based on team count
            const teamZones = {
                3: [
                    { x: 0.2, y: 0.35 },  // Left
                    { x: 0.8, y: 0.35 },  // Right
                    { x: 0.5, y: 0.75 }   // Bottom center
                ],
                4: [
                    { x: 0.2, y: 0.25 },  // Top left
                    { x: 0.8, y: 0.25 },  // Top right
                    { x: 0.2, y: 0.7 },   // Bottom left
                    { x: 0.8, y: 0.7 }    // Bottom right
                ],
                5: [
                    { x: 0.5, y: 0.15 },  // Top center
                    { x: 0.15, y: 0.45 }, // Left
                    { x: 0.85, y: 0.45 }, // Right
                    { x: 0.25, y: 0.8 },  // Bottom left
                    { x: 0.75, y: 0.8 }   // Bottom right
                ]
            };

            const zones = teamZones[numTeams];
            let nameIndex = 0;

            for (let team = 1; team <= numTeams; team++) {
                const zonePos = zones[team - 1];
                const zone = {
                    x: canvas.width * zonePos.x,
                    y: canvas.height * zonePos.y
                };

                for (let i = 0; i < 3; i++) {
                    const classKey = classes[(team + i) % 5];
                    const offsetX = (Math.random() - 0.5) * 100;
                    const offsetY = (Math.random() - 0.5) * 80;

                    const char = new Character(
                        `${team}-${i}`,
                        names[nameIndex++] || `P${nameIndex}`,
                        classKey,
                        team,
                        zone.x + offsetX,
                        zone.y + offsetY
                    );

                    // Birthday demo: first player of Team 1 has birthday
                    if (team === 1 && i === 0) {
                        char.isBirthday = true;
                        char.applyBirthdayBonus();
                    }

                    characters.push(char);
                }
            }

            updateTeamScores();
            teamsAliveAtRoundStart = numTeams;

            // Initialize ring and barriers
            updateRingCenter();
            ringRadius = 1.0; // Full arena at start
            spawnBarriers();
            hazardZones = [];

            gameState = 'playing';
        }

        function updateTeamScores() {
            const scores = document.getElementById('teamScores');
            const teams = {};
            characters.forEach(c => {
                if (!teams[c.team]) teams[c.team] = { alive: 0, total: 0 };
                teams[c.team].total++;
                if (c.alive) teams[c.team].alive++;
            });

            scores.innerHTML = Object.entries(teams).map(([team, data]) => `
                <div class="team-score team-${team}">
                    <div class="label">TEAM ${team}</div>
                    <div class="alive">${data.alive}/${data.total}</div>
                </div>
            `).join('');
        }

        // Combat AI
        function runCombat() {
            characters.forEach(char => {
                if (!char.alive || char.attackCooldown > 0) return;

                // Find enemy target
                const enemies = characters.filter(c => c.team !== char.team && c.alive);
                if (enemies.length === 0) return;

                const target = enemies[Math.floor(Math.random() * enemies.length)];
                char.shoot(target);
            });
        }

        // Game loop
        let lastTime = 0;
        function gameLoop(time) {
            const dt = Math.min((time - lastTime) / 1000, 0.1);
            lastTime = time;

            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw arena background grid
            ctx.strokeStyle = 'rgba(255, 107, 0, 0.1)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            if (gameState === 'playing') {
                // Update
                characters.forEach(c => c.update(dt));
                projectiles.forEach(p => p.update(dt));
                effects.forEach(e => e.update(dt));

                // Remove dead projectiles/effects
                projectiles = projectiles.filter(p => p.alive);
                effects = effects.filter(e => e.life > 0);

                // === Ring & Hazard Updates ===
                applyRingDamage(dt);
                updateHazardZones(dt);

                // Combat
                runCombat();

                // === Draw Environment ===
                drawRing();
                drawHazardZones();
                drawBarriers();

                // Draw entities
                projectiles.forEach(p => p.draw());
                characters.forEach(c => c.draw());
                effects.forEach(e => e.draw());

                // Check if a team was eliminated (trigger perk selection)
                const aliveTeams = [...new Set(characters.filter(c => c.alive).map(c => c.team))];

                if (aliveTeams.length < teamsAliveAtRoundStart && aliveTeams.length > 1) {
                    // Team eliminated! Start perk selection
                    startPerkSelection();
                } else if (aliveTeams.length === 1) {
                    // Winner!
                    gameState = 'winner';
                    document.getElementById('winnerOverlay').style.display = 'flex';
                    document.getElementById('winnerTeam').textContent = `Team ${aliveTeams[0]} Wins!`;
                }

                updateTeamScores();
            }

            // PERK SELECTION PHASE
            if (gameState === 'perk_selection') {
                replicatorPulse += dt * 3;

                // Update characters (move to/from replicator)
                characters.forEach(c => c.update(dt));
                effects.forEach(e => e.update(dt));
                effects = effects.filter(e => e.life > 0);

                // Draw replicator (large, in center)
                drawReplicator();

                // Draw characters
                characters.forEach(c => c.draw());
                effects.forEach(e => e.draw());

                const alivePlayers = characters.filter(c => c.alive);
                const allPicked = alivePlayers.every(c => c.hasPicked);

                if (!allPlayersReady) {
                    // Still picking perks
                    perkSelectionTimer -= dt;

                    // Simulate random perk picks when at replicator
                    characters.forEach(c => {
                        if (c.alive && !c.hasPicked && c.atReplicator) {
                            // Random chance to pick
                            if (Math.random() < dt * 0.6) {
                                c.perkChoice = Math.random() < 0.5 ? 1 : 2;
                                c.hasPicked = true;
                                addLog(`🃏 ${c.username} picked Perk ${c.perkChoice}`, 'hit');

                                // Move AWAY from replicator (ready position) - further but stay on screen
                                const angle = Math.random() * Math.PI * 2;
                                const dist = 220 + Math.random() * 80; // Further away
                                let newX = getReplicatorPos().x + Math.cos(angle) * dist;
                                let newY = getReplicatorPos().y + Math.sin(angle) * dist;

                                // Clamp to stay on screen with padding
                                const padding = 60;
                                newX = Math.max(padding, Math.min(canvas.width - padding, newX));
                                newY = Math.max(padding, Math.min(canvas.height - padding, newY));

                                c.targetX = newX;
                                c.targetY = newY;
                                c.atReplicator = false;

                                // Perk effect particles
                                for (let i = 0; i < 8; i++) {
                                    effects.push(new Particle(c.x, c.y, '#ffd700'));
                                }
                            }
                        }
                    });

                    // Update perk alert
                    const timeLeft = Math.max(0, Math.ceil(perkSelectionTimer));
                    document.getElementById('perkAlert').textContent = `🃏 PERK SELECTION - ${timeLeft}s`;

                    // Check if time's up or all picked
                    if (perkSelectionTimer <= 0) {
                        // Penalize those who didn't pick
                        alivePlayers.filter(c => !c.hasPicked).forEach(c => {
                            c.hasPicked = true; // Force pick
                            c.perkChoice = Math.random() < 0.5 ? 1 : 2;
                            c.hp = Math.max(1, c.hp - 15);
                            addLog(`⚠️ ${c.username} penalized -15 HP! Auto-picked Perk ${c.perkChoice}`, 'kill');
                            c.flashTimer = 0.3;

                            // Move away - further but stay on screen
                            const angle = Math.random() * Math.PI * 2;
                            const dist = 220 + Math.random() * 80;
                            let newX = getReplicatorPos().x + Math.cos(angle) * dist;
                            let newY = getReplicatorPos().y + Math.sin(angle) * dist;

                            // Clamp to stay on screen
                            const padding = 60;
                            newX = Math.max(padding, Math.min(canvas.width - padding, newX));
                            newY = Math.max(padding, Math.min(canvas.height - padding, newY));

                            c.targetX = newX;
                            c.targetY = newY;
                        });
                        allPlayersReady = true;
                        readyCountdown = READY_COUNTDOWN_TIME;
                        addLog(`✅ All players ready! Starting in ${READY_COUNTDOWN_TIME}s...`, 'hit');
                    } else if (allPicked) {
                        allPlayersReady = true;
                        readyCountdown = READY_COUNTDOWN_TIME;
                        addLog(`✅ All players ready! Starting in ${READY_COUNTDOWN_TIME}s...`, 'hit');
                    }
                } else {
                    // All ready - countdown to start
                    readyCountdown -= dt;
                    const countdown = Math.max(0, Math.ceil(readyCountdown));
                    document.getElementById('perkAlert').textContent = `⚔️ ROUND ${round} STARTING IN ${countdown}...`;
                    document.getElementById('perkAlert').style.background = 'linear-gradient(135deg, #00ff88, #00cc66)';

                    if (readyCountdown <= 0) {
                        endPerkSelection();
                    }
                }

                updateTeamScores();
            }

            requestAnimationFrame(gameLoop);
        }

        // Perk selection helpers
        function startPerkSelection() {
            gameState = 'perk_selection';
            perkSelectionTimer = PERK_SELECTION_TIME;
            allPlayersReady = false;
            readyCountdown = 0;
            round++;
            document.getElementById('roundNum').textContent = round;
            document.getElementById('perkAlert').style.display = 'block';
            document.getElementById('perkAlert').style.background = 'linear-gradient(135deg, #ffd700, #ff9500)';

            addLog(`📢 ROUND ${round} - Team eliminated! Head to Replicator!`, 'hit');

            // Reset perk state and send ALL alive players DIRECTLY to replicator
            const replicator = getReplicatorPos();
            const alivePlayers = characters.filter(c => c.alive);
            alivePlayers.forEach((c, i) => {
                c.hasPicked = false;
                c.perkChoice = null;
                c.atReplicator = false;
                // Send DIRECTLY to replicator center (tight circle)
                const angle = (i / alivePlayers.length) * Math.PI * 2;
                const dist = 25 + (i % 2) * 15; // Very tight around center
                c.targetX = replicator.x + Math.cos(angle) * dist;
                c.targetY = replicator.y + Math.sin(angle) * dist;
            });

            teamsAliveAtRoundStart = [...new Set(characters.filter(c => c.alive).map(c => c.team))].length;
        }

        function endPerkSelection() {
            gameState = 'playing';
            document.getElementById('perkAlert').style.display = 'none';
            document.getElementById('perkAlert').style.background = 'linear-gradient(135deg, #ffd700, #ff9500)';
            allPlayersReady = false;

            // === RING CLOSES AT START OF NEW ROUND ===
            shrinkRing();

            // === SPAWN HAZARD ZONES (random chance) ===
            spawnHazardZone();

            // Respawn barriers for new round
            spawnBarriers();

            // Send everyone back to home positions (but stay inside ring!)
            const maxRadius = Math.min(canvas.width, canvas.height) * 0.48 * ringRadius * 0.8;
            characters.forEach(c => {
                if (c.alive) {
                    // Try home position, but clamp to ring
                    let targetX = c.homeX + (Math.random() - 0.5) * 80;
                    let targetY = c.homeY + (Math.random() - 0.5) * 60;

                    // Check if outside ring, if so move closer
                    const dx = targetX - ringCenter.x;
                    const dy = targetY - ringCenter.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > maxRadius) {
                        const scale = maxRadius / dist;
                        targetX = ringCenter.x + dx * scale;
                        targetY = ringCenter.y + dy * scale;
                    }

                    c.targetX = targetX;
                    c.targetY = targetY;
                    c.hasPicked = false;
                }
            });

            addLog(`⚔️ ROUND ${round} BEGINS!`, 'kill');
        }

        function drawReplicator() {
            const rep = getReplicatorPos();
            const pulse = Math.sin(replicatorPulse) * 0.15 + 1;

            ctx.save();
            ctx.translate(rep.x, rep.y);
            ctx.scale(pulse, pulse);

            // Large outer glow
            ctx.beginPath();
            ctx.arc(0, 0, 80, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 215, 0, 0.15)';
            ctx.fill();

            // Medium glow
            ctx.beginPath();
            ctx.arc(0, 0, 60, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 215, 0, 0.25)';
            ctx.fill();

            // Inner hexagon (larger)
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (i * Math.PI) / 3 - Math.PI / 6;
                const px = Math.cos(angle) * 50;
                const py = Math.sin(angle) * 50;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 215, 0, 0.5)';
            ctx.fill();
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Center icon (larger)
            ctx.font = '36px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🔧', 0, 0);

            // Label
            ctx.font = 'bold 16px Orbitron';
            ctx.fillStyle = '#ffd700';
            ctx.fillText('REPLICATOR', 0, 70);

            ctx.restore();

            // Check if characters arrived at replicator (larger radius)
            characters.forEach(c => {
                if (c.alive && !c.hasPicked) {
                    const dx = c.x - rep.x;
                    const dy = c.y - rep.y;
                    if (Math.sqrt(dx * dx + dy * dy) < 100) {
                        c.atReplicator = true;
                    }
                }
            });
        }

        // Start
        initMockGame();
        requestAnimationFrame(gameLoop);
    </script>
</body>
