        // === SOUL ORB SYSTEM ===
        function createSoulOrb(x, y, owner, collectedOrbs = 0) {
            const orbGroup = new THREE.Group();

            // Get colors - class for center, team blend for glow
            const classColor = owner.config?.colorHex || 0xffffff;
            const teamColor = owner.teamBlendedColor || TEAM_COLORS_HEX[owner.team - 1] || 0xffffff;

            // Outer glow shell - TEAM BLENDED COLOR
            const orbMesh = new THREE.Mesh(
                new THREE.SphereGeometry(SOUL_ORB_RADIUS, 16, 16),
                new THREE.MeshBasicMaterial({
                    color: teamColor,
                    transparent: true,
                    opacity: 0.5
                })
            );
            orbGroup.add(orbMesh);

            // Inner core - CLASS COLOR (white, blue, purple, red, or green)
            const innerGlow = new THREE.Mesh(
                new THREE.SphereGeometry(SOUL_ORB_RADIUS * 0.5, 8, 8),
                new THREE.MeshBasicMaterial({ color: classColor })
            );
            orbGroup.add(innerGlow);

            // Light uses team color for ambient glow
            const light = new THREE.PointLight(teamColor, 0.5, 50);
            orbGroup.add(light);

            orbGroup.position.set(x, PLATFORM_HEIGHT + 30, y);
            scene.add(orbGroup);

            soulOrbs.push({
                x, y,
                mesh: orbGroup,
                owner: owner,
                collectedOrbs: collectedOrbs, // Orbs this player had collected
                age: 0
            });

            addLog(`💫 ${owner.username} dropped a soul orb!`, 'heal');
        }

        function updateSoulOrbs(dt) {
            for (let i = soulOrbs.length - 1; i >= 0; i--) {
                const orb = soulOrbs[i];
                orb.age += dt;

                // Floating animation
                orb.mesh.position.y = PLATFORM_HEIGHT + 30 + Math.sin(orb.age * 2) * 5;
                orb.mesh.rotation.y += dt * 2;

                // Check for player collection
                const alivePlayers = players.filter(p => p.alive);
                for (const p of alivePlayers) {
                    // Can't collect own orb
                    if (p.id === orb.owner.id) continue;

                    const dist = Math.sqrt((p.x - orb.x) ** 2 + (p.y - orb.y) ** 2);
                    if (dist < SOUL_ORB_RADIUS + p.radius) {
                        // Collect orb!
                        p.collectedSoulOrbs = (p.collectedSoulOrbs || 0) + 1 + orb.collectedOrbs;
                        addLog(`✨ ${p.username} collected ${orb.owner.username} 's soul!`, 'heal');

                        // Remove orb
                        scene.remove(orb.mesh);
                        soulOrbs.splice(i, 1);
                        break;
                    }
                }
            }
        }

        // === RECON MARK FUNCTIONS ===
        function createReconMark(x, y, ownerTeam) {
            const sizeMultiplier = !domeActive ? RECON_MARK_DOME_BONUS : 1;
            const radius = RECON_MARK_RADIUS * sizeMultiplier;

            // Diamond shape (rotated square) - electric yellow
            const markGeo = new THREE.RingGeometry(radius * 0.8, radius, 4);
            const markMat = new THREE.MeshBasicMaterial({
                color: 0xffdd00,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.4
            });
            const mark = new THREE.Mesh(markGeo, markMat);
            mark.rotation.x = -Math.PI / 2;
            mark.rotation.z = Math.PI / 4; // Rotate to diamond
            mark.position.set(x, PLATFORM_HEIGHT + 2, y);
            scene.add(mark);

            // Inner electric glow
            const innerGeo = new THREE.CircleGeometry(radius * 0.3, 4);
            const innerMat = new THREE.MeshBasicMaterial({
                color: 0xffffaa,
                transparent: true,
                opacity: 0.6
            });
            const inner = new THREE.Mesh(innerGeo, innerMat);
            inner.rotation.x = -Math.PI / 2;
            inner.rotation.z = Math.PI / 4;
            inner.position.set(x, PLATFORM_HEIGHT + 3, y);
            scene.add(inner);

            // Beam mesh (invisible until triggered)
            const beamGeo = new THREE.CylinderGeometry(3, 8, 300, 8);
            const beamMat = new THREE.MeshBasicMaterial({
                color: 0xffff00,
                transparent: true,
                opacity: 0
            });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            beam.position.set(x, PLATFORM_HEIGHT + 150, y);
            scene.add(beam);

            reconMarks.push({
                x, y,
                ownerTeam,
                mesh: mark,
                innerMesh: inner,
                beamMesh: beam,
                radius,
                triggered: false,
                triggerTimer: 0,
                active: true,
                damageMultiplier: sizeMultiplier
            });

            addLog('⚡ Recon placed an ELECTRIC MARK!', 'heal');
        }

        function updateReconMarks(dt) {
            for (let i = reconMarks.length - 1; i >= 0; i--) {
                const mark = reconMarks[i];
                if (!mark.active) continue;

                // Electric pulse animation
                const pulse = 0.3 + Math.sin(Date.now() * 0.01) * 0.15;
                mark.mesh.material.opacity = pulse;
                mark.innerMesh.material.opacity = 0.5 + Math.sin(Date.now() * 0.02) * 0.3;
                mark.innerMesh.rotation.z += dt * 2; // Spin

                // Remove mark if ring shrinks past it
                const markDistFromCenter = Math.sqrt(mark.x ** 2 + mark.y ** 2);
                if (markDistFromCenter > currentRingRadius - mark.radius) {
                    scene.remove(mark.mesh);
                    scene.remove(mark.innerMesh);
                    scene.remove(mark.beamMesh);
                    reconMarks.splice(i, 1);
                    continue;
                }

                // Check for enemies in mark
                const enemies = players.filter(p => p.alive && p.team !== mark.ownerTeam);
                let enemyInMark = false;

                enemies.forEach(enemy => {
                    const dist = Math.sqrt((enemy.x - mark.x) ** 2 + (enemy.y - mark.y) ** 2);
                    if (dist < mark.radius * 0.5) {
                        enemyInMark = true;

                        if (!mark.triggered) {
                            mark.triggered = true;
                            mark.triggerTimer = RECON_MARK_TRIGGER_DURATION;
                            addLog(`⚡ ${enemy.username} triggered RECON MARK!`, 'kill');
                        }

                        // Deal draining damage while in mark
                        const dps = RECON_MARK_BASE_DPS * mark.damageMultiplier;
                        enemy.hp -= dps * dt;

                        // Show beam from moon to enemy
                        mark.beamMesh.material.opacity = 0.6 + Math.sin(Date.now() * 0.03) * 0.3;
                        mark.beamMesh.position.x = enemy.x;
                        mark.beamMesh.position.z = enemy.y;
                        mark.beamMesh.scale.y = 1 + Math.sin(Date.now() * 0.05) * 0.1;
                    }
                });

                // Fade beam when no enemy in mark
                if (!enemyInMark) {
                    mark.beamMesh.material.opacity *= 0.9;
                }

                // Triggered marks count down and disappear
                if (mark.triggered) {
                    mark.triggerTimer -= dt;
                    mark.mesh.material.color.setHex(0xff6600); // Turn orange when triggered

                    if (mark.triggerTimer <= 0) {
                        // Remove mark
                        scene.remove(mark.mesh);
                        scene.remove(mark.innerMesh);
                        scene.remove(mark.beamMesh);
                        reconMarks.splice(i, 1);
                    }
                }
            }
        }


        // Update map features (called in game loop)
        function updateMapFeatures(dt) {
            if (gameState !== 'playing') return;

            const alivePlayers = players.filter(p => p.alive);
            const scale = getGrowthScale();

            // === DOME POP CHECK: Players TOO BIG for dome ===
            // Calculate total player "footprint" vs dome area
            if (!domePopTriggered && alivePlayers.length > 0) {
                let totalPlayerArea = 0;
                alivePlayers.forEach(p => {
                    const r = (p.radius || 25) * scale;
                    totalPlayerArea += Math.PI * r * r;
                });
                const domeArea = Math.PI * currentRingRadius * currentRingRadius;
                const fillRatio = totalPlayerArea / domeArea;

                // If players take up more than 60% of dome floor, POP!
                if (fillRatio > 0.6) {
                    domePopTriggered = true;
                    domePopTimer = DOME_POP_DURATION;
                    domeActive = false;
                    addLog('💥 DOME OVERLOADED! Players too big!', 'kill');
                }
            }

            // Bounce pads - hide well before ring edge (50 unit safety buffer)
            bouncePads.forEach(pad => {
                const distFromCenter = Math.sqrt(pad.x ** 2 + pad.y ** 2);
                const safetyBuffer = 80; // Hide before they become dangerous
                // Use correct property names: rings (array), glow, border
                const wasVisible = pad.rings && pad.rings[0] ? pad.rings[0].visible : false;
                const visible = distFromCenter < currentRingRadius - BOUNCE_PAD_RADIUS - safetyBuffer;
                if (pad.rings) pad.rings.forEach(r => r.visible = visible);
                if (pad.glow) pad.glow.visible = visible;
                if (pad.border) pad.border.visible = visible;

                // Trigger dome pop when a bounce pad disappears!
                if (wasVisible && !visible && !domePopTriggered) {
                    domePopTriggered = true;
                    domePopTimer = DOME_POP_DURATION;
                    domeActive = false; // DOME IS NOW DOWN - players can fall off!
                    addLog('💥 DOME SHATTERED! Ring-outs enabled!', 'kill');
                }

                if (!visible) return;

                // Pulse effect on glow circle
                if (pad.glow) pad.glow.material.opacity = 0.6 + Math.sin(Date.now() * 0.005) * 0.2;

                if (pad.cooldown > 0) {
                    pad.cooldown -= dt;
                    return;
                }

                alivePlayers.forEach(p => {
                    const distToPad = Math.sqrt((p.x - pad.x) ** 2 + (p.y - pad.y) ** 2);
                    if (distToPad < BOUNCE_PAD_RADIUS) {
                        // Calculate jump height based on weight (lighter = higher jump)
                        const weight = p.config.weight || 1.0;
                        const weightMult = 1.0 / weight; // Inverse: 0.7 weight = 1.43x, 1.5 weight = 0.67x

                        // DAMPEN horizontal momentum (prevent zooming)
                        p.vx *= 0.6;
                        p.vy *= 0.6;

                        // STRONG VERTICAL LAUNCH - anti-gravity style!
                        const baseJump = 250; // Much stronger launch force
                        const verticalLift = baseJump * weightMult; // 167-357 based on weight
                        p.jumpVelocity = Math.min((p.jumpVelocity || 0) + verticalLift, 400); // Higher cap

                        addLog(`🚀 ${p.username} jumped!`, 'bounce');
                        pad.cooldown = 0.8;
                    }
                });
            });

            // Portals - hide well before ring edge (80 unit safety buffer)
            const portalSafetyBuffer = 80;
            portals.forEach(pair => {
                const distA = Math.sqrt(pair.a.x ** 2 + pair.a.y ** 2);
                const distB = Math.sqrt(pair.b.x ** 2 + pair.b.y ** 2);
                pair.a.mesh.visible = distA < currentRingRadius - PORTAL_RADIUS - portalSafetyBuffer;
                pair.a.inner.visible = distA < currentRingRadius - PORTAL_RADIUS - portalSafetyBuffer;
                pair.b.mesh.visible = distB < currentRingRadius - PORTAL_RADIUS - portalSafetyBuffer;
                pair.b.inner.visible = distB < currentRingRadius - PORTAL_RADIUS - portalSafetyBuffer;

                // Animate portals
                pair.a.mesh.rotation.z += dt * 3;
                pair.b.mesh.rotation.z += dt * 3;
                pair.a.inner.rotation.z -= dt * 2;
                pair.b.inner.rotation.z -= dt * 2;

                if (pair.cooldown > 0) {
                    pair.cooldown -= dt;
                    return;
                }

                if (!pair.a.mesh.visible && !pair.b.mesh.visible) return;

                alivePlayers.forEach(p => {
                    if (pair.a.mesh.visible) {
                        const distToA = Math.sqrt((p.x - pair.a.x) ** 2 + (p.y - pair.a.y) ** 2);
                        if (distToA < PORTAL_RADIUS && pair.b.mesh.visible) {
                            p.x = pair.b.x;
                            p.y = pair.b.y;
                            pair.cooldown = 1.0;
                            addLog(`🌀 ${p.username} teleported!`, 'heal');
                        }
                    }
                    if (pair.b.mesh.visible) {
                        const distToB = Math.sqrt((p.x - pair.b.x) ** 2 + (p.y - pair.b.y) ** 2);
                        if (distToB < PORTAL_RADIUS && pair.a.mesh.visible) {
                            p.x = pair.a.x;
                            p.y = pair.a.y;
                            pair.cooldown = 1.0;
                            addLog(`🌀 ${p.username} teleported!`, 'heal');
                        }
                    }
                });
            });

            // === SKY PORTALS - launch players into the air ===
            const skyPortalsVisible = currentRingRadius > 350; // Hide earlier - only visible when ring is large

            skyPortals.forEach(pair => {
                // Show/hide based on ring size
                pair.ground.mesh.visible = skyPortalsVisible;
                pair.ground.inner.visible = skyPortalsVisible;
                pair.sky.mesh.visible = skyPortalsVisible;
                pair.sky.inner.visible = skyPortalsVisible;

                if (!skyPortalsVisible) return;
                if (pair.cooldown > 0) {
                    pair.cooldown -= dt;
                    return;
                }

                // Animate
                pair.ground.mesh.rotation.z += dt * 2;
                pair.sky.mesh.rotation.z -= dt * 2;
                pair.sky.inner.material.opacity = 0.4 + Math.sin(Date.now() * 0.005) * 0.2;

                // Check for AIRBORNE players reaching the SKY portal
                alivePlayers.forEach(p => {
                    // Must be high enough in the air (jumped up to sky portal)
                    const playerAltitude = p.jumpHeight || 0;
                    const skyPortalAltitude = SKY_PORTAL_HEIGHT - 30; // Threshold to enter

                    if (playerAltitude > skyPortalAltitude) {
                        // Check horizontal distance to sky portal
                        const distToSky = Math.sqrt((p.x - pair.sky.x) ** 2 + (p.y - pair.sky.y) ** 2);
                        if (distToSky < PORTAL_RADIUS * 1.5) {
                            // Teleport to GROUND portal exit
                            p.x = pair.ground.x + (Math.random() - 0.5) * 20;
                            p.y = pair.ground.y + (Math.random() - 0.5) * 20;
                            p.jumpHeight = 30; // Land softly
                            p.jumpVelocity = -20; // Gentle descent
                            pair.cooldown = 1.5;
                            addLog(`🌀 ${p.username} teleported from the sky!`, 'heal');
                        }
                    }
                });
            });

            // Ramps - hide if outside ring (empty array now)
            ramps.forEach(ramp => {
                const distFromCenter = Math.sqrt(ramp.x ** 2 + ramp.y ** 2);
                ramp.mesh.visible = distFromCenter < currentRingRadius - ramp.length / 2;
            });
        }

        function updateGroundWaves(dt) {

                wave.ring.scale.setScalar(wave.scale);

                // Fade out as it expands
                const progress = (wave.scale * 25) / wave.targetRadius;
                wave.opacity = 0.6 * (1 - progress);
                wave.ring.material.opacity = Math.max(0, wave.opacity);

                // Remove when reached edge or faded out
                if (wave.scale * 25 >= wave.targetRadius || wave.opacity <= 0) {
                    scene.remove(wave.ring);
                    wave.ring.geometry.dispose();
                    wave.ring.material.dispose();
                    groundWaves.splice(i, 1);
                }
            }
        }

        // Update replicator visuals with smooth color lerping
        function updateReplicatorVisuals(triggerWave = false) {
            let targetHex;
            if (replicatorState === 'neutral') {
                targetHex = 0x00cccc; // Cyan
            } else if (replicatorState === 'active') {
                targetHex = 0x00ff00; // Green
            } else {
                targetHex = 0xff0000; // Red (locked)
            }
            replicatorActive = (replicatorState === 'active'); // Backward compat
            replicatorTargetColor.setHex(targetHex);

            // Spawn ground wave on state change
            if (triggerWave) {
                spawnReplicatorWave(targetHex);
            }
        }

        // Lerp replicator colors each frame
        function lerpReplicatorColor(dt) {
            const lerpFactor = Math.min(1, dt * REPLICATOR_COLOR_LERP_SPEED);
            replicatorCurrentColor.lerp(replicatorTargetColor, lerpFactor);

            pillarMaterial.color.copy(replicatorCurrentColor);
            pillarMaterial.emissive.copy(replicatorCurrentColor);
            pillarRing.material.color.copy(replicatorCurrentColor);
            pillarLight.color.copy(replicatorCurrentColor);
            highlightRingMat.color.copy(replicatorCurrentColor); // Highlight ring follows state

            // Update hole interior colors - STAY DARK with only tiny tint for depth
            holeInteriorMaterials.forEach(({ mat, intensity }) => {
                // Base is almost black, with just a subtle hint of the replicator color
                const tintAmount = 0.05; // Only 5% of replicator color
                mat.color.setRGB(
                    intensity + replicatorCurrentColor.r * tintAmount * intensity,
                    intensity + replicatorCurrentColor.g * tintAmount * intensity,
                    intensity + replicatorCurrentColor.b * tintAmount * intensity
                );
            });
        }

        // Replicator update (called in animate loop)
        function updateReplicator(dt) {
            // === RISING ANIMATION (can happen in lobby when first player joins) ===
            if (replicatorRising && !replicatorRisen) {
                pillarGroup.visible = true;
                replicatorRiseY += 60 * dt; // Rise speed (same as sink speed)
                pillarGroup.position.y = PLATFORM_HEIGHT + replicatorRiseY;

                // Fade in as it rises
                const riseProgress = Math.min(1, (replicatorRiseY + 80) / 80); // -80 to 0 = 0 to 1
                pillarMaterial.opacity = 0.9 * riseProgress;
                pillarRing.material.opacity = 0.4 * riseProgress;
                pillarLight.intensity = 1.0 * riseProgress;

                // Fully risen
                if (replicatorRiseY >= 0) {
                    replicatorRiseY = 0;
                    replicatorRisen = true;
                    replicatorRising = false;
                    pillarGroup.position.y = PLATFORM_HEIGHT;
                    pillarMaterial.opacity = 0.9;
                    pillarRing.material.opacity = 0.4;
                    pillarLight.intensity = 1.0;
                    addLog('🔵 REPLICATOR ACTIVATED', 'info');
                    spawnReplicatorWave(0x00cccc);
                }
                return; // Don't process other logic while rising
            }

            // Skip ALL logic if not in playing state
            if (gameState !== 'playing') return;

            // === ONCE GONE, NEVER RETURN - skip ALL logic including collisions ===
            if (replicatorGone) {
                pillarGroup.visible = false;
                return; // No collisions, no damage, nothing!
            }

            // Check if replicator should sink (first time <=4 players alive)
            const aliveCount = players.filter(p => p.alive).length;

            // Trigger sinking animation when <=4 players for the first time
            if (aliveCount <= 4 && !replicatorSinking && !replicatorGone) {
                replicatorSinking = true;
                addLog('⬇️ REPLICATOR DESCENDING...', 'kill');
            }

            // Animate sinking
            if (replicatorSinking) {
                replicatorSinkY -= 60 * dt; // Sink speed
                pillarGroup.position.y = PLATFORM_HEIGHT + replicatorSinkY;

                // Fade out as it sinks
                const sinkProgress = Math.min(1, -replicatorSinkY / 60); // 60 units = full sink
                pillarMaterial.opacity = 0.9 * (1 - sinkProgress);
                pillarRing.material.opacity = 0.4 * (1 - sinkProgress);
                pillarLight.intensity = 1.0 * (1 - sinkProgress);

                // Fully sunk - mark as permanently gone
                if (replicatorSinkY <= -60) {
                    replicatorGone = true;
                    replicatorSinking = false;
                    pillarGroup.visible = false;
                    addLog('💀 REPLICATOR GONE FOREVER', 'kill');
                    return;
                }
            }

            // Skip normal logic if sinking
            if (replicatorSinking) return;

            replicatorTimer -= dt;
            if (replicatorTimer <= 0) {
                // State machine: neutral -> locked -> active -> locked -> active ...
                if (replicatorState === 'neutral') {
                    replicatorState = 'locked';
                    addLog('🔴 REPLICATOR LOCKED', 'kill');
                } else if (replicatorState === 'locked') {
                    replicatorState = 'active';
                    addLog('🟢 REPLICATOR ACTIVE', 'heal');
                } else {
                    replicatorState = 'locked';
                    addLog('🔴 REPLICATOR LOCKED', 'kill');
                }
                replicatorTimer = REPLICATOR_TOGGLE_TIME;
                updateReplicatorVisuals(true); // true = trigger ground wave
            }

            // Pulsing effect
            const pulse = 0.5 + Math.sin(Date.now() * 0.005) * 0.2;
            pillarMaterial.emissiveIntensity = pulse;
            pillarRing.material.opacity = 0.3 + pulse * 0.2;
            pillarLight.intensity = 1.0 + pulse;

            // Handle players going to/from replicator
            players.filter(p => p.alive).forEach(p => {
                const distToReplicator = Math.sqrt(p.x * p.x + p.y * p.y);

                // PENALTY: Touching replicator while LOCKED (red) = 30 damage!
                if (replicatorState === 'locked' && distToReplicator < REPLICATOR_RADIUS + 10) {
                    // Cooldown to prevent instant death
                    if (!p.replicatorDamageCooldown || p.replicatorDamageCooldown <= 0) {
                        p.hp -= 30;
                        p.replicatorDamageCooldown = 1.0; // 1 second between hits

                        // Tiny burst emote above player (instead of combat feed)
                        const orb = orbs.find(o => o.player === p);
                        if (orb) {
                            const emote = document.createElement('div');
                            emote.textContent = '💥';
                            emote.style.cssText = `
                                position: fixed;
                                font-size: 1.4rem;
                                pointer-events: none;
                                z-index: 1000;
                                animation: replicatorBurst 0.6s ease-out forwards;
                            `;
                            // Position above player
                            const pos = orb.group.position.clone();
                            pos.y += 60;
                            pos.project(camera);
                            emote.style.left = ((pos.x * 0.5 + 0.5) * window.innerWidth) + 'px';
                            emote.style.top = ((1 - (pos.y * 0.5 + 0.5)) * window.innerHeight) + 'px';
                            document.body.appendChild(emote);
                            setTimeout(() => emote.remove(), 600);
                        }

                        // Push player away
                        const angle = Math.atan2(p.y, p.x);
                        p.vx += Math.cos(angle) * 200;
                        p.vy += Math.sin(angle) * 200;
                    }
                }

                // Update damage cooldown
                if (p.replicatorDamageCooldown > 0) {
                    p.replicatorDamageCooldown -= dt;
                }

                // Player wants to collect a perk
                if (p.pendingPerk && replicatorActive) {
                    // Move towards replicator
                    p.targetX = 0;
                    p.targetY = 0;
                    p.goingToReplicator = true;

                    // Check if at replicator
                    if (distToReplicator < REPLICATOR_RADIUS) {
                        // Collect the perk
                        const perk = PERKS_A.find(pk => pk.id === p.pendingPerk) || PERKS_B.find(pk => pk.id === p.pendingPerk);
                        if (perk && perk.effect) {
                            perk.effect(p);
                            addLog(`✨ ${p.username} collected ${perk.name}!`, 'heal');
                        }
                        p.pendingPerk = null;
                        p.replicatorCooldown = REPLICATOR_RETURN_DELAY;
                    }
                }

                // Player leaving replicator area
                if (p.goingToReplicator && !p.pendingPerk) {
                    if (p.replicatorCooldown > 0) {
                        p.replicatorCooldown -= dt;
                        // Stay near replicator briefly
                        p.targetX = (Math.random() - 0.5) * REPLICATOR_RADIUS;
                        p.targetY = (Math.random() - 0.5) * REPLICATOR_RADIUS;
                    } else {
                        // Return to combat
                        p.goingToReplicator = false;
                        p.targetX = p.homeX;
                        p.targetY = p.homeY;
                    }
                }
            });
        }

        // Queue a perk for a player (called from chat command)
        window.queuePerk = function (username, perkId) {
            const player = players.find(p => p.username.toLowerCase() === username.toLowerCase() && p.alive);
            if (!player) return { success: false, message: 'Player not found or eliminated' };
            if (!replicatorActive) return { success: false, message: 'Replicator is locked!' };
            if (player.pendingPerk) return { success: false, message: 'Already going to replicator' };

            const perk = PERKS_A.find(pk => pk.id === perkId) || PERKS_B.find(pk => pk.id === perkId);
            if (!perk) return { success: false, message: 'Unknown perk' };

            player.pendingPerk = perkId;
            addLog(`📍 ${player.username} heading to replicator for ${perk.name}`, 'hit');
            return { success: true, message: `${player.username} is going to collect ${perk.name}` };
        };

        // === BLEED TRAIL SYSTEM ===
        // Blood drops on floor that fade over time
        const bloodTrails = [];
        const BLOOD_FADE_TIME = 3; // seconds (reduced from 5)
        const BLOOD_DROP_INTERVAL = 0.4; // seconds between drops (slower - was 0.15)
        const MAX_BLOOD_DROPS = 20; // Limit for performance

        function createBloodDrop(x, y) {
            // Skip if at max
            if (bloodTrails.length >= MAX_BLOOD_DROPS) return;

            const size = 4 + Math.random() * 6;
            const geometry = new THREE.CircleGeometry(size, 6); // 6 segments instead of 8
            const material = new THREE.MeshBasicMaterial({
                color: 0x8b0000, // Dark red
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide
            });
            const drop = new THREE.Mesh(geometry, material);
            drop.rotation.x = -Math.PI / 2;
            drop.position.set(x + (Math.random() - 0.5) * 10, PLATFORM_HEIGHT + 1, y + (Math.random() - 0.5) * 10);
            scene.add(drop);
            bloodTrails.push({
                mesh: drop,
                life: BLOOD_FADE_TIME,
                maxLife: BLOOD_FADE_TIME
            });
        }

        function updateBloodTrails(dt) {
            for (let i = bloodTrails.length - 1; i >= 0; i--) {
                const trail = bloodTrails[i];
                trail.life -= dt;
                // Fade out
                trail.mesh.material.opacity = 0.8 * (trail.life / trail.maxLife);
                // Remove when expired
                if (trail.life <= 0) {
                    scene.remove(trail.mesh);
                    trail.mesh.geometry.dispose();
                    trail.mesh.material.dispose();
                    bloodTrails.splice(i, 1);
                }
            }
        }

        // === ORB CLASS ===
        // Visual size scaling - amplified for clarity
        // Hitbox: Support 1.00, Recon 1.02, Skirmisher 1.03, Controller 1.05, Assault 1.08
        // Visual: Support smallest → Assault largest
        const VISUAL_SIZES = {
            support: { shell: 20, core: 8, ring: [22, 26] },      // Smallest - nimble
            recon: { shell: 22, core: 9, ring: [24, 28] },        // Small - agile
            skirmisher: { shell: 24, core: 10, ring: [26, 30] },  // Medium-small
            controller: { shell: 28, core: 11, ring: [30, 34] },  // Large - anchor
            assault: { shell: 32, core: 13, ring: [34, 38] }      // Largest - tank
        };

        // === PHASE 1: ELEMENTAL CLASS GEOMETRIES ===
        // Each class has unique shape matching their element
        function createClassGeometry(classKey, size) {
            switch (classKey) {
                case 'assault':
                    // INVERTED CONE - Flat top for eye, pointed bottom (red)
                    // ConeGeometry(radius, height, radialSegments) - then flip upside down
                    return { isInvertedCone: true, size: size };

                case 'support':
                    // LAYING HEART - Divine healing heart on its side, shoots from tip (white)
                    // Returns special object, constructor builds the heart
                    return { isHeart: true, size: size };

                case 'recon':
                    // CROSSHAIRS TARGET - Precision sniper scope, eye is the bullseye (blue)
                    // Returns special object, constructor builds the crosshairs group
                    return { isCrosshairs: true, size: size };


                case 'controller':
                    // DRIPPY DIAMOND - Corruption sludge dripping from an octahedron (purple/black)
                    // Returns special object, constructor builds the drips
                    return { isDrippyDiamond: true, size: size };

                case 'skirmisher':
                    // BLOOMING FLOWER - Petals rotate around seed core (green)
                    // Returns special object, constructor builds the petals
                    return { isFlower: true, size: size };

                default:
                    return new THREE.SphereGeometry(size, 24, 24);
            }
        }

        class Orb3D {
            constructor(player, thumbnailMode = false) {
                this.player = player;
                this.thumbnailMode = thumbnailMode; // If true, don't add to global scene
                this.group = new THREE.Group();

                const sizes = VISUAL_SIZES[player.classKey];

                // === ELEMENTAL MATERIALS ===
                const elementColors = {
                    assault: 0xff2200,     // Fire red
                    support: 0xffffff,     // Divine white
                    recon: 0x00aaff,       // Ice blue
                    controller: 0x6600aa,  // Corruption purple
                    skirmisher: 0x22cc44   // Nature green
                };
                const elementColor = elementColors[player.classKey] || player.config.colorHex;

                // Shell - elemental geometry with class-specific material
                const shellGeo = createClassGeometry(player.classKey, sizes.shell);
                const isLowPoly = ['assault', 'controller'].includes(player.classKey);

                // Debug: Log what geometry was created for each class
                console.log(`🎨 ${player.username} (${player.classKey}): shellGeo = ${JSON.stringify(shellGeo)}`);

                // Special case: Support gets a heart shape
                if (shellGeo && shellGeo.isHeart) {
                    // === SUPPORT: PARAMETRIC HEART CURVE (laying flat) ===
                    this.shell = new THREE.Group();
                    const heartMat = new THREE.MeshPhongMaterial({
                        color: 0xffffff,
                        emissive: 0xffcccc,
                        emissiveIntensity: 0.4,
                        shininess: 100,
                        side: THREE.DoubleSide
                    });

                    const scale = shellGeo.size * 0.045; // LARGER

                    // Generate heart shape using parametric equation
                    // x = 16sin³(t)
                    // y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
                    const heartShape = new THREE.Shape();
                    const segments = 50;

                    for (let i = 0; i <= segments; i++) {
                        const t = (i / segments) * Math.PI * 2;
                        const x = 16 * Math.pow(Math.sin(t), 3) * scale;
                        const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;

                        if (i === 0) {
                            heartShape.moveTo(x, y);
                        } else {
                            heartShape.lineTo(x, y);
                        }
                    }

                    // Extrude for 3D depth
                    const extrudeSettings = {
                        depth: scale * 6,
                        bevelEnabled: true,
                        bevelThickness: scale * 1.5,
                        bevelSize: scale * 1,
                        bevelSegments: 2
                    };

                    const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
                    const heartMesh = new THREE.Mesh(heartGeo, heartMat);

                    // LAY FLAT: rotate so lobes at back, tip forward, top face up
                    heartMesh.rotation.x = Math.PI / 2;  // Lay horizontal
                    heartMesh.rotation.y = Math.PI;      // Tip pointing forward (+Z)
                    heartMesh.position.set(0, -scale * 3, 0); // Lower slightly
                    this.shell.add(heartMesh);
                    this.heartDepth = scale * 6; // Store for eye positioning

                    this.isHeart = true; // Flag for gentle bob animation
                } else if (shellGeo && shellGeo.isInvertedCone) {
                    // ASSAULT: Inverted cone with TORNADO SPIRAL wrapping around it
                    const assaultMat = new THREE.MeshPhongMaterial({
                        color: 0xff4422,
                        emissive: 0xff2200,
                        emissiveIntensity: 0.3,
                        shininess: 80,
                        flatShading: true
                    });

                    // Shell group - everything spins together
                    this.shell = new THREE.Group();

                    // Cone with 6 sides for angular look
                    const coneH = shellGeo.size * 1.0;
                    const coneR = shellGeo.size * 0.55;
                    const cone = new THREE.Mesh(
                        new THREE.ConeGeometry(coneR, coneH, 6),
                        assaultMat
                    );
                    cone.rotation.x = Math.PI; // Flip so flat top is up, tip DOWN
                    this.shell.add(cone);
                    this.assaultCone = cone;

                    // SPIRAL STRIPE - physically hugs the cone body as part of its design
                    const spiralMat = new THREE.MeshBasicMaterial({
                        color: 0xff6600,
                        transparent: true,
                        opacity: 0.9
                    });
                    const spiralPoints = [];
                    const spiralTurns = 5;
                    const spiralSegments = 80;

                    for (let i = 0; i <= spiralSegments; i++) {
                        const t = i / spiralSegments; // 0 = top, 1 = bottom
                        const angle = t * spiralTurns * Math.PI * 2;

                        // Y follows cone from top to tip
                        const y = coneH * 0.5 - t * coneH;

                        // EXACT CONE SURFACE - spiral hugs the body
                        const coneRadiusAtY = coneR * (1 - t); // Exact cone surface at this Y
                        const spiralRadius = coneRadiusAtY; // NO offset - directly on surface

                        spiralPoints.push(new THREE.Vector3(
                            Math.cos(angle) * spiralRadius,
                            y,
                            Math.sin(angle) * spiralRadius
                        ));
                    }

                    const spiralCurve = new THREE.CatmullRomCurve3(spiralPoints);
                    const spiralGeo = new THREE.TubeGeometry(spiralCurve, 80, 1.2, 6, false); // Thinner tube
                    const spiralMesh = new THREE.Mesh(spiralGeo, spiralMat);
                    // NO rotation flip - spiral is already correctly oriented
                    this.shell.add(spiralMesh);
                    this.spiralMesh = spiralMesh;
                    this.isInvertedCone = true;
                } else if (shellGeo && shellGeo.isCrosshairs) {
                    // === RECON: CENTRAL BODY + GYRATING CROSSHAIRS ===
                    this.shell = new THREE.Group();
                    const crossMat = new THREE.MeshPhongMaterial({
                        color: 0x00aaff,
                        emissive: 0x0066aa,
                        emissiveIntensity: 0.4,
                        shininess: 150
                    });

                    // CENTRAL BODY - CUBE where eye sits (flat top)
                    const bodyMat = new THREE.MeshPhongMaterial({
                        color: 0x0088cc,
                        emissive: 0x004466,
                        emissiveIntensity: 0.3,
                        shininess: 100
                    });
                    const cubeSize = shellGeo.size * 0.7; // BIGGER cube for eye
                    const body = new THREE.Mesh(
                        new THREE.BoxGeometry(cubeSize, cubeSize * 0.5, cubeSize), // Flattened
                        bodyMat
                    );
                    this.shell.add(body);
                    this.reconBody = body;
                    this.reconCubeSize = cubeSize; // Store for eye positioning

                    // CROSSHAIRS RING - gyrates around body like a gyroscope
                    this.crosshairsRing = new THREE.Group();

                    const ringRadius = shellGeo.size * 1.0; // Medium ring that clears the cube
                    const coreGap = cubeSize * 0.9; // Gap for arms away from eye

                    // Outer ring (scope circle)
                    const outerRing = new THREE.Mesh(
                        new THREE.TorusGeometry(ringRadius, shellGeo.size * 0.05, 8, 32),
                        crossMat
                    );
                    this.crosshairsRing.add(outerRing);

                    // Crosshair arms - split into 4 segments (gap around core)
                    const armLength = ringRadius - coreGap + ringRadius * 0.3; // From gap to past ring
                    const armGeo = new THREE.BoxGeometry(armLength, shellGeo.size * 0.06, shellGeo.size * 0.06);
                    const armOffset = coreGap + armLength / 2; // Position from center

                    // +X arm
                    const armPosX = new THREE.Mesh(armGeo, crossMat);
                    armPosX.position.x = armOffset;
                    this.crosshairsRing.add(armPosX);

                    // -X arm
                    const armNegX = new THREE.Mesh(armGeo, crossMat);
                    armNegX.position.x = -armOffset;
                    this.crosshairsRing.add(armNegX);

                    // +Y arm (in ring plane)
                    const armPosY = new THREE.Mesh(armGeo, crossMat);
                    armPosY.rotation.z = Math.PI / 2;
                    armPosY.position.y = armOffset;
                    this.crosshairsRing.add(armPosY);

                    // -Y arm (in ring plane)
                    const armNegY = new THREE.Mesh(armGeo, crossMat);
                    armNegY.rotation.z = Math.PI / 2;
                    armNegY.position.y = -armOffset;
                    this.crosshairsRing.add(armNegY);

                    this.shell.add(this.crosshairsRing);

                    this.isCrosshairs = true; // Flag for animation
                } else if (shellGeo && shellGeo.isFlower) {
                    // === SKIRMISHER: BLOOMING FLOWER ===
                    // Central seed + rotating petals around it
                    this.shell = new THREE.Group();

                    // Seed core (small sphere in center)
                    const seedMat = new THREE.MeshPhongMaterial({
                        color: 0x4a2800, // Brown seed
                        emissive: 0x2a1500,
                        emissiveIntensity: 0.2,
                        shininess: 30
                    });
                    this.seed = new THREE.Mesh(
                        new THREE.SphereGeometry(shellGeo.size * 0.4, 16, 16),
                        seedMat
                    );
                    this.shell.add(this.seed);

                    // Petal group that will rotate
                    this.petalGroup = new THREE.Group();
                    const petalMat = new THREE.MeshPhongMaterial({
                        color: 0x2ecc71, // Green petals
                        emissive: 0x1a7a42,
                        emissiveIntensity: 0.3,
                        shininess: 40,
                        side: THREE.DoubleSide
                    });

                    // Create 5 petals around the seed
                    const petalCount = 5;
                    for (let i = 0; i < petalCount; i++) {
                        const angle = (i / petalCount) * Math.PI * 2;
                        const petal = new THREE.Mesh(
                            new THREE.SphereGeometry(shellGeo.size * 0.5, 8, 8),
                            petalMat
                        );
                        // Flatten into leaf shape
                        petal.scale.set(0.4, 1.2, 0.15);
                        // Position around seed
                        petal.position.x = Math.cos(angle) * shellGeo.size * 0.6;
                        petal.position.z = Math.sin(angle) * shellGeo.size * 0.6;
                        petal.position.y = 0;
                        // Rotate to point outward
                        petal.rotation.y = -angle;
                        petal.rotation.z = Math.PI / 6; // Slight tilt
                        this.petalGroup.add(petal);
                    }
                    this.shell.add(this.petalGroup);

                    // === RECEPTACLE (cup for eye to sit in) ===
                    const receptacleMat = new THREE.MeshPhongMaterial({
                        color: 0x5a3800, // Darker brown
                        emissive: 0x2a1a00,
                        emissiveIntensity: 0.2,
                        shininess: 20
                    });
                    // Bowl/cup shape using lathe geometry
                    const receptaclePoints = [];
                    for (let i = 0; i <= 8; i++) {
                        const t = i / 8;
                        const radius = shellGeo.size * 0.15 + t * shellGeo.size * 0.15;
                        const height = t * shellGeo.size * 0.2;
                        receptaclePoints.push(new THREE.Vector2(radius, height));
                    }
                    const receptacle = new THREE.Mesh(
                        new THREE.LatheGeometry(receptaclePoints, 12),
                        receptacleMat
                    );
                    receptacle.position.y = shellGeo.size * 0.35; // On top of seed
                    this.shell.add(receptacle);
                    this.receptacle = receptacle;

                    // === SEPALS (small leaves at base) ===
                    const sepalMat = new THREE.MeshPhongMaterial({
                        color: 0x1a6030, // Darker green
                        emissive: 0x0a3018,
                        emissiveIntensity: 0.2,
                        shininess: 30,
                        side: THREE.DoubleSide
                    });
                    const sepalCount = 5;
                    for (let i = 0; i < sepalCount; i++) {
                        const angle = (i / sepalCount) * Math.PI * 2 + Math.PI / 5; // Offset from petals
                        const sepal = new THREE.Mesh(
                            new THREE.ConeGeometry(shellGeo.size * 0.15, shellGeo.size * 0.4, 4),
                            sepalMat
                        );
                        sepal.position.x = Math.cos(angle) * shellGeo.size * 0.35;
                        sepal.position.z = Math.sin(angle) * shellGeo.size * 0.35;
                        sepal.position.y = -shellGeo.size * 0.15;
                        sepal.rotation.z = -Math.PI / 4; // Tilt outward
                        sepal.rotation.y = angle;
                        this.shell.add(sepal);
                    }

                    this.isFlower = true; // Flag for rotation animation
                } else if (shellGeo && shellGeo.isDrippyDiamond) {
                    // === CONTROLLER: SLUDGE JELLYFISH ===
                    // Hemisphere dome (flat top) with tentacles below
                    this.shell = new THREE.Group();

                    // Sludge material - lavender layered look
                    const sludgeMat = new THREE.MeshPhongMaterial({
                        color: 0x9966cc,      // Lavender purple
                        emissive: 0x663399,   // Deep lavender glow
                        emissiveIntensity: 0.4,
                        shininess: 50,
                        transparent: true,
                        opacity: 0.85
                    });

                    // Hemisphere dome (rounded top, flat bottom)
                    // SphereGeometry creates hemisphere with rounded part in +Y direction naturally
                    // NO rotation flip - dome faces UP correctly
                    const domeGeo = new THREE.SphereGeometry(shellGeo.size * 0.7, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2);
                    const dome = new THREE.Mesh(domeGeo, sludgeMat);
                    // Position so dome sits above the tentacles attachment point
                    dome.position.y = shellGeo.size * 0.1;
                    this.shell.add(dome);
                    this.diamondCore = dome;

                    // Flat bottom cap (at equator of hemisphere)
                    const bottomCap = new THREE.Mesh(
                        new THREE.CircleGeometry(shellGeo.size * 0.7, 16),
                        sludgeMat
                    );
                    bottomCap.rotation.x = Math.PI / 2; // Face downward
                    bottomCap.position.y = shellGeo.size * 0.1; // At dome base
                    this.shell.add(bottomCap);

                    // GLOW LIGHT - subtle purple glow around body
                    const glowLight = new THREE.PointLight(0x9944ff, 0.6, shellGeo.size * 3);
                    glowLight.position.y = 0;
                    this.shell.add(glowLight);
                    this.controllerGlow = glowLight;

                    // Tentacles hanging from edge of dome
                    this.drips = [];
                    const tentacleCount = 6;
                    for (let i = 0; i < tentacleCount; i++) {
                        const angle = (i / tentacleCount) * Math.PI * 2;
                        const radius = shellGeo.size * 0.55;

                        const tentacle = new THREE.Mesh(
                            new THREE.ConeGeometry(shellGeo.size * 0.08, shellGeo.size * 0.5, 6),
                            sludgeMat
                        );
                        tentacle.rotation.x = Math.PI;
                        tentacle.position.set(
                            Math.cos(angle) * radius,
                            shellGeo.size * 0.05, // Hang from bottom of dome
                            Math.sin(angle) * radius
                        );
                        tentacle.userData.baseY = tentacle.position.y;
                        tentacle.userData.phase = (i / tentacleCount) * Math.PI * 2;
                        tentacle.userData.speed = 2 + Math.random();
                        this.drips.push(tentacle);
                        this.shell.add(tentacle);
                    }

                    // Central thick tentacle
                    const mainDrip = new THREE.Mesh(
                        new THREE.ConeGeometry(shellGeo.size * 0.15, shellGeo.size * 0.6, 8),
                        sludgeMat
                    );
                    mainDrip.rotation.x = Math.PI;
                    mainDrip.position.y = shellGeo.size * 0.05 - shellGeo.size * 0.3; // Below dome
                    this.shell.add(mainDrip);
                    this.mainDrip = mainDrip;

                    this.isDrippyDiamond = true; // Flag for animation
                    console.log(`🎮 Controller created: dome=${!!this.diamondCore}, tentacles=${this.drips?.length}, mainDrip=${!!this.mainDrip}`);
                } else {
                    const shellMat = new THREE.MeshPhongMaterial({
                        color: elementColor,
                        emissive: elementColor,
                        emissiveIntensity: 0.2,
                        shininess: player.classKey === 'recon' ? 150 : 60,
                        flatShading: isLowPoly,
                        transparent: player.classKey === 'support',
                        opacity: player.classKey === 'support' ? 0.7 : 1.0
                    });
                    this.shell = new THREE.Mesh(shellGeo, shellMat);
                }

                // Debug: Log shell creation
                console.log(`🔮 Orb3D created: ${player.username} (${player.classKey}) - shell children: ${this.shell?.children?.length || 'mesh'}`);
                this.group.add(this.shell);


                // === ELEMENTAL PARTICLE VFX ===
                this.particles = [];
                // Assault gets more particles for chaos cluster effect
                const particleCount = player.classKey === 'assault' ? 12 : 8;

                for (let i = 0; i < particleCount; i++) {
                    let particle;
                    switch (player.classKey) {
                        case 'assault':
                            // CAUTION FIRE - Orange radiating particles
                            particle = new THREE.Mesh(
                                new THREE.TetrahedronGeometry(6 + Math.random() * 4, 0),
                                new THREE.MeshBasicMaterial({
                                    color: Math.random() > 0.5 ? 0xff6600 : 0xff8800, // Orange caution
                                    transparent: true,
                                    opacity: 0.6 + Math.random() * 0.3
                                })
                            );
                            particle.rotation.set(
                                Math.random() * Math.PI * 2,
                                Math.random() * Math.PI * 2,
                                Math.random() * Math.PI * 2
                            );
                            break;
                        case 'support':
                            // MIX OF HEARTS (50%) AND PLUS SIGNS (50%) - pinkish-white gradients
                            particle = new THREE.Group();

                            // Pinkish-white gradient colors - STRONGER PINKS
                            const pinkWhiteColors = [
                                0xff69b4, // Hot pink
                                0xff77aa, // Bright pink
                                0xff88bb, // Vivid pink
                                0xffb6c1, // Light pink
                                0xff99cc, // Medium pink
                                0xffc0cb, // Pink
                                0xffaacc, // Soft vivid pink
                                0xff66aa  // Strong pink
                            ];
                            const particleColor = pinkWhiteColors[Math.floor(Math.random() * pinkWhiteColors.length)];

                            const supportMat = new THREE.MeshBasicMaterial({
                                color: particleColor,
                                transparent: true,
                                opacity: 0.75 + Math.random() * 0.2,
                                side: THREE.DoubleSide
                            });

                            // Alternate between heart and plus based on index
                            if (i % 2 === 0) {
                                // HEART SHAPE
                                const miniHeartShape = new THREE.Shape();
                                const hs = 2;
                                for (let t = 0; t <= Math.PI * 2; t += 0.1) {
                                    const hx = hs * 16 * Math.pow(Math.sin(t), 3) * 0.04;
                                    const hy = hs * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 0.04;
                                    if (t === 0) miniHeartShape.moveTo(hx, hy);
                                    else miniHeartShape.lineTo(hx, hy);
                                }
                                const heartGeo = new THREE.ShapeGeometry(miniHeartShape);
                                const heartMesh = new THREE.Mesh(heartGeo, supportMat);
                                heartMesh.rotation.x = Math.PI / 2;
                                heartMesh.rotation.z = Math.PI;
                                particle.add(heartMesh);
                            } else {
                                // PLUS SIGN (+) SHAPE
                                const plusShape = new THREE.Shape();
                                const ps = 1.5; // Plus size
                                const pw = 0.5; // Plus arm width (half)
                                // Draw plus as cross shape
                                plusShape.moveTo(-pw * ps, -ps);
                                plusShape.lineTo(pw * ps, -ps);
                                plusShape.lineTo(pw * ps, -pw * ps);
                                plusShape.lineTo(ps, -pw * ps);
                                plusShape.lineTo(ps, pw * ps);
                                plusShape.lineTo(pw * ps, pw * ps);
                                plusShape.lineTo(pw * ps, ps);
                                plusShape.lineTo(-pw * ps, ps);
                                plusShape.lineTo(-pw * ps, pw * ps);
                                plusShape.lineTo(-ps, pw * ps);
                                plusShape.lineTo(-ps, -pw * ps);
                                plusShape.lineTo(-pw * ps, -pw * ps);
                                plusShape.closePath();

                                const plusGeo = new THREE.ShapeGeometry(plusShape);
                                const plusMesh = new THREE.Mesh(plusGeo, supportMat);
                                plusMesh.rotation.x = Math.PI / 2;
                                particle.add(plusMesh);
                            }
                            particle.scale.setScalar(1.2 + Math.random() * 0.3);
                            break;
                        case 'recon':
                            // GLOSSY BRIGHT BUBBLES - wet pop animation
                            particle = new THREE.Mesh(
                                new THREE.SphereGeometry(3 + Math.random() * 2, 16, 16), // Smoother sphere
                                new THREE.MeshPhysicalMaterial({
                                    color: 0xaaeeff, // Bright light blue
                                    emissive: 0x44aacc, // Glowing cyan
                                    emissiveIntensity: 0.3,
                                    transparent: true,
                                    opacity: 0.55, // Much more visible
                                    roughness: 0.1,
                                    metalness: 0.2,
                                    clearcoat: 1.0,
                                    clearcoatRoughness: 0.05,
                                    transmission: 0.3, // Less see-through
                                    thickness: 0.3
                                })
                            );
                            particle.userData.popTimer = Math.random() * 1.5; // FASTER pops (was 3)
                            particle.userData.isBubble = true;
                            particle.userData.baseScale = 0.8 + Math.random() * 0.4;
                            particle.userData.wobblePhase = Math.random() * Math.PI * 2;
                            break;
                        case 'controller':
                            // SLUDGE OCTAHEDRONS - simple consistent spiky shape
                            particle = new THREE.Group();

                            // SLUDGE PALETTE - oily purples and blacks
                            const sludgeColors = [
                                0x2a0a4a, // Deep sludge purple
                                0x1f0833, // Almost black purple
                                0x3d1066, // Dark violet sludge
                                0x180628, // Tar purple
                                0x2b0d44  // Oil slick purple
                            ];
                            const sludgeColor = sludgeColors[Math.floor(Math.random() * sludgeColors.length)];

                            // Single OctahedronGeometry - naturally spiky (8-faced diamond)
                            const sludgeMat = new THREE.MeshStandardMaterial({
                                color: sludgeColor,
                                transparent: true,
                                opacity: 0.9,
                                flatShading: true,
                                roughness: 0.4,
                                metalness: 0.6
                            });

                            // Alternate between WHOLE and SPLIT
                            if (i % 2 === 0) {
                                // WHOLE OCTAHEDRON - single spiky blob
                                const blobSize = 4 + Math.random() * 2;
                                const sludgeBlob = new THREE.Mesh(
                                    new THREE.OctahedronGeometry(blobSize, 0),
                                    sludgeMat
                                );
                                sludgeBlob.userData.isWhole = true;
                                sludgeBlob.userData.mat = sludgeMat;
                                particle.add(sludgeBlob);
                            } else {
                                // SPLIT PAIR - two octahedrons orbiting
                                const halfSize = 2.5 + Math.random() * 0.5;
                                const orbitRadius = 4 + Math.random() * 2;

                                const mat1 = sludgeMat.clone();
                                const mat2 = sludgeMat.clone();
                                const half1 = new THREE.Mesh(
                                    new THREE.OctahedronGeometry(halfSize, 0),
                                    mat1
                                );
                                const half2 = new THREE.Mesh(
                                    new THREE.OctahedronGeometry(halfSize * 0.8, 0),
                                    mat2
                                );

                                half1.position.x = orbitRadius;
                                half2.position.x = -orbitRadius;

                                particle.userData.isSplit = true;
                                particle.userData.orbitRadius = orbitRadius;
                                particle.userData.orbitPhase = Math.random() * Math.PI * 2;
                                particle.userData.orbitSpeed = 1.5 + Math.random();
                                particle.userData.half1 = half1;
                                particle.userData.half2 = half2;
                                particle.userData.mat1 = mat1;
                                particle.userData.mat2 = mat2;

                                particle.add(half1);
                                particle.add(half2);
                            }

                            // Random initial rotation
                            particle.rotation.set(
                                Math.random() * Math.PI,
                                Math.random() * Math.PI,
                                Math.random() * Math.PI
                            );
                            particle.userData.isFerrofluid = true;
                            particle.userData.sludgePhase = Math.random() * Math.PI * 2;
                            break;
                        case 'skirmisher':
                            // WIND STREAK / LEAF SHAPES - unique to Skirmisher
                            particle = new THREE.Group();

                            // Base color (green, shifts toward yellow when moving fast)
                            const baseGreen = 0x44dd66; // Forest green

                            const streakMat = new THREE.MeshBasicMaterial({
                                color: baseGreen,
                                transparent: true,
                                opacity: 0.75,
                                side: THREE.DoubleSide
                            });

                            // Create elongated leaf/wind streak shape
                            const leafShape = new THREE.Shape();
                            const lw = 1.2; // Width
                            const ll = 4;   // Length
                            // Pointed oval/leaf
                            leafShape.moveTo(0, -ll);
                            leafShape.quadraticCurveTo(lw * 2, -ll * 0.3, lw, 0);
                            leafShape.quadraticCurveTo(lw * 1.5, ll * 0.5, 0, ll);
                            leafShape.quadraticCurveTo(-lw * 1.5, ll * 0.5, -lw, 0);
                            leafShape.quadraticCurveTo(-lw * 2, -ll * 0.3, 0, -ll);

                            const leafGeo = new THREE.ShapeGeometry(leafShape);
                            const leafMesh = new THREE.Mesh(leafGeo, streakMat);
                            leafMesh.rotation.x = Math.PI / 2; // Lay flat
                            particle.add(leafMesh);

                            // Add a smaller trailing echo for motion blur effect
                            const trailMat = streakMat.clone();
                            trailMat.opacity = 0.4;
                            const trailMesh = new THREE.Mesh(leafGeo.clone(), trailMat);
                            trailMesh.rotation.x = Math.PI / 2;
                            trailMesh.position.y = -2; // Behind the main streak
                            trailMesh.scale.setScalar(0.7);
                            particle.add(trailMesh);

                            // Store for speed-based color animation
                            particle.userData.isSpeedStreak = true;
                            particle.userData.baseMat = streakMat;
                            particle.userData.trailMat = trailMat;
                            particle.userData.speedColor = { r: 0.27, g: 0.87, b: 0.4 }; // Start green

                            particle.scale.setScalar(0.8 + Math.random() * 0.4);
                            break;
                        default:
                            particle = new THREE.Mesh(
                                new THREE.SphereGeometry(1, 4, 4),
                                new THREE.MeshBasicMaterial({ color: 0xaaaaaa })
                            );
                    }
                    particle.userData.angle = (i / particleCount) * Math.PI * 2;
                    particle.userData.radius = sizes.shell * 1.2;
                    particle.userData.speed = 1 + Math.random() * 0.5;
                    particle.userData.yOffset = (Math.random() - 0.5) * sizes.shell;
                    this.group.add(particle);
                    this.particles.push(particle);
                }

                // Core light - matches element
                this.coreLight = new THREE.PointLight(elementColor, 1.0, sizes.shell * 4);
                this.group.add(this.coreLight);

                // Inner core - scaled (hide for flat shapes like crosshairs and plus, and flower)
                this.core = new THREE.Mesh(
                    new THREE.SphereGeometry(sizes.core, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 })
                );
                if (this.isCrosshairs || this.isHeart || this.isFlower || this.isInvertedCone || this.isDrippyDiamond) {
                    this.core.visible = false; // Hide for shaped classes
                }
                this.group.add(this.core);

                // === PHASE 2: SIMPLE EYE SYSTEM ===
                // Clean, visible eye on top of orb (positioned above surface to avoid z-fighting)
                this.eyeGroup = new THREE.Group();

                // Class-specific eye positioning
                if (this.isCrosshairs) {
                    // Recon: Cube is 0.7 * shell * 0.5 height, eye on top
                    const cubeHeight = sizes.shell * 0.7 * 0.5;
                    this.eyeGroup.position.y = cubeHeight / 2 + 3;
                    this.eyeGroup.rotation.x = -Math.PI / 2;
                } else if (this.isHeart) {
                    // Support: Laying heart, eye on top surface
                    const heartHeight = sizes.shell * 0.045 * 6; // Extrude depth
                    this.eyeGroup.position.y = heartHeight / 2 + 2;
                    this.eyeGroup.rotation.x = -Math.PI / 2;
                } else if (this.isFlower) {
                    // Skirmisher: Eye sits IN the receptacle (cup on top of seed)
                    // Receptacle is at seed top (0.35) + cup height (0.2 * size)
                    this.eyeGroup.position.y = sizes.shell * 0.35 + sizes.shell * 0.15;
                    this.eyeGroup.rotation.x = -Math.PI / 2;
                } else if (this.isDrippyDiamond) {
                    // Controller: Eye on TOP of jellyfish dome
                    // Dome cap is at y = shell * 0.2, eye sits on top
                    this.eyeGroup.position.y = sizes.shell * 0.2 + 20;
                    this.eyeGroup.rotation.x = -Math.PI / 2;
                } else if (this.isInvertedCone) {
                    // Assault: Inverted cone, flat top at height/2 (cone height = shell * 1.0)
                    const coneHeight = sizes.shell * 1.0;
                    this.eyeGroup.position.y = coneHeight / 2 + 2;
                    this.eyeGroup.rotation.x = -Math.PI / 2;
                } else {
                    // Default: Eye above shell surface
                    this.eyeGroup.position.y = sizes.shell + 3;
                    this.eyeGroup.rotation.x = -Math.PI / 2;
                }

                // Eye size - Recon is bigger (bullseye), Support smaller (inside plus)
                let eyeRadius;
                if (this.isCrosshairs) {
                    eyeRadius = sizes.shell * 0.4; // Larger bullseye eye
                } else if (this.isHeart) {
                    eyeRadius = sizes.shell * 0.3; // Larger eye above heart
                } else {
                    eyeRadius = sizes.shell * 0.25; // Standard size
                }

                // White of eye
                this.eyeWhite = new THREE.Mesh(
                    new THREE.CircleGeometry(eyeRadius, 32),
                    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
                );
                this.eyeGroup.add(this.eyeWhite);

                // Pupil (black)
                this.eyePupil = new THREE.Mesh(
                    new THREE.CircleGeometry(eyeRadius * 0.5, 16),
                    new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide })
                );
                this.eyePupil.position.z = 0.5;
                this.eyeGroup.add(this.eyePupil);

                // Colored iris ring based on class
                const irisColor = {
                    assault: 0xff3333,
                    support: 0x33ff33,
                    recon: 0x3333ff,
                    controller: 0x9933ff,
                    skirmisher: 0xff9933
                }[player.classKey] || 0x888888;

                this.eyeIris = new THREE.Mesh(
                    new THREE.RingGeometry(eyeRadius * 0.5, eyeRadius * 0.8, 32),
                    new THREE.MeshBasicMaterial({ color: irisColor, side: THREE.DoubleSide })
                );
                this.eyeIris.position.z = 0.3;
                this.eyeGroup.add(this.eyeIris);
                this.group.add(this.eyeGroup);
                this.eyeRadius = eyeRadius; // Store for animations


                // Team shadow ring - stays on platform (ONLY for main scene, not thumbnails)
                if (!this.thumbnailMode) {
                    // Use blended team color based on class composition (falls back to slot color if not set yet)
                    const shadowColor = player.teamBlendedColor || TEAM_COLORS_HEX[player.team - 1];
                    this.shadow = new THREE.Mesh(
                        new THREE.RingGeometry(sizes.ring[0], sizes.ring[1], 32),
                        new THREE.MeshBasicMaterial({
                            color: shadowColor,
                            side: THREE.DoubleSide,
                            transparent: true,
                            opacity: 0.3
                        })
                    );
                    this.shadow.rotation.x = -Math.PI / 2;
                    this.shadow.position.y = PLATFORM_HEIGHT + 8; // Raised above antigrav pads
                    this.shadowBaseSize = sizes.ring[1]; // Store for scaling
                    scene.add(this.shadow); // Add to scene, not group!
                }

                // Controller parry effect now uses emissive flash on jellyfish body instead of separate geometry

                // Trail (DISABLED - user request)
                // this.trailPoints = [];
                // this.trailGeometry = new THREE.BufferGeometry();
                // this.trail = new THREE.Line(this.trailGeometry, new THREE.LineBasicMaterial({ color: player.config.colorHex, transparent: true, opacity: 0.5 }));
                // scene.add(this.trail);
                this.trailPoints = null;
                this.trail = null;

                this.statusGroup = new THREE.Group();
                this.group.add(this.statusGroup);
                this.sizes = sizes; // Store for status effects
                this.classKey = player.classKey; // Store for animations

                // Only add to global scene if NOT in thumbnail mode
                if (!this.thumbnailMode) {
                    scene.add(this.group);
                }
            }
            update(dt) {
                const p = this.player;
                if (!p.alive) {
                    this.group.visible = false;
                    if (this.shadow) this.shadow.visible = false; // Hide shadow for dead players
                    if (this.trail) this.trail.visible = false;
                    // Clean up controller sludge drops when dead
                    if (this.sludgeDrops && this.sludgeDrops.length > 0) {
                        this.sludgeDrops.forEach(drop => {
                            scene.remove(drop);
                            if (drop.geometry) drop.geometry.dispose();
                            if (drop.material) drop.material.dispose();
                        });
                        this.sludgeDrops.length = 0;
                    }
                    return;
                }

                // Handle False Positive invisibility
                if (p.isInvisible) {
                    this.group.visible = false;
                    if (this.shadow) this.shadow.visible = false;
                    if (this.trail) this.trail.visible = false;
                    return;
                }

                this.group.visible = true;
                if (this.trail) this.trail.visible = true;
                // Add vertical jump height if set
                const verticalOffset = p.jumpHeight || 0;
                // Scale Y position with growth scale so larger characters don't clip through platform
                const scale = getGrowthScale();
                const baseHeight = 25 * scale; // Height scales with size
                this.group.position.set(p.x, PLATFORM_HEIGHT + baseHeight + verticalOffset, p.y);

                // During lobby/splash: all models spin and bob
                if (gameState === 'lobby') {
                    const time = Date.now() * 0.001;

                    // === LOBBY SPIN - class-specific directions ===
                    // Clockwise (-1): Support, Assault
                    // Counter-clockwise (1): Controller, Skirmisher
                    // Recon: special gyroscope behavior
                    let spinSpeed = 0.5;
                    let spinDirection = 1; // 1 = counter-clockwise, -1 = clockwise

                    if (this.isHeart) {
                        spinSpeed = 0.3;
                        spinDirection = -1; // Support: CLOCKWISE
                    } else if (this.isFlower) {
                        spinSpeed = 0.8;
                        spinDirection = 1;  // Skirmisher: counter-clockwise
                    } else if (this.isDrippyDiamond) {
                        spinSpeed = 0.4;
                        spinDirection = 1;  // Controller: counter-clockwise
                    } else if (this.isInvertedCone) {
                        spinSpeed = 0.7;
                        spinDirection = -1; // Assault: CLOCKWISE
                    } else if (this.isCrosshairs) {
                        // Recon: alternating direction every 10 seconds
                        const cyclePhase = Math.floor(time / 10) % 2;
                        spinSpeed = 0.6;
                        spinDirection = cyclePhase === 0 ? 1 : -1;
                    }

                    this.group.rotation.y += dt * spinSpeed * spinDirection;

                    // === LOBBY SCALE - players are smaller while in lobby ===
                    this.group.scale.setScalar(LOBBY_SCALE);

                    // === LOBBY BOB - gentle vertical oscillation ===
                    const bobSpeed = 1.5 + (p.id % 5) * 0.2; // Unique per player
                    const bobHeight = 3 + Math.sin(p.id * 0.7) * 1; // 2-4 units
                    this.group.position.y = PLATFORM_HEIGHT + 25 * LOBBY_SCALE + Math.sin(time * bobSpeed) * bobHeight;

                    // Keep eye facing upward
                    if (this.eyeGroup) {
                        this.eyeGroup.rotation.x = -Math.PI / 2; // Lay flat like _

                        // Use class-specific eye heights (match constructor values)
                        if (this.isHeart) {
                            const heartHeight = this.sizes.shell * 0.045 * 6;
                            this.eyeGroup.position.y = heartHeight / 2 + 2;
                        } else if (this.isCrosshairs) {
                            const cubeHeight = this.sizes.shell * 0.7 * 0.5;
                            this.eyeGroup.position.y = cubeHeight / 2 + 3;
                        } else if (this.isFlower) {
                            this.eyeGroup.position.y = this.sizes.shell * 0.35 + this.sizes.shell * 0.15;
                        } else if (this.isDrippyDiamond) {
                            // Eye sits on top of the dome (dome is at y=0.1*size, hemisphere extends up by ~0.7*size)
                            this.eyeGroup.position.y = this.sizes.shell * 0.1 + this.sizes.shell * 0.7 + 5;
                        } else if (this.isInvertedCone) {
                            const coneHeight = this.sizes.shell * 1.0;
                            this.eyeGroup.position.y = coneHeight / 2 + 2;
                        } else {
                            this.eyeGroup.position.y = this.sizes.shell * 0.8;
                        }

                        // === SUSPICIOUS EYE GLANCING ===
                        // Eyes look at other players suspiciously
                        const glanceSpeed = 0.3 + Math.sin(p.id * 1.5) * 0.1; // Unique per player
                        const glancePhase = Math.floor(time * glanceSpeed) % players.length;

                        // Find another player to look at
                        const otherPlayers = players.filter(other => other.id !== p.id && other.alive);
                        if (otherPlayers.length > 0 && this.pupil) {
                            const lookAt = otherPlayers[glancePhase % otherPlayers.length];

                            // Calculate direction to other player
                            const dx = lookAt.x - p.x;
                            const dz = lookAt.y - p.y;
                            const dist = Math.sqrt(dx * dx + dz * dz);

                            // Move pupil toward that player (relative to eye center)
                            const maxOffset = this.eyeRadius * 0.4;
                            const targetX = (dx / (dist + 1)) * maxOffset;
                            const targetZ = (dz / (dist + 1)) * maxOffset;

                            // Smooth lerp to target
                            this.pupil.position.x += (targetX - this.pupil.position.x) * 0.1;
