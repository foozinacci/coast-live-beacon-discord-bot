                });
            }

            // Track how many players spawned per team
            const teamSpawnCounts = {};

            players.forEach((p, i) => {
                // Get this player's index within their team (0, 1, or 2)
                if (!teamSpawnCounts[p.team]) teamSpawnCounts[p.team] = 0;
                const memberIndex = teamSpawnCounts[p.team];
                teamSpawnCounts[p.team]++;

                const spawn = spawns[p.team - 1]?.[memberIndex] || { x: 0, y: 0 };
                // Don't teleport - set targets and let them smoothly move during prep phase
                p.targetX = spawn.x;
                p.targetY = spawn.y;
                p.homeX = spawn.x;
                p.homeY = spawn.y;
                // Characters will slide to positions via AI movement during prep phase

                // Initialize per-opponent parry for Controllers
                if (p.classKey === 'controller') {
                    p.parryTargets = {};
                    players.filter(e => e.team !== p.team).forEach(enemy => {
                        p.parryTargets[enemy.id] = true; // Has parry available for this enemy
                    });
                }
            });
            teamsAliveAtRoundStart = teamCount;

            // Immediate HUD update
            updateTeamScores();

            addLog('⚔️ ROUND 1 BEGINS!', 'kill');

            // Force another update after a frame to ensure visibility
            requestAnimationFrame(() => updateTeamScores());
        }

        let hudInitialized = false;
        let lastTeamStructure = ''; // Track player/team structure changes

        function updateTeamScores() {
            const scores = document.getElementById('teamScores');
            if (!scores) return;

            const { targetTeams = 5, playersPerTeam = 3 } = window.lobbyConfig || {};
            const isLobby = gameState === 'lobby';

            // During lobby, show all potential teams (even empty ones) up to targetTeams
            // During game, show only teams that exist
            let teamNumbers;
            if (isLobby) {
                teamNumbers = [];
                for (let t = 1; t <= targetTeams; t++) {
                    if (players.some(p => p.team === t)) {
                        teamNumbers.push(t);
                    }
                }
            } else {
                teamNumbers = [...new Set(players.map(p => p.team))];
            }

            // Calculate team data
            const teamData = teamNumbers.map(t => {
                const teamPlayers = players.filter(p => p.team === t);
                const currentHp = teamPlayers.reduce((sum, p) => sum + (p.alive ? Math.max(0, p.hp) : 0), 0);
                const maxHp = teamPlayers.reduce((sum, p) => sum + p.maxHp, 0);
                const aliveCount = teamPlayers.filter(p => p.alive).length;
                const isEliminated = !isLobby && aliveCount === 0;

                // Get team name from first player's teamName or generate it
                const teamClasses = teamPlayers.map(p => p.classKey).filter(Boolean);
                const teamName = teamPlayers[0]?.teamName || (teamClasses.length === playersPerTeam ? getTeamName(teamClasses) : '');

                return {
                    team: t,
                    teamName: teamName,
                    players: teamPlayers,
                    currentHp,
                    maxHp,
                    hpPercent: maxHp > 0 ? (currentHp / maxHp) * 100 : 0,
                    aliveCount,
                    totalCount: teamPlayers.length,
                    isEliminated,
                    isComplete: teamPlayers.length >= playersPerTeam
                };
            });

            // Sort: in lobby by team number, in game by HP pool
            if (isLobby) {
                teamData.sort((a, b) => a.team - b.team);
            } else {
                teamData.sort((a, b) => {
                    if (a.isEliminated && !b.isEliminated) return 1;
                    if (!a.isEliminated && b.isEliminated) return -1;
                    return b.currentHp - a.currentHp;
                });
            }

            // Brighter versions of team colors for gradient
            const TEAM_COLORS_BRIGHT = ['#ffffff', '#5dade2', '#bb8fce', '#f1948a', '#58d68d'];

            // Helper to convert hex number to CSS color string
            const hexToCSS = (hex) => '#' + hex.toString(16).padStart(6, '0');

            // Check if structure changed (players/teams)
            const currentStructure = players.map(p => `${p.id}-${p.team}-${p.classKey}-${gameState}`).sort().join(',');
            const structureChanged = currentStructure !== lastTeamStructure;

            // Full rebuild only when structure changes
            if (structureChanged || !hudInitialized) {
                lastTeamStructure = currentStructure;
                hudInitialized = true;

                scores.innerHTML = teamData.map((data, rank) => {
                    // Get colors from team composition
                    const teamColorsHex = getTeamColors(data.players.map(p => p.classKey).filter(Boolean));
                    const blendedColor = data.players[0]?.teamBlendedColor || blendColors(teamColorsHex) || TEAM_COLORS_HEX[data.team - 1];
                    const teamColors = data.players[0]?.teamColors || teamColorsHex;

                    // Create gradient from class colors  
                    const gradientColors = teamColors.map(hexToCSS);
                    const primaryColor = hexToCSS(blendedColor);
                    const colorBright = gradientColors[0] || primaryColor;

                    // Build player roster HTML - ALWAYS show full display (health bars, etc.)
                    // During lobby, also show empty slots
                    let rosterHtml = '';
                    const slotsToShow = isLobby ? playersPerTeam : data.players.length;

                    for (let slot = 0; slot < slotsToShow; slot++) {
                        const p = data.players[slot];
                        if (p) {
                            const status = p.alive ? 'alive' : 'dead';
                            const hpPercent = p.alive ? Math.max(0, (p.hp / p.maxHp) * 100) : 0;
                            const canvasId = `hud-pip-${data.team}-${slot}`;
                            const className = CLASSES[p.classKey]?.name || p.classKey;
                            const platform = p.platform || 'Discord';

                            // Health bar color based on HP percentage
                            let hpColor = '#44ff44'; // Green
                            if (hpPercent < 30) hpColor = '#ff4444'; // Red
                            else if (hpPercent < 60) hpColor = '#ffaa44'; // Orange

                            // Format: [ClassName] username (platform) with flair
                            const flairs = [];
                            if (p.isBirthday) flairs.push('🎂');
                            if (p.isAdmin) flairs.push('👑');
                            const flairStr = flairs.length > 0 ? flairs.join('') + ' ' : '';

                            rosterHtml += `<div class="player-pip ${status}" data-player-id="${p.id}">
                                <canvas id="${canvasId}" class="pip-canvas" width="18" height="18"></canvas>
                                <div class="pip-info">
                                    <span class="pip-name">${flairStr}[${className}] ${p.username} (${platform})</span>
                                    <div class="pip-hp-bar">
                                        <div class="pip-hp-fill" data-player-hp="${p.id}" style="width: ${hpPercent}%; background: ${hpColor};"></div>
                                    </div>
                                </div>
                            </div>`;
                        } else if (isLobby) {
                            // Empty slot - only during lobby
                            rosterHtml += `<div class="player-pip empty">
                                <div class="pip-icon" style="background: rgba(255,255,255,0.2);"></div>
                                <div class="pip-info">
                                    <span class="pip-name" style="color: rgba(255,255,255,0.3);">awaiting player...</span>
                                </div>
                            </div>`;
                        }
                    }

                    // Rank display - ALWAYS show (during lobby shows order, during game shows HP ranking)
                    const rankNum = data.isEliminated ? '✗' : `#${rank + 1}`;

                    // Team health bar - ALWAYS show
                    const healthBarHtml = `
                        <div class="team-healthbar-vertical">
                            <div class="team-healthbar-fill-vertical" data-team-hp="${data.team}" style="height: ${data.hpPercent}%;"></div>
                        </div>`;

                    return `
                    <div class="team-tracker ${data.isEliminated ? 'eliminated' : ''}" data-team="${data.team}"
                         style="--team-color: ${primaryColor}; --team-color-bright: ${colorBright};">
                        <div class="team-left">
                            <div class="team-name-container">
                                <span class="team-name-vertical">${data.teamName || 'TEAM ' + data.team}</span>
                                <span class="team-rank" data-team-rank="${data.team}">${rankNum}</span>
                            </div>
                            ${healthBarHtml}
                        </div>
                        <div class="team-roster">${rosterHtml}</div>
                    </div>`;
                }).join('');

                // Render HUD pip canvases after full rebuild
                requestAnimationFrame(() => renderHudPips());
            } else {
                // Incremental update - only update health bars and statuses
                teamData.forEach((data, rank) => {
                    // Update team health bar
                    const teamHpFill = document.querySelector(`[data-team-hp="${data.team}"]`);
                    if (teamHpFill) {
                        teamHpFill.style.height = `${data.hpPercent}%`;
                    }

                    // Update team rank
                    const teamRank = document.querySelector(`[data-team-rank="${data.team}"]`);
                    if (teamRank) {
                        teamRank.textContent = data.isEliminated ? '✗' : `#${rank + 1}`;
                    }

                    // Update team tracker eliminated status
                    const teamTracker = document.querySelector(`[data-team="${data.team}"]`);
                    if (teamTracker) {
                        teamTracker.classList.toggle('eliminated', data.isEliminated);
                    }

                    // Update player pips
                    data.players.forEach(p => {
                        const pip = document.querySelector(`[data-player-id="${p.id}"]`);
                        if (pip) {
                            pip.classList.toggle('alive', p.alive);
                            pip.classList.toggle('dead', !p.alive);
                        }

                        const hpFill = document.querySelector(`[data-player-hp=\"${p.id}\"]`);
                        if (hpFill) {
                            // Check if player is respawning
                            if (!p.alive && p.pendingRespawn && p.respawnTimer > 0 && p.respawnTimerMax > 0) {
                                // Respawn cooldown display: purple → blue → orange (50% respawn HP)
                                const respawnProgress = 1 - (p.respawnTimer / p.respawnTimerMax); // 0 to 1
                                const respawnHpPercent = 50; // Respawns at 50% HP
                                const fillPercent = respawnProgress * respawnHpPercent;

                                // Two-phase transition:
                                // Phase 1 (0-50%): Purple #9933ff → Blue #00ccff
                                // Phase 2 (50-100%): Blue #00ccff → Orange #ffaa44
                                let r, g, b;
                                if (respawnProgress < 0.5) {
                                    // Purple → Blue
                                    const t = respawnProgress * 2; // 0 to 1
                                    r = Math.round(153 - 153 * t); // 153 → 0
                                    g = Math.round(51 + (204 - 51) * t); // 51 → 204
                                    b = Math.round(255); // stays 255
                                } else {
                                    // Blue → Orange
                                    const t = (respawnProgress - 0.5) * 2; // 0 to 1
                                    r = Math.round(0 + 255 * t); // 0 → 255
                                    g = Math.round(204 - (204 - 170) * t); // 204 → 170
                                    b = Math.round(255 - (255 - 68) * t); // 255 → 68
                                }
                                const respawnColor = `rgb(${r}, ${g}, ${b})`;

                                hpFill.style.width = `${fillPercent}%`;
                                hpFill.style.background = respawnColor;
                                hpFill.style.boxShadow = `0 0 6px ${respawnColor}`;
                            } else if (p.alive) {
                                // Heat-map gradient health: Purple → Red → Orange → Yellow → Green
                                const hpPercent = Math.max(0, (p.hp / p.maxHp) * 100);

                                // Smooth gradient based on HP percentage
                                let r, g, b;
                                if (hpPercent <= 20) {
                                    // Purple (#9933ff) → Red (#ff3333)
                                    const t = hpPercent / 20;
                                    r = Math.round(153 + (255 - 153) * t);
                                    g = Math.round(51 - 51 * t);
                                    b = Math.round(255 - (255 - 51) * t);
                                } else if (hpPercent <= 40) {
                                    // Red (#ff3333) → Orange (#ff8833)
                                    const t = (hpPercent - 20) / 20;
                                    r = 255;
                                    g = Math.round(51 + (136 - 51) * t);
                                    b = Math.round(51);
                                } else if (hpPercent <= 60) {
                                    // Orange (#ff8833) → Yellow (#ffcc33)
                                    const t = (hpPercent - 40) / 20;
                                    r = 255;
                                    g = Math.round(136 + (204 - 136) * t);
                                    b = Math.round(51);
                                } else if (hpPercent <= 80) {
                                    // Yellow (#ffcc33) → Lime (#aaff33)
                                    const t = (hpPercent - 60) / 20;
                                    r = Math.round(255 - (255 - 170) * t);
                                    g = Math.round(204 + (255 - 204) * t);
                                    b = Math.round(51);
                                } else {
                                    // Lime (#aaff33) → Green (#44ff44)
                                    const t = (hpPercent - 80) / 20;
                                    r = Math.round(170 - (170 - 68) * t);
                                    g = 255;
                                    b = Math.round(51 + (68 - 51) * t);
                                }
                                const hpColor = `rgb(${r}, ${g}, ${b})`;

                                hpFill.style.width = `${hpPercent}%`;
                                hpFill.style.background = hpColor;
                                hpFill.style.boxShadow = 'none';
                            } else {
                                // Dead, not respawning - show purple empty bar
                                hpFill.style.width = '2%'; // Tiny sliver to show "dead" state
                                hpFill.style.background = '#9933ff';
                                hpFill.style.boxShadow = '0 0 4px #9933ff';
                            }
                        }
                    });
                });
            }
        }

        // Shared renderer for HUD pip snapshots (prevents WebGL context overflow)
        let hudPipRenderer = null;
        const hudPipCache = new Map(); // Cache rendered pips by playerId

        function renderHudPips() {
            // Lazy initialize shared renderer
            if (!hudPipRenderer) {
                const offscreen = document.createElement('canvas');
                offscreen.width = 40;
                offscreen.height = 40;
                hudPipRenderer = new THREE.WebGLRenderer({
                    canvas: offscreen,
                    alpha: true,
                    antialias: true,
                    preserveDrawingBuffer: true // Required for 2D canvas copy
                });
                hudPipRenderer.setSize(40, 40);
                hudPipRenderer.setClearColor(0x000000, 0);
            }

            const miniScene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
            camera.position.set(0, 30, 60);
            camera.lookAt(0, 15, 0);
            miniScene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(5, 10, 5);
            miniScene.add(dirLight);

            // Render each player's pip canvas
            players.forEach((p, idx) => {
                const team = p.team;
                const teamIdx = players.filter(pl => pl.team === team).indexOf(p);
                const canvasId = `hud-pip-${team}-${teamIdx}`;
                const canvas = document.getElementById(canvasId);
                if (!canvas) return;

                // Skip if canvas already rendered with correct class
                const cacheKey = `${p.id}-${p.classKey}`;
                if (canvas.dataset.rendered === cacheKey) return;

                const ctx = canvas.getContext('2d');

                // Use cached snapshot if player class has been rendered before
                if (hudPipCache.has(cacheKey)) {
                    ctx.clearRect(0, 0, 18, 18);
                    ctx.drawImage(hudPipCache.get(cacheKey), 0, 0, 18, 18);
                    canvas.dataset.rendered = cacheKey;
                    return;
                }

                // Clear scene for this player
                while (miniScene.children.length > 2) {
                    miniScene.remove(miniScene.children[2]);
                }

                // Create orb for this player (thumbnailMode = true to prevent adding to global scene)
                const orb3d = new Orb3D(p, true);
                orb3d.group.position.y = 15;
                orb3d.group.scale.setScalar(0.6);
                orb3d.group.rotation.y = Math.PI * 0.1; // Slight angle
                miniScene.add(orb3d.group);

                // Render to offscreen canvas
                hudPipRenderer.render(miniScene, camera);

                // Copy to target canvas
                ctx.clearRect(0, 0, 18, 18);
                ctx.drawImage(hudPipRenderer.domElement, 0, 0, 18, 18);
                canvas.dataset.rendered = cacheKey;

                // Cache the snapshot
                const cacheCanvas = document.createElement('canvas');
                cacheCanvas.width = 40;
                cacheCanvas.height = 40;
                cacheCanvas.getContext('2d').drawImage(hudPipRenderer.domElement, 0, 0);
                hudPipCache.set(cacheKey, cacheCanvas);

                // Cleanup orb - dispose all geometry/materials within the group
                // Note: In thumbnailMode, shadow/trail are NOT created, so no cross-context issues
                miniScene.remove(orb3d.group);
                orb3d.group.traverse(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.dispose());
                        } else {
                            child.material.dispose();
                        }
                    }
                });
            });
        }

        function simulatePlayers() {
            // Get game mode from URL: teams=2-5 for team modes, mode=ffa for free-for-all
            const urlParams = new URLSearchParams(window.location.search);
            const teamsParam = urlParams.get('teams');
            const modeParam = urlParams.get('mode');

            // === DEMO MODE CYCLING ===
            // If demo mode is active, use cycling team counts (2→3→4→5→loop)
            // Otherwise use URL parameter
            let targetTeams;
            const isFFA = teamsParam === 'ffa' || modeParam === 'ffa';

            if (demoModeActive && !isFFA) {
                targetTeams = getNextTeamCount();
            } else {
                targetTeams = isFFA ? 6 : Math.max(2, Math.min(5, parseInt(teamsParam) || 5)); // 2-5 teams, default 5
            }

            const playersPerTeam = isFFA ? 1 : 3;
            const targetPlayers = isFFA ? 6 : targetTeams * playersPerTeam; // FFA defaults to 6 players

            // Store FFA mode for team assignment
            window.gameMode = isFFA ? 'ffa' : 'teams';
            window.lobbyConfig = { targetTeams, playersPerTeam }; // Store for pad positioning

            // === CREATE BOUNCE PADS IN PROPER FORMATION ===
            // This uses the correct geometric layout (square for 2, triangle for 3, etc.)
            createBouncePadsForTeams(targetTeams);
            console.log(`🎯 Created bounce pads in formation for ${targetTeams} teams`);

            // Update target display
            const targetDisplay = document.getElementById('targetCount');
            if (targetDisplay) targetDisplay.textContent = targetPlayers;

            // Generate random players - class-specific bot names
            const shuffledNames = [...allNames].sort(() => Math.random() - 0.5);

            // Randomly select 5 indices to be Twitch users
            const twitchIndices = new Set();
            while (twitchIndices.size < 5) {
                twitchIndices.add(Math.floor(Math.random() * targetPlayers));
            }

            // Staggered player joins - 2 seconds apart
            let playerIndex = 0;
            const joinInterval = setInterval(() => {
                if (playerIndex >= targetPlayers) {
                    clearInterval(joinInterval);

                    // All players joined - start countdown
                    countdown = 3;
                    const msgEl = document.getElementById('waitingMsg');
                    const timerEl = document.getElementById('countdownTimer');
                    if (msgEl) msgEl.textContent = 'Starting in...';
                    if (timerEl) timerEl.textContent = countdown;

                    // Tick down every second
                    const countdownInterval = setInterval(() => {
                        countdown--;
                        if (countdown > 0) {
                            const timer = document.getElementById('countdownTimer');
                            if (timer) timer.textContent = countdown;
                        } else {
                            clearInterval(countdownInterval);
                            startCombat();
                        }
                    }, 1000);

                    return;
                }

                // Randomly assign Discord or Twitch platform
                const platform = twitchIndices.has(playerIndex) ? 'Twitch' : 'Discord';
                addPlayer(shuffledNames[playerIndex], platform);
                playerIndex++;

                // Update count display
                const countDisplay = document.getElementById('currentCount');
                if (countDisplay) countDisplay.textContent = playerIndex;

                // === SIMULATE RANDOM LEAVE/REJOIN after 5th player ===
                // Player 5 doesn't like their team/class and leaves, then rejoins
                if (playerIndex === 5 && targetPlayers >= 6) {
                    setTimeout(() => {
                        const leavingPlayer = players[4]; // 5th player (index 4)
                        if (leavingPlayer) {
                            const leaveName = leavingPlayer.username;
                            console.log(`🚪 ${leaveName} didn't like their assignment, leaving...`);
                            addLog(`😤 ${leaveName} ragequit!`, 'kill');
                            removePlayer(leaveName);

                            // Rejoin after 2 seconds
                            setTimeout(() => {
                                console.log(`🔄 ${leaveName} rejoining...`);
                                addPlayer(leaveName, 'Discord');
                                addLog(`🔄 ${leaveName} came back!`, 'heal');
                            }, 2000);
                        }
                    }, 3000); // Leave 3 seconds after joining
                }

            }, 2000); // 2 second intervals
        }

        // Victory fireworks effect
        const fireworkParticles = [];
        function spawnVictoryFireworks(teamColor) {
            // Spawn bursts at random positions
            for (let burst = 0; burst < 8; burst++) {
                setTimeout(() => {
                    const centerX = (Math.random() - 0.5) * 400;
                    const centerZ = (Math.random() - 0.5) * 400;
                    const centerY = 150 + Math.random() * 200;

                    // Each burst has particles
                    for (let i = 0; i < 20; i++) {
                        const particle = new THREE.Mesh(
                            new THREE.SphereGeometry(3, 6, 6),
                            new THREE.MeshBasicMaterial({
                                color: Math.random() > 0.5 ? teamColor : 0xffd700,
                                transparent: true,
                                opacity: 1
                            })
                        );
                        particle.position.set(centerX, centerY, centerZ);

                        // Random velocity outward
                        const angle = Math.random() * Math.PI * 2;
                        const angleV = (Math.random() - 0.5) * Math.PI;
                        const speed = 100 + Math.random() * 150;
                        particle.userData.vx = Math.cos(angle) * Math.cos(angleV) * speed;
                        particle.userData.vy = Math.sin(angleV) * speed + 50;
                        particle.userData.vz = Math.sin(angle) * Math.cos(angleV) * speed;
                        particle.userData.life = 2 + Math.random();

                        scene.add(particle);
                        fireworkParticles.push(particle);
                    }
                }, burst * 400); // Stagger bursts
            }
        }

        function updateFireworks(dt) {
            for (let i = fireworkParticles.length - 1; i >= 0; i--) {
                const p = fireworkParticles[i];
                p.position.x += p.userData.vx * dt;
                p.position.y += p.userData.vy * dt;
                p.position.z += p.userData.vz * dt;
                p.userData.vy -= 80 * dt; // Gravity
                p.userData.life -= dt;
                p.material.opacity = Math.max(0, p.userData.life / 2);

                if (p.userData.life <= 0) {
                    scene.remove(p);
                    p.geometry.dispose();
                    p.material.dispose();
                    fireworkParticles.splice(i, 1);
                }
            }
        }

        // === ANIMATION LOOP ===
        let lastTime = performance.now();
        let cachedTime = 0; // Global cached time - updated once per frame

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            cachedTime = now; // Cache for use in all update functions

            if (gameState === 'lobby' && countdown > 0) {
                countdown -= dt;
                document.getElementById('countdownTimer').textContent = Math.ceil(countdown);
                if (countdown <= 0) startCombat();
            }

            if (gameState === 'perkDraft') {
                perkTimer -= dt;
                const display = document.getElementById('perkTimerDisplay');
                if (display) display.textContent = `Auto-select in ${Math.ceil(perkTimer)}s`;
                if (perkTimer <= 0) {
                    players.filter(p => p.alive).forEach(p => { if (currentPerkA.effect) currentPerkA.effect(p); });
                    endPerkDraft();
                }
            }

            // Update orbs during lobby for suspicious eye animations
            if (gameState === 'lobby') {
                orbs.forEach(orb => orb.update(dt));
                updateReplicator(dt); // For rising animation when first player joins
            }

            if (gameState === 'playing') {
                aiUpdate(dt);
                updatePhysics(dt);
                updateProjectiles(dt);
                updateReplicator(dt);
                lerpReplicatorColor(dt);  // Smooth color transitions
                updateGroundWaves(dt);    // Expanding color waves
                updateShrinkingRing(dt);
                updateMapFeatures(dt);
                updateSoulOrbs(dt);      // Soul orb collection
                updateReconMarks(dt);    // Recon electric marks
                updateRespawns(dt);      // Teammate respawns
                updateHealthRegen(dt);   // Passive HP regen
                updateDecoys(dt);        // False Positive decoys
                orbs.forEach(orb => orb.update(dt));
                updateCatapultModels(dt); // Catapulted eliminated players
                updateBloodTrails(dt);
                updateBouncePadColors();  // Gray out eliminated team pads

                // Periodic HUD update (every 0.25s)
                hudUpdateTimer += dt;
                if (hudUpdateTimer >= 0.25) {
                    hudUpdateTimer = 0;
                    updateTeamScores();
                }

                // === UPDATE SKIRMISHER TRAILS (rising dust) ===
                for (let i = skirmisherTrails.length - 1; i >= 0; i--) {
                    const trail = skirmisherTrails[i];
                    trail.age += dt;

                    // Rise upward
                    trail.mesh.position.y = trail.baseY + trail.age * 60; // Rise 60 units per second

                    // Fade out and shrink
                    const lifeProgress = trail.age / TRAIL_LIFETIME;
                    trail.mesh.material.opacity = 0.7 * (1 - lifeProgress);
                    trail.mesh.scale.setScalar(1 - lifeProgress * 0.8); // Shrink to 20%

                    // Remove expired trails
                    if (trail.age >= TRAIL_LIFETIME) {
                        scene.remove(trail.mesh);
                        skirmisherTrails.splice(i, 1);
                    }
                }

                // === DOME ATMOSPHERE (fog) ===
                // Fade fog based on dome state
                targetFogDensity = domeActive ? 0.0008 : 0;
                if (scene.fog) {
                    scene.fog.density += (targetFogDensity - scene.fog.density) * dt * 2;
                }
            }

            // === FOAM PARTICLES - orbit around water edge (runs in ALL states) ===
            foamParticles.forEach((particle, i) => {
                const data = particle.userData;

                // In lobby, dome is always active - show normal orbiting
                const isDomeUp = gameState === 'lobby' ? true : domeActive;

                if (isDomeUp) {
                    // Normal orbiting around edge
                    data.angle += dt * data.speed;
                    const radius = currentRingRadius - 15 + data.radiusOffset;
                    particle.position.x = Math.cos(data.angle) * radius;
                    particle.position.z = Math.sin(data.angle) * radius;

                    // Bobbing motion
                    data.bobPhase += dt * data.bobSpeed;
                    particle.position.y = PLATFORM_HEIGHT + 2 + Math.sin(data.bobPhase) * 2;

                    // Reset falling state
                    particle.userData.falling = false;
                    particle.userData.fallVelocity = 0;

                    // Ensure visible
                    particle.material.opacity = 0.4 + Math.sin(data.bobPhase * 0.5) * 0.2;
                } else {
                    // Dome popped - water falls off the edge!
                    if (!data.falling) {
                        data.falling = true;
                        data.fallVelocity = Math.random() * 50 - 25;
                        data.fallSpeed = 100 + Math.random() * 100;
                        // Push outward
                        data.outwardVelocity = 50 + Math.random() * 30;
                    }

                    // Fall down
                    data.fallVelocity += 300 * dt; // Gravity
                    particle.position.y -= data.fallVelocity * dt;

                    // Drift outward
                    const angle = Math.atan2(particle.position.z, particle.position.x);
                    particle.position.x += Math.cos(angle) * data.outwardVelocity * dt;
                    particle.position.z += Math.sin(angle) * data.outwardVelocity * dt;

                    // Fade out as it falls
                    particle.material.opacity = Math.max(0, particle.material.opacity - dt * 0.5);

                    // Reset when far below
                    if (particle.position.y < PLATFORM_HEIGHT - 200) {
                        // Respawn at edge
                        data.angle = Math.random() * Math.PI * 2;
                        const spawnRadius = currentRingRadius - 15 + data.radiusOffset;
                        particle.position.x = Math.cos(data.angle) * spawnRadius;
                        particle.position.z = Math.sin(data.angle) * spawnRadius;
                        particle.position.y = PLATFORM_HEIGHT + 2;
                        particle.material.opacity = 0.4 + Math.random() * 0.4;
                        data.falling = true; // Keep falling
                        data.fallVelocity = Math.random() * 30;
                    }
                }
            });

            // === DYNAMIC CAMERA ===
            // Scale camera distance based on ring size (zoom in as ring shrinks)
            const ringScale = currentRingRadius / RING_START_RADIUS; // 1.0 at start, ~0.14 at min
            const dynamicRadius = 800 + (CAMERA_ORBIT_RADIUS - 800) * ringScale; // Min 800, max 1200
            const dynamicHeight = 600 + (CAMERA_HEIGHT - 600) * ringScale; // Min 600, max 850

            // LOBBY: Fixed camera facing foreground (no orbit until countdown)
            // COUNTDOWN/GAME: Camera orbits the battlefield
            if (gameState === 'lobby' && countdown <= 0) {
                // Fixed position facing the foreground seating area
                // Characters sit at negative Y (2D) = negative Z (3D)
                // Camera at negative Z looks toward positive Z, so we position at positive Z
                cameraAngle = Math.PI * 1.5; // 270 degrees - camera behind looking at front
                camera.position.x = Math.cos(cameraAngle) * dynamicRadius;
                camera.position.z = Math.sin(cameraAngle) * dynamicRadius;
                camera.position.y = dynamicHeight;
                camera.lookAt(0, 50, 0);
            } else {
                // Countdown active OR playing - orbit the battlefield
                cameraAngle += CAMERA_ROTATION_SPEED * dt;
                camera.position.x = Math.cos(cameraAngle) * dynamicRadius;
                camera.position.z = Math.sin(cameraAngle) * dynamicRadius;
                camera.position.y = dynamicHeight;
                camera.lookAt(0, 50, 0);
            }

            // Animate starfield
            stars.rotation.y += dt * 0.01;

            // Update moon and fish visitor
            updateMoonAndFish(dt);

            // Pulse accent lights
            purpleLight.intensity = 0.4 + Math.sin(now * 0.002) * 0.2;
            redLight.intensity = 0.4 + Math.cos(now * 0.0015) * 0.2;

            // === DOME ANIMATIONS ===
            if (domeActive) {
                // Dome is up - subtle pulse
                arenaDome.visible = true;
                domeEdge.visible = true;
                domeMaterial.opacity = 0.15 + Math.sin(now * 0.001) * 0.05;
                domeEdge.material.opacity = 0.12 + Math.sin(now * 0.002) * 0.03;
            } else {
                // Dome is popped!
                if (domePopTimer > 0) {
                    // Pop animation - flash and shatter
                    domePopTimer -= dt;
                    const popProgress = 1 - (domePopTimer / DOME_POP_DURATION);

                    // Flash bright then fade out
                    const flashIntensity = Math.sin(popProgress * Math.PI);
                    domeMaterial.opacity = 0.3 * (1 - popProgress) + flashIntensity * 0.2;
                    domeEdge.material.opacity = 0.4 * (1 - popProgress) + flashIntensity * 0.3;

                    // Expand then shatter
                    const popScale = 1 + popProgress * 0.1;
                    const currentScale = currentRingRadius / RING_START_RADIUS;
                    arenaDome.scale.set(currentScale * popScale, arenaDome.scale.y * popScale, currentScale * popScale);
                    domeEdge.scale.setScalar(currentScale * popScale);

                    if (domePopTimer <= 0) {
                        // Hide dome completely
                        arenaDome.visible = false;
                        domeEdge.visible = false;
                    }
                } else {
                    // Dome is gone
                    arenaDome.visible = false;
                    domeEdge.visible = false;
                }
            }

            // Update victory fireworks
            updateFireworks(dt);

            composer.render();
        }

        // === INIT ===
        const urlParams = new URLSearchParams(window.location.search);
        // Class-specific bot names (3 per class = 15 total for 5 teams)
        const BOT_NAMES_BY_CLASS = {
            support: ['inaja', 'egarim', 'nimrak'],
            recon: ['nessy', 'sinacra', 'egatnav'],
            controller: ['citsuac', 'pippy', 'anailil'],
            assault: ['nosyrb', 'eiggam', 'irihan'],
            skirmisher: ['kurrag', 'enatco', 'briebrie']
        };
        const allNames = Object.values(BOT_NAMES_BY_CLASS).flat();

        // Support ?teams=N (2-5) for fixed team count, or ?demo=1 for cycling demo mode
        const teamCount = parseInt(urlParams.get('teams')) || 0;
        const isDemo = urlParams.get('demo') === '1' || urlParams.get('demo') === 'true' || urlParams.has('demo');

        if (isDemo) {
            // DEMO MODE: Start with 2 teams, cycle through 2→3→4→5 on each game
            demoModeActive = true;
            currentCycleIndex = 0; // Start with 2 teams
            document.getElementById('lobbyUI').style.display = 'flex';
            document.getElementById('currentCount').textContent = '0';
            document.getElementById('targetCount').textContent = '6'; // Will be updated by simulatePlayers
            gameState = 'lobby';
            console.log('🎮 DEMO MODE ACTIVATED - Cycling through 2→3→4→5 teams');
            simulatePlayers(); // Uses staggered 2-second intervals
        } else if (teamCount >= 2 && teamCount <= 5) {
            // FIXED TEAM COUNT: Use specified number of teams
            demoModeActive = false;
            document.getElementById('lobbyUI').style.display = 'flex';
            document.getElementById('currentCount').textContent = '0';
            document.getElementById('targetCount').textContent = teamCount * 3;
            gameState = 'lobby';
            simulatePlayers(); // Uses staggered 2-second intervals
        }
        window.addPlayer = addPlayer;
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
     );
yUI();
        animate();

        // Fade in body once everything is ready (prevents FOUC)
        document.body.classList.add('loaded');
    </script>
</body>
