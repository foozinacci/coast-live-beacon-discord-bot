                    const angleToCenter = Math.atan2(-p.y, -p.x);
                    targetX = p.x + Math.cos(angleToCenter) * 200 * pullStrength;
                    targetY = p.y + Math.sin(angleToCenter) * 200 * pullStrength;
                }

                // === TACTICAL EDGE PUSH ===
                // When dome is down, ring-outs are possible - push enemies off!
                const counters = COUNTERS[p.classKey]?.counters || [];
                const targetDistFromCenter = Math.sqrt(target.x * target.x + target.y * target.y);
                const targetNearEdge = targetDistFromCenter > (currentRingRadius - 100);

                // Dome is active: only push if we counter them
                // Dome is popped: EVERYONE tries to push enemies near edge!
                const shouldPush = !domeActive ? targetNearEdge : (counters.includes(target.classKey) && targetNearEdge);

                if (shouldPush && !isNearEdge) {
                    // Position ourselves between center and target to push them out
                    const angleToTarget = Math.atan2(target.y, target.x);
                    const pushDistance = domeActive ? 50 : 30; // Get even closer when dome is down!
                    targetX = target.x - Math.cos(angleToTarget) * pushDistance;
                    targetY = target.y - Math.sin(angleToTarget) * pushDistance;

                    // Extra aggressive when dome is down - apply stronger push force
                    if (!domeActive && dist(p, target) < 60) {
                        // We're close enough to shove them!
                        const pushForce = 150;
                        target.vx += Math.cos(angleToTarget) * pushForce * dt;
                        target.vy += Math.sin(angleToTarget) * pushForce * dt;
                    }
                }

                // === LOW HP EDGE CAUTION ===
                // If low HP, be extra careful near edge
                if (p.hp / p.maxHp < 0.4 && myDistFromCenter > safeRadius * 0.7) {
                    // Retreat toward center
                    const retreatStrength = 0.6;
                    targetX = p.x * (1 - retreatStrength);
                    targetY = p.y * (1 - retreatStrength);
                }

                p.targetX = targetX;
                p.targetY = targetY;
                p.cautiousMode = false;

                // === JUMP PAD SEEKING (active anti-gravity combat) ===
                const padSeekChance = p.classKey === 'skirmisher' ? 0.15 :
                    p.classKey === 'recon' ? 0.10 : 0.05;
                if (Math.random() < padSeekChance * dt && p.jumpHeight < 5) {
                    // Find nearest visible jump pad
                    let nearestPad = null;
                    let nearestDist = Infinity;
                    for (const pad of bouncePads) {
                        // Use rings array or glow for visibility check (pad.mesh doesn't exist)
                        const padVisible = pad.glow ? pad.glow.visible : (pad.rings && pad.rings[0] ? pad.rings[0].visible : true);
                        if (!padVisible || pad.cooldown > 0) continue;
                        const d = Math.sqrt((p.x - pad.x) ** 2 + (p.y - pad.y) ** 2);
                        if (d < nearestDist && d < 200) {
                            nearestDist = d;
                            nearestPad = pad;
                        }
                    }
                    if (nearestPad) {
                        p.targetX = nearestPad.x;
                        p.targetY = nearestPad.y;
                    }
                }

                // === SHOOTING LOGIC ===
                const fireRate = p.config.fireRate || 1.0;
                // Fire rate scaling - more gradual curve (sqrt for less exponential)
                // 1.0 at start → 0.75 at max eliminations (25% faster, was 50%)
                const progress = getCombatProgress();
                const fireRateMultiplier = 1.0 - Math.sqrt(progress) * 0.25;
                if (p.attackCooldown <= 0 && distToTarget < maxRange) {
                    // Accuracy check before shooting (pre-shot)
                    const shootChance = p.config.acc + (aggro * 0.1); // More aggressive = more likely to shoot
                    if (Math.random() < shootChance) {
                        createProjectile(p, target);
                        p.attackCooldown = fireRate * fireRateMultiplier * (0.8 + Math.random() * 0.4);

                        // Precision trigger (Recon)
                        if (p.classKey === 'recon') p.precisionTimer = 2;
                    }
                }
            });
        }

        // === PHYSICS UPDATE ===
        const REPLICATOR_COLLISION_RADIUS = 40; // Solid pillar radius
        const MELEE_COLLISION_RADIUS = 20; // Distance for melee collision (reduced from 35)
        const MELEE_DAMAGE_BASE = 80; // Base melee damage (scaled to 100s)
        const MELEE_COOLDOWN = 2.0; // Seconds between melee hits (increased from 1.0)

        function updatePhysics(dt) {
            const alivePlayers = players.filter(p => p.alive);

            alivePlayers.forEach(p => {
                const dx = p.targetX - p.x, dy = p.targetY - p.y;
                const d = Math.sqrt(dx * dx + dy * dy);

                // Speed multipliers per class
                const speedMult = { assault: 1.4, skirmisher: 1.35, recon: 1.2, support: 1.1, controller: 0.6 }[p.classKey] || 1.0;

                // Suppress effect reduces speed
                const suppressMult = p.suppressedTimer > 0 ? 0.5 : 1.0;

                // Soul orb slow (after killing someone)
                const soulOrbMult = p.soulOrbSlowTimer > 0 ? SOUL_ORB_SLOW_AMOUNT : 1.0;

                // === SLIPSTREAM BOOST (drafting in Skirmisher trail) ===
                let slipstreamMult = 1.0;
                for (const trail of skirmisherTrails) {
                    if (trail.team === p.team && trail.age < TRAIL_LIFETIME) {
                        const distToTrail = Math.sqrt((p.x - trail.x) ** 2 + (p.y - trail.y) ** 2);
                        if (distToTrail < TRAIL_WIDTH) {
                            slipstreamMult = 1 + TRAIL_BOOST;
                            break;
                        }
                    }
                }

                if (d > 2) {
                    const baseSpeed = 1200 * speedMult * suppressMult * slipstreamMult * soulOrbMult;
                    p.vx += (dx / d) * baseSpeed * dt;
                    p.vy += (dy / d) * baseSpeed * dt;
                }

                // === SKIRMISHER TRAIL SPAWNING (wind streak dust matching aura) ===
                if (p.classKey === 'skirmisher' && p.alive) {
                    const speed = Math.sqrt(p.vx ** 2 + p.vy ** 2);
                    if (speed > 50 && (!p.lastTrailTime || Date.now() - p.lastTrailTime > 60)) {
                        // Spawn BEHIND the player (opposite of movement direction)
                        const moveAngle = Math.atan2(p.vy, p.vx);
                        const behindX = p.x - Math.cos(moveAngle) * 15;
                        const behindY = p.y - Math.sin(moveAngle) * 15;

                        // Create leaf/wind streak shape (same as aura particles)
                        const leafShape = new THREE.Shape();
                        const lw = 1.5; // Width
                        const ll = 5;   // Length
                        leafShape.moveTo(0, -ll);
                        leafShape.quadraticCurveTo(lw * 2, -ll * 0.3, lw, 0);
                        leafShape.quadraticCurveTo(lw * 1.5, ll * 0.5, 0, ll);
                        leafShape.quadraticCurveTo(-lw * 1.5, ll * 0.5, -lw, 0);
                        leafShape.quadraticCurveTo(-lw * 2, -ll * 0.3, 0, -ll);

                        const leafGeo = new THREE.ShapeGeometry(leafShape);
                        const trailMesh = new THREE.Mesh(
                            leafGeo,
                            new THREE.MeshBasicMaterial({
                                color: 0x66ffcc, // Green-cyan
                                transparent: true,
                                opacity: 0.7,
                                side: THREE.DoubleSide
                            })
                        );
                        trailMesh.rotation.x = Math.PI / 2; // Lay flat on ground
                        trailMesh.rotation.z = -moveAngle + Math.PI / 2; // Orient toward movement
                        trailMesh.position.set(behindX, PLATFORM_HEIGHT + 10 + Math.random() * 10, behindY);
                        trailMesh.scale.setScalar(1.5);
                        scene.add(trailMesh);
                        // Store initial Y for vertical rise
                        skirmisherTrails.push({ x: behindX, y: behindY, baseY: trailMesh.position.y, team: p.team, age: 0, mesh: trailMesh });
                        p.lastTrailTime = Date.now();
                    }
                }

                // Friction (reduced when floating from jump pad)
                const frictionMult = (p.floatTimer && p.floatTimer > 0) ? 0.99 : 0.96;
                p.vx *= frictionMult;
                p.vy *= frictionMult;

                // Snag effect - severely slows movement
                if (p.snagTimer && p.snagTimer > 0) {
                    p.vx *= 0.3; // 70% slow per frame while snagged
                    p.vy *= 0.3;
                    p.snagTimer -= dt;
                }

                // === DELAYED SEISMIC KNOCKBACK ===
                // Apply horizontal push after vertical launch
                if (p.seismicKnockback) {
                    p.seismicKnockback.delay -= dt;
                    if (p.seismicKnockback.delay <= 0) {
                        p.vx += p.seismicKnockback.vx;
                        p.vy += p.seismicKnockback.vy;
                        p.seismicKnockback = null;
                    }
                }

                p.x += p.vx * dt;
                p.y += p.vy * dt;
                if (p.floatTimer > 0) p.floatTimer -= dt;

                // === VERTICAL JUMP PHYSICS ===
                if (p.jumpVelocity || p.jumpHeight) {
                    p.jumpHeight = (p.jumpHeight || 0) + (p.jumpVelocity || 0) * dt;
                    p.jumpVelocity = (p.jumpVelocity || 0) - 200 * dt; // Gravity
                    if (p.jumpHeight <= 0) {
                        p.jumpHeight = 0;
                        p.jumpVelocity = 0;
                    }
                }

                // === REPLICATOR COLLISION (only when visible: >4 players) ===
                const alivePlayerCount = players.filter(pl => pl.alive).length;
                if (alivePlayerCount > 4) {
                    const distToCenter = Math.sqrt(p.x * p.x + p.y * p.y);
                    if (distToCenter < REPLICATOR_COLLISION_RADIUS) {
                        // Push player out of the pillar
                        const angle = Math.atan2(p.y, p.x);
                        p.x = Math.cos(angle) * REPLICATOR_COLLISION_RADIUS;
                        p.y = Math.sin(angle) * REPLICATOR_COLLISION_RADIUS;
                        // Bounce velocity
                        p.vx = Math.cos(angle) * 100;
                        p.vy = Math.sin(angle) * 100;
                    }
                }

                // === RAMP COLLISION (solid cover) ===
                for (const ramp of ramps) {
                    if (!ramp.mesh.visible) continue;
                    const distToRamp = Math.sqrt((p.x - ramp.x) ** 2 + (p.y - ramp.y) ** 2);
                    if (distToRamp < RAMP_COLLISION_RADIUS - 10) {
                        const angle = Math.atan2(p.y - ramp.y, p.x - ramp.x);
                        p.x = ramp.x + Math.cos(angle) * (RAMP_COLLISION_RADIUS - 10);
                        p.y = ramp.y + Math.sin(angle) * (RAMP_COLLISION_RADIUS - 10);
                        p.vx *= 0.5; p.vy *= 0.5;
                    }
                }

                // Bounds
                const bound = 560;
                if (Math.abs(p.x) > bound) { p.x = Math.sign(p.x) * bound; p.vx *= -0.7; }
                if (Math.abs(p.y) > bound) { p.y = Math.sign(p.y) * bound; p.vy *= -0.7; }

                // === BOUNCE PAD COLLISION ===
                // Check if player is on a bounce pad
                for (const pad of bouncePads) {
                    if (pad.eliminated) continue; // Skip hidden pads
                    if (pad.cooldown && pad.cooldown > 0) {
                        pad.cooldown -= dt;
                        continue;
                    }

                    const distToPad = Math.sqrt((p.x - pad.x) ** 2 + (p.y - pad.y) ** 2);
                    if (distToPad < BOUNCE_PAD_RADIUS && p.jumpHeight < 5) {
                        // Launch player!
                        p.jumpVelocity = 120; // Strong upward boost
                        p.floatTimer = 1.5; // Reduced friction while airborne

                        // Slight horizontal push away from pad center
                        const pushAngle = Math.atan2(p.y - pad.y, p.x - pad.x);
                        p.vx += Math.cos(pushAngle) * 80;
                        p.vy += Math.sin(pushAngle) * 80;

                        // Pad cooldown (prevents spam bouncing)
                        pad.cooldown = 0.5;
                    }
                }

                // Timers
                if (p.attackCooldown > 0) p.attackCooldown -= dt;
                if (p.spawnProtection > 0) p.spawnProtection -= dt;
                if (p.bleedTimer > 0) p.bleedTimer -= dt;
                if (p.precisionTimer > 0) p.precisionTimer -= dt;
                if (p.disruptedTimer > 0) p.disruptedTimer -= dt;
                if (p.stunnedTimer > 0) p.stunnedTimer -= dt;
                if (p.suppressedTimer > 0) p.suppressedTimer -= dt;
                if (p.meleeCooldown > 0) p.meleeCooldown -= dt;
            });

            // === MELEE COLLISION DAMAGE ===
            // Check for player-player collisions (edge-to-edge, not center-to-center)
            for (let i = 0; i < alivePlayers.length; i++) {
                for (let j = i + 1; j < alivePlayers.length; j++) {
                    const p1 = alivePlayers[i];
                    const p2 = alivePlayers[j];

                    // Skip if either player is invisible (False Positive)
                    if (p1.isInvisible || p2.isInvisible) continue;

                    // Only enemies can damage each other
                    if (p1.team === p2.team) continue;

                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    // Edge-to-edge collision: sum of radii, SCALED with growth
                    const scale = getGrowthScale();
                    const r1 = (p1.radius || 25 * p1.config.hitbox) * scale;
                    const r2 = (p2.radius || 25 * p2.config.hitbox) * scale;
                    const collisionDist = r1 + r2; // Edge to edge, scaled

                    if (dist < collisionDist && dist > 0) {
                        // Weight-based bounce-back (heavier = less knockback received)
                        const weight1 = p1.config.hitbox; // 1.00 - 1.08
                        const weight2 = p2.config.hitbox;
                        const totalWeight = weight1 + weight2;
                        const knockback1 = weight2 / totalWeight; // Lighter gets pushed more
                        const knockback2 = weight1 / totalWeight;

                        // Stronger pushback to prevent overlap
                        const overlap = collisionDist - dist;
                        const pushForce = overlap * 15; // Increased from 8
                        const angle = Math.atan2(dy, dx);

                        // Immediate position separation (prevent bleeding through)
                        p1.x -= Math.cos(angle) * overlap * 0.5 * knockback1;
                        p1.y -= Math.sin(angle) * overlap * 0.5 * knockback1;
                        p2.x += Math.cos(angle) * overlap * 0.5 * knockback2;
                        p2.y += Math.sin(angle) * overlap * 0.5 * knockback2;

                        // Velocity pushback
                        p1.vx -= Math.cos(angle) * pushForce * knockback1;
                        p1.vy -= Math.sin(angle) * pushForce * knockback1;
                        p2.vx += Math.cos(angle) * pushForce * knockback2;
                        p2.vy += Math.sin(angle) * pushForce * knockback2;

                        // Melee damage (if not on cooldown)
                        if (!p1.meleeCooldown || p1.meleeCooldown <= 0) {
                            // Assault deals more melee damage (frontliner)
                            const dmgMult = p1.classKey === 'assault' ? 1.5 : 1.0;
                            const dmg = MELEE_DAMAGE_BASE * dmgMult * p1.config.hitbox;

                            if (p2.spawnProtection <= 0) {
                                p2.hp -= dmg;

                                // Track melee count for kick animation
                                p1.meleeCount = (p1.meleeCount || 0) + 1;
                                const isKick = p1.meleeCount % 3 === 0; // Every 3rd hit is a kick
                                spawnDamageNumber(p2, dmg, p1, true, isKick);

                                if (p2.hp <= 0) {
                                    handlePlayerDeath(p2, p1);
                                }
                            }
                            p1.meleeCooldown = MELEE_COOLDOWN;
                        }

                        if (!p2.meleeCooldown || p2.meleeCooldown <= 0) {
                            const dmgMult = p2.classKey === 'assault' ? 1.5 : 1.0;
                            const dmg = MELEE_DAMAGE_BASE * dmgMult * p2.config.hitbox;

                            if (p1.spawnProtection <= 0) {
                                p1.hp -= dmg;

                                // Track melee count for kick animation
                                p2.meleeCount = (p2.meleeCount || 0) + 1;
                                const isKick = p2.meleeCount % 3 === 0;
                                spawnDamageNumber(p1, dmg, p2, true, isKick);

                                if (p1.hp <= 0) {
                                    handlePlayerDeath(p1, p2);
                                }
                            }
                            p2.meleeCooldown = MELEE_COOLDOWN;
                        }
                    }
                }
            }
        }

        // === PLAYER DEATH HANDLER ===
        function handlePlayerDeath(deadPlayer, killer) {
            // === SKIRMISHER SECOND LIFE (REGENERATED) ===
            // Triggers once when Skirmisher would die - BUT only if at least 1 teammate still alive
            // (Cannot regenerate if last survivor - unlike Support's Second Chance)
            if (deadPlayer.classKey === 'skirmisher' && deadPlayer.hasSecondLife) {
                const aliveTeammates = players.filter(p => p.team === deadPlayer.team && p !== deadPlayer && p.alive);

                if (aliveTeammates.length > 0) {
                    // Has teammates - can regenerate! (INSTANT - skips respawn delay)
                    deadPlayer.hasSecondLife = false; // Used
                    deadPlayer.hp = deadPlayer.maxHp * 0.30; // Revive at 30%
                    deadPlayer.regenerated = true; // Flag for petal visual (inverted up)
                    deadPlayer.spawnProtection = 1.5; // Brief protection
                    deadPlayer.regenScaleTimer = 0.8; // Shrink-grow animation (0.8 seconds)
                    addLog(`🌱 ${deadPlayer.username} REGENERATED!`, 'heal');
                    return; // Don't die - INSTANT, no respawn delay!
                }
                // If no teammates alive, fall through to normal death
            }

            // === SUPPORT SECOND CHANCE ===
            // Triggers ONLY when: Support dies AND no other teammates alive OR respawning
            // One-time use, locks future respawns for team
            if (deadPlayer.classKey === 'support' && deadPlayer.hasSecondChance) {
                const teammates = players.filter(p => p.team === deadPlayer.team && p !== deadPlayer);
                const anyTeammateAlive = teammates.some(p => p.alive);
                const anyTeammateRespawning = teammates.some(p => p.pendingRespawn);

                if (!anyTeammateAlive && !anyTeammateRespawning) {
                    // SECOND CHANCE ACTIVATED!
                    deadPlayer.hasSecondChance = false; // Used - can't happen again
                    deadPlayer.hp = deadPlayer.maxHp * 0.5; // Revive at 50%
                    deadPlayer.alive = true;
                    deadPlayer.spawnProtection = 2; // Brief protection

                    // Lock all team respawns permanently
                    teammates.forEach(t => {
                        t.pendingRespawn = false;
                        t.respawnLocked = true; // Permanent lock
                    });

                    addLog(`💫 ${deadPlayer.username} SECOND CHANCE!`, 'heal');
                    return; // Don't proceed with normal death
                }
            }

            deadPlayer.alive = false;
            firstDeathOccurred = true;
            eliminationCount++;

            // Drop soul orb at death location
            createSoulOrb(deadPlayer.x, deadPlayer.y, deadPlayer, deadPlayer.collectedSoulOrbs || 0);

            // Apply slow to killer (they dropped orbs)
            if (killer) {
                killer.soulOrbSlowTimer = SOUL_ORB_SLOW_DURATION;
            }

            // Check if teammates are still alive for respawn (and not locked)
            const aliveTeammates = players.filter(p => p.team === deadPlayer.team && p.alive);
            if (aliveTeammates.length > 0 && !deadPlayer.respawnLocked) {
                // Start respawn timer
                const respawnBoost = (killer?.collectedSoulOrbs || 0) * RESPAWN_BOOST_PER_ORB;
                deadPlayer.respawnTimer = Math.max(3, BASE_RESPAWN_TIME - respawnBoost);
                deadPlayer.respawnTimerMax = deadPlayer.respawnTimer; // Store initial for progress calculation
                deadPlayer.pendingRespawn = true;
                addLog(`⏳ ${deadPlayer.username} will respawn in ${Math.ceil(deadPlayer.respawnTimer)}s`, 'heal');
            } else if (aliveTeammates.length === 0) {
                // LAST TEAM MEMBER ELIMINATED - CATAPULT TOWARD SCREEN!
                const deadOrb = orbs.find(o => o.player === deadPlayer);
                // Only launch if player hasn't already used second life and isn't already catapulting
                const alreadyCatapulting = catapultModels.some(c => c.player === deadPlayer);
                if (deadOrb && !deadPlayer.usedSecondLife && !alreadyCatapulting) {
                    launchCatapultModel(deadPlayer, deadOrb);
                }
            }

            addLog(`💀 ${killer?.username || 'Ring'} knocked out ${deadPlayer.username}!`, 'kill');
            updateTeamScores();
            checkRoundState();
        }

        // === CATAPULT SYSTEM ===
        // Launches eliminated team's last member toward screen
        let catapultModels = [];

        function launchCatapultModel(player, orb) {
            // Clone the orb's group for the catapult animation
            const catapultGroup = orb.group.clone();
            scene.add(catapultGroup);

            // Initial position from where player died
            catapultGroup.position.set(player.x, PLATFORM_HEIGHT + 30, player.y);

            let velocity, spin, maxAge, isRicochet;

            if (domeActive) {
                // DOME CLOSED: Ricochet inside like deflating balloon
                isRicochet = true;
                const speed = 600 + Math.random() * 400;
                const randomAngle = Math.random() * Math.PI * 2;
                velocity = {
                    x: Math.cos(randomAngle) * speed,
                    y: 300 + Math.random() * 200, // Initial upward burst
                    z: Math.sin(randomAngle) * speed
                };
                spin = {
                    x: (Math.random() - 0.5) * 15,
                    y: (Math.random() - 0.5) * 15,
                    z: (Math.random() - 0.5) * 15
                };
                maxAge = 4; // Longer duration for ricochet effect
            } else {
                // DOME OPEN: Fly toward camera (visitor rescue possible)
                isRicochet = false;
                const angleX = (Math.random() - 0.5) * 1.2;
                const angleY = Math.random() * 0.3 + 0.1;
                const speed = 800 + Math.random() * 400;
                velocity = {
                    x: Math.sin(angleX) * speed * 0.5,
                    y: Math.sin(angleY) * speed * 0.3 + 200,
                    z: Math.cos(angleX) * speed
                };
                spin = {
                    x: (Math.random() - 0.5) * 8,
                    y: (Math.random() - 0.5) * 8,
                    z: (Math.random() - 0.5) * 8
                };
                maxAge = 3;
            }

            catapultModels.push({
                group: catapultGroup,
                player: player,
                velocity: velocity,
                spin: spin,
                age: 0,
                maxAge: maxAge,
                scale: 1,
                hitVisitor: false,
                isRicochet: isRicochet
            });
        }

        function updateCatapultModels(dt) {
            for (let i = catapultModels.length - 1; i >= 0; i--) {
                const cat = catapultModels[i];
                cat.age += dt;

                if (cat.isRicochet) {
                    // RICOCHET MODE: Bounce inside dome like deflating balloon

                    // Less gravity for floaty balloon effect
                    cat.velocity.y -= 150 * dt;

                    // Update position
                    cat.group.position.x += cat.velocity.x * dt;
                    cat.group.position.y += cat.velocity.y * dt;
                    cat.group.position.z += cat.velocity.z * dt;

                    // Bounce off dome walls
                    const distFromCenter = Math.sqrt(
                        cat.group.position.x ** 2 + cat.group.position.z ** 2
                    );
                    const domeRadius = currentRingRadius * 0.95; // Slightly inside dome

                    if (distFromCenter > domeRadius) {
                        // Reflect velocity off dome wall
                        const nx = cat.group.position.x / distFromCenter;
                        const nz = cat.group.position.z / distFromCenter;
                        const dot = cat.velocity.x * nx + cat.velocity.z * nz;
                        cat.velocity.x -= 2 * dot * nx;
                        cat.velocity.z -= 2 * dot * nz;

                        // Push back inside
                        cat.group.position.x = nx * domeRadius * 0.95;
                        cat.group.position.z = nz * domeRadius * 0.95;

                        // Speed up spin on bounce
                        cat.spin.x *= 1.2;
                        cat.spin.y *= 1.2;
                        cat.spin.z *= 1.2;
                    }

                    // Bounce off floor
                    if (cat.group.position.y < PLATFORM_HEIGHT + 20) {
                        cat.group.position.y = PLATFORM_HEIGHT + 20;
                        cat.velocity.y = Math.abs(cat.velocity.y) * 0.7; // Damped bounce
                    }

                    // Bounce off dome ceiling
                    const domeHeight = PLATFORM_HEIGHT + 350;
                    if (cat.group.position.y > domeHeight) {
                        cat.group.position.y = domeHeight;
                        cat.velocity.y = -Math.abs(cat.velocity.y) * 0.8;
                    }

                    // Apply spin (faster for chaotic effect)
                    cat.group.rotation.x += cat.spin.x * dt;
                    cat.group.rotation.y += cat.spin.y * dt;
                    cat.group.rotation.z += cat.spin.z * dt;

                    // Shrink over time like deflating balloon
                    const shrinkProgress = cat.age / cat.maxAge;
                    cat.scale = Math.max(0.1, 1 - shrinkProgress * 0.9);
                    cat.group.scale.setScalar(cat.scale);

                    // Fade out slightly
                    cat.group.traverse(child => {
                        if (child.material && child.material.opacity !== undefined) {
                            child.material.opacity = Math.max(0.3, 1 - shrinkProgress * 0.5);
                        }
                    });

                    // === FINAL PHASE: Sucked into the pipe ===
                    if (shrinkProgress > 0.6) {
                        // Move toward center pipe (replicator)
                        const pipeX = 0;
                        const pipeY = PLATFORM_HEIGHT + 55; // Top of pipe
                        const pipeZ = 0;

                        const toX = pipeX - cat.group.position.x;
                        const toY = pipeY - cat.group.position.y;
                        const toZ = pipeZ - cat.group.position.z;

                        // Strong pull toward pipe
                        const pullStrength = (shrinkProgress - 0.6) / 0.4 * 5; // 0 to 5
                        cat.velocity.x = toX * pullStrength;
                        cat.velocity.y = toY * pullStrength;
                        cat.velocity.z = toZ * pullStrength;

                        // If very close to pipe hole, descend into it
                        const distToPipe = Math.sqrt(toX * toX + toZ * toZ);
                        if (distToPipe < 15 && cat.group.position.y > pipeY - 20) {
                            cat.velocity.y = -200; // Sucked down into pipe
                            cat.group.position.x = pipeX; // Center on pipe
                            cat.group.position.z = pipeZ;
                        }
                    }

                } else {
                    // CAMERA MODE: Fly toward camera

                    // Apply gravity to Y
                    cat.velocity.y -= 400 * dt;

                    // Update position
                    cat.group.position.x += cat.velocity.x * dt;
                    cat.group.position.y += cat.velocity.y * dt;
                    cat.group.position.z += cat.velocity.z * dt;

                    // Apply spin
                    cat.group.rotation.x += cat.spin.x * dt;
                    cat.group.rotation.y += cat.spin.y * dt;
                    cat.group.rotation.z += cat.spin.z * dt;

                    // Scale up as it approaches camera (creates dramatic effect)
                    const distanceToCamera = Math.abs(camera.position.z - cat.group.position.z);
                    if (distanceToCamera < 500) {
                        cat.scale = Math.min(3, 1 + (500 - distanceToCamera) / 200);
                        cat.group.scale.setScalar(cat.scale);
                    }

                    // Check if passed camera (screen collision)
                    if (cat.group.position.z > camera.position.z - 50 && !cat.hitVisitor) {
                        cat.hitVisitor = true;
                        // SECOND LIFE! Visitor returns the player to the arena
                        triggerSecondLifeFromVisitor(cat.player);
                    }
                }

                // Remove after max age or if flew too far (camera mode only)
                if (cat.age > cat.maxAge || (!cat.isRicochet && cat.group.position.z > camera.position.z + 500)) {
                    // Properly dispose geometry and materials to prevent memory leak
                    cat.group.traverse(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(m => m.dispose());
                            } else {
                                child.material.dispose();
                            }
                        }
                    });
                    scene.remove(cat.group);
                    catapultModels.splice(i, 1);
                }
            }
        }

        function triggerSecondLifeFromVisitor(player) {
            // Only grant second life if game hasn't ended and player hasn't used it
            if (gameState === 'victory') return;
            if (player.usedSecondLife) return; // Only one second life per game

            // Mark as used
            player.usedSecondLife = true;

            // Revive the player at center with 30% HP
            player.alive = true;
            player.hp = player.maxHp * 0.3;
            player.x = 0;
            player.y = 0;
            player.vx = 0;
            player.vy = 0;
            player.spawnProtection = 3;
            player.pendingRespawn = false;

            // Recreate their orb3d if needed
            const existingOrb = orbs.find(o => o.player === player);
            if (existingOrb) {
                existingOrb.group.visible = true;
                existingOrb.group.position.set(0, PLATFORM_HEIGHT + 25, 0);
            }

            addLog(`✨ ${player.username} got a SECOND LIFE from the Visitor!`, 'heal');
            updateTeamScores();
        }

        // === RESPAWN UPDATE ===
        function updateRespawns(dt) {
            players.forEach(p => {
                if (!p.alive && p.pendingRespawn && p.respawnTimer > 0) {
                    // CHECK: Is team eliminated? (no alive teammates)
                    const aliveTeammates = players.filter(t => t.team === p.team && t.alive);
                    if (aliveTeammates.length === 0) {
                        // Team wiped - cancel respawn (no green replicator resurrection for eliminated teams)
                        p.pendingRespawn = false;
                        p.respawnTimer = 0;
                        return; // Skip this player
                    }

                    p.respawnTimer -= dt;

                    if (p.respawnTimer <= 0) {
                        const lowestHpAlly = aliveTeammates.reduce((a, b) => a.hp < b.hp ? a : b);

                        // Respawn!
                        p.alive = true;
                        p.hp = p.maxHp * 0.5; // Respawn at 50% HP

                        // Spawn offset - 60u away from ally, biased toward center
                        const angleToCenter = Math.atan2(-lowestHpAlly.y, -lowestHpAlly.x);
                        const spawnAngle = angleToCenter + (Math.random() - 0.5) * Math.PI * 0.5; // ±45° toward center
                        p.x = lowestHpAlly.x + Math.cos(spawnAngle) * 60;
                        p.y = lowestHpAlly.y + Math.sin(spawnAngle) * 60;
                        p.vx = 0;
                        p.vy = 0;
                        p.spawnProtection = 3;
                        p.pendingRespawn = false;
                        p.collectedSoulOrbs = 0; // Reset on respawn
                        p.usedSeismicBurst = false; // Reset Assault ability
                        p.usedFalsePositive = false; // Reset Support ability

                        // Reset Skirmisher Regeneration ability for new life
                        if (p.classKey === 'skirmisher') {
                            p.regenerated = false; // Clear inverted petal visual
                            p.hasSecondLife = true; // Fresh Regeneration ability
                        }

                        // Reset Support Second Chance ability for new life
                        if (p.classKey === 'support') {
                            p.hasSecondChance = true; // Fresh Second Chance ability
                        }

                        addLog(`🔄 ${p.username} respawned on ${lowestHpAlly.username}!`, 'heal');
                    }
                }
            });
        }

        // === PASSIVE HEALTH REGEN ===
        // Only when replicator is GREEN (active) and VISIBLE (>4 players)
        function updateHealthRegen(dt) {
            const aliveCount = players.filter(p => p.alive).length;
            const replicatorVisible = aliveCount > 4 && !replicatorGone;

            const alivePlayers = players.filter(p => p.alive);
            alivePlayers.forEach(p => {
                if (p.hp < p.maxHp) {
                    // Base regen rate
                    let regenRate = HP_REGEN_RATE;

                    // BONUS: Extra regen when replicator is active (green)
                    if (replicatorVisible && replicatorState === 'active') {
                        regenRate += REPLICATOR_ACTIVE_REGEN;
                    }

                    p.hp = Math.min(p.maxHp, p.hp + regenRate * dt);
                }

                // Soul orb slow timer
                if (p.soulOrbSlowTimer > 0) {
                    p.soulOrbSlowTimer -= dt;
                }
            });
        }

        // === SUPPORT FALSE POSITIVE ABILITY ===
        // LIMITED TO 1 PER LIFE (not cooldown-based)
        function activateFalsePositive(support) {
            if (!support.alive || support.classKey !== 'support') return;
            if (support.usedFalsePositive) return; // Already used this life
            if (support.isInvisible) return; // Already using ability

            // Make Support invisible
            support.isInvisible = true;
            const supportOrb = orbs.find(o => o.player === support);
            if (supportOrb) {
                supportOrb.group.visible = false;
            }

            // Create orange hologram decoy at Support's position
            const decoy = {
                owner: support,
                team: support.team,
                x: support.x,
                y: support.y,
                hp: DECOY_HP,
                maxHp: DECOY_HP,
                isDecoy: true,
                username: support.username + ' (DECOY)',
                duration: 15 // Decoy expires after 15 seconds
            };

            // Create 3D representation - orange hologram version of Support
            const decoyOrb = createDecoyOrb(decoy, support);
            decoy.orb3d = decoyOrb;

            decoys.push(decoy);
            support.activeDecoy = decoy;
            support.usedFalsePositive = true; // 1 per life

            addLog(`👻 ${support.username} activated FALSE POSITIVE!`, 'heal');
        }

        function createDecoyOrb(decoy, owner) {
            // Orange hologram version of Support heart
            const group = new THREE.Group();

            const sizes = VISUAL_SIZES['support'];
            const heartSize = sizes.shell * 0.6;

            // Orange hologram material
            const holoMaterial = new THREE.MeshPhongMaterial({
                color: 0xff8c00,
                emissive: 0xff6600,
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.6
            });

            // Parametric heart curve - matches Support (larger, laying flat)
            const scale = sizes.shell * 0.045;
            const heartShape = new THREE.Shape();
            const segments = 50;

            for (let i = 0; i <= segments; i++) {
                const t = (i / segments) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3) * scale;
                const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;

                if (i === 0) {
                    heartShape.moveTo(x, y);
                } else {
                    heartShape.lineTo(x, y);
                }
            }

            const extrudeSettings = {
                depth: scale * 6,
                bevelEnabled: true,
                bevelThickness: scale * 1.5,
                bevelSize: scale * 1,
                bevelSegments: 2
            };

            const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            const heartMesh = new THREE.Mesh(heartGeo, holoMaterial);
            // Lay flat, tip forward
            heartMesh.rotation.x = Math.PI / 2;
            heartMesh.rotation.y = Math.PI;
            heartMesh.position.set(0, -scale * 3, 0);
            group.add(heartMesh);

            // NO EYE - decoys are eyeless (viewers can tell they're fake!)

            // Hologram flicker effect ring
            const ring = new THREE.Mesh(
                new THREE.RingGeometry(sizes.shell * 1.5, sizes.shell * 1.6, 32),
                new THREE.MeshBasicMaterial({ color: 0xff8c00, transparent: true, opacity: 0.4, side: THREE.DoubleSide })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = -10;
            group.add(ring);

            group.position.set(decoy.x, PLATFORM_HEIGHT + 25, decoy.y);
            scene.add(group);

            return { group, ring };
        }

        function updateDecoys(dt) {
            for (let i = decoys.length - 1; i >= 0; i--) {
                const decoy = decoys[i];

                // Countdown decoy duration
                decoy.duration -= dt;

                // Hologram flicker effect (faster flicker when about to expire)
                if (decoy.orb3d) {
                    const flickerSpeed = decoy.duration < 3 ? 0.03 : 0.01; // Faster flicker when expiring
                    const flicker = 0.4 + Math.sin(Date.now() * flickerSpeed) * 0.2;
                    decoy.orb3d.group.children.forEach(child => {
                        if (child.material && child.material.opacity !== undefined) {
                            child.material.opacity = flicker;
                        }
                    });
                    decoy.orb3d.ring.rotation.z += dt * 2;

                    // Update decoy visual position
                    decoy.orb3d.group.position.set(decoy.x, PLATFORM_HEIGHT + 25, decoy.y);
                }

                // Check if decoy fell off platform - respawn and rush to center
                const decoyDist = Math.sqrt(decoy.x * decoy.x + decoy.y * decoy.y);
                if (decoyDist > currentRingRadius) {
                    // Respawn at ring edge, pointing toward center
                    const angle = Math.atan2(decoy.y, decoy.x);
                    decoy.x = Math.cos(angle) * (currentRingRadius - 50);
                    decoy.y = Math.sin(angle) * (currentRingRadius - 50);
                    decoy.targetX = 0; // Rush to Replicator
                    decoy.targetY = 0;
                }

                // Move decoy toward its target (default: center when recovering)
                if (decoy.targetX !== undefined) {
                    const dx = decoy.targetX - decoy.x;
                    const dy = decoy.targetY - decoy.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 10) {
                        decoy.x += (dx / dist) * 150 * dt; // Move toward target
                        decoy.y += (dy / dist) * 150 * dt;
                    }
                }

                // Check if decoy is destroyed OR expired (15 second duration)
                const decoyExpired = decoy.duration <= 0;
                if (decoy.hp <= 0 || decoyExpired) {
                    // Reveal the real Support
                    const owner = decoy.owner;
                    owner.isInvisible = false;
                    owner.activeDecoy = null;

                    // Make Support visible again at decoy position
                    owner.x = decoy.x;
                    owner.y = decoy.y;
                    const supportOrb = orbs.find(o => o.player === owner);
                    if (supportOrb) {
                        supportOrb.group.visible = true;
                    }

                    // Remove decoy visual
                    if (decoy.orb3d) {
                        scene.remove(decoy.orb3d.group);
                    }

                    decoys.splice(i, 1);
                    if (decoyExpired) {
                        addLog(`⏱️ ${owner.username}'s decoy expired! REVEALED!`, 'kill');
                    } else {
                        addLog(`💥 ${owner.username}'s decoy destroyed! REVEALED!`, 'kill');
                    }
                }
            }
        }

        // === PROJECTILE CREATION ===
        function createProjectile(attacker, target) {
            const dx = target.x - attacker.x;
            const dy = target.y - attacker.y;
            const d = Math.sqrt(dx * dx + dy * dy) || 1;
            const speed = attacker.config.projectileSpeed || 500; // Use class-specific bullet speed
            const proj = {
                x: attacker.x, y: attacker.y,
                startX: attacker.x, startY: attacker.y,
                vx: (dx / d) * speed, vy: (dy / d) * speed,
                attacker, target, alive: true
            };
            projectiles.push(proj);
            projectile3Ds.push(new Projectile3D(proj));
        }

        // === PROJECTILE UPDATE ===
        function updateProjectiles(dt) {
            // CACHE: count alive once, not per projectile
            const alivePlayers = players.filter(pl => pl.alive);
            const aliveCount = alivePlayers.length;

            projectiles.forEach((p, i) => {
                if (!p.alive) return;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                projectile3Ds[i]?.update();

                // === REPLICATOR PROJECTILE COLLISION (only when visible: >4 players) ===
                if (aliveCount > 4) {
                    const distToCenter = Math.sqrt(p.x * p.x + p.y * p.y);
                    if (distToCenter < REPLICATOR_COLLISION_RADIUS) {
                        p.alive = false;
                        return;
                    }
                }

                // === RAMP COLLISION - projectiles blocked by ramps ===
                for (const ramp of ramps) {
                    if (!ramp.mesh.visible) continue;
                    const distToRamp = Math.sqrt((p.x - ramp.x) ** 2 + (p.y - ramp.y) ** 2);
                    if (distToRamp < RAMP_COLLISION_RADIUS) {
                        p.alive = false;
                        return;
                    }
                }

                // === DECOY COLLISION - projectiles can hit decoys ===
                decoys.forEach(decoy => {
                    if (decoy.team === p.attacker.team) return; // Friendly decoy
                    const d = Math.sqrt((p.x - decoy.x) ** 2 + (p.y - decoy.y) ** 2);
                    if (d < 30 && decoy.hp > 0) {
                        // Decoys take full damage (no dodge/evasion)
                        const dmg = p.attacker.config.dmg[0] + Math.random() * (p.attacker.config.dmg[1] - p.attacker.config.dmg[0]);
                        decoy.hp -= dmg;
                        p.alive = false;

                        // Visual feedback
                        if (decoy.orb3d) {
                            decoy.orb3d.group.children.forEach(child => {
                                if (child.material) child.material.emissiveIntensity = 1.0;
                            });
                            setTimeout(() => {
                                if (decoy.orb3d) {
                                    decoy.orb3d.group.children.forEach(child => {
                                        if (child.material) child.material.emissiveIntensity = 0.5;
                                    });
                                }
                            }, 100);
                        }
                    }
                });

                // Hit real players (exclude invisible supports who have active decoys)
                alivePlayers.forEach(target => {
                    if (target.team === p.attacker.team || target.isInvisible) return;
                    const d = dist(p, target);
                    const hitRadius = target.radius || 25;
                    if (d < hitRadius + 5 && target.spawnProtection <= 0) {
                        // Accuracy check
                        const acc = p.attacker.config.acc + (p.attacker.accBonus || 0) + (p.attacker.teamAccuracyBonus || 0);
                        if (Math.random() > acc) { p.alive = false; return; }

                        // Evasion check
                        let eva = target.config.eva + (target.evaBonus || 0);
                        if (target.disruptedTimer > 0) eva *= 0.9;
                        if (target.precisionTimer > 0) eva += 0.04;
                        if (Math.random() < eva) { p.alive = false; return; }

                        // Damage calc
                        let dmg = p.attacker.config.dmg[0] + Math.random() * (p.attacker.config.dmg[1] - p.attacker.config.dmg[0]);

                        // Range falloff
                        const travel = Math.sqrt((p.x - p.startX) ** 2 + (p.y - p.startY) ** 2);
                        const maxRange = R * p.attacker.config.range;
                        const falloffStart = maxRange * 0.7;
                        if (travel >= maxRange) dmg *= 0.05;
                        else if (travel > falloffStart) dmg *= 1.0 - 0.95 * ((travel - falloffStart) / (maxRange - falloffStart)) ** 2;

                        // === PERKS ===
                        // Rampage (Assault)
                        if (p.attacker.classKey === 'assault') dmg *= 1 + 0.30 * (p.attacker.config.momentum / 40);

                        // Execution (Assault)
                        if (p.attacker.classKey === 'assault' && target.hp / target.maxHp < 0.20 && Math.random() < 0.22) {
                            dmg = target.hp + 1;
                            addLog(`⚡ ${p.attacker.username} EXECUTED ${target.username}!`, 'kill');
                        }

                        // Counter (Skirmisher vs high acc)
                        if (p.attacker.classKey === 'skirmisher' && target.config.acc >= 0.90) dmg *= 1.30;

                        // === AIRBORNE CRITICAL HIT ===
                        // Shooting airborne targets (in the air) = bonus damage
                        const targetAirborne = (target.jumpHeight || 0) > 20;
                        const attackerAirborne = (p.attacker.jumpHeight || 0) > 20;

                        if (targetAirborne && p.attacker.classKey === 'recon') {
                            // Recon gets 50% bonus for sniping airborne targets
                            dmg *= 1.50;
                            addLog(`🎯 ${p.attacker.username} CRITICAL on airborne ${target.username}!`, 'kill');
                        } else if (targetAirborne) {
                            // Everyone else gets 25% bonus on airborne
                            dmg *= 1.25;
                        }

                        // Attacker shooting while airborne also gets bonus (aerial combat)
                        if (attackerAirborne) {
                            dmg *= 1.15; // 15% bonus for air-to-ground/air-to-air
                        }

                        // Team bonuses
                        dmg *= 1 + (p.attacker.teamDamageBonus || 0);
                        dmg *= 1 - (target.teamDamageResist || 0);

                        // Controller Parry - per-opponent, one chance each
                        let parried = false;
                        const attackerId = p.attacker.id;
                        if (target.classKey === 'controller' && target.parryTargets && target.parryTargets[attackerId]) {
                            const parryChance = target.config.parryChance || 0.25;
                            if (Math.random() < parryChance) {
                                parried = true;
                                const reflectDmg = dmg * (target.config.parryReflect || 0.50);
                                p.attacker.hp -= reflectDmg;
                                addLog(`🛡️ ${target.username} PARRIED ${p.attacker.username}! (${Math.round(reflectDmg)} reflected)`, 'heal');
                                dmg *= 0.25; // Only take 25% damage on parry

                                // Trigger parry shield animation
                                target.parryShieldTimer = 0.5; // Half second flash

                                // Check if attacker dies from reflect
                                if (p.attacker.hp <= 0) {
                                    handlePlayerDeath(p.attacker, target);
                                }
                            }
                            // Consume the parry chance for this attacker (hit or miss)
                            target.parryTargets[attackerId] = false;
                        }

                        // Class damage reduction (Controller has 15%)
                        dmg *= 1 - (target.config.damageReduction || 0);

                        // Suppress (Controller)
                        if (target.classKey === 'controller') p.attacker.suppressedTimer = 3;

                        // Disrupt (Recon stun)
                        if (p.attacker.classKey === 'recon' && target.config.exec < 0.10 && target.classKey !== 'controller' && Math.random() < 0.25) {
                            target.stunnedTimer = 0.5;
                        }

                        // Bleed (Skirmisher)
                        if (p.attacker.classKey === 'skirmisher') target.bleedTimer = 5;

                        target.hp -= dmg;
                        spawnDamageNumber(target, dmg, p.attacker, false); // Floating damage number

                        if (target.hp <= 0) {
                            // All death handling goes through handlePlayerDeath
                            // (it handles Second Chance, Regeneration, etc.)
                            handlePlayerDeath(target, p.attacker);
                        }
                        p.alive = false;
                    }
                });
                if (Math.abs(p.x) > 700 || Math.abs(p.y) > 700) p.alive = false;
            });

            for (let i = projectiles.length - 1; i >= 0; i--) {
                if (!projectiles[i].alive) {
                    projectile3Ds[i]?.destroy();
                    projectiles.splice(i, 1);
                    projectile3Ds.splice(i, 1);
                }
            }
        }

        // === GAME FLOW ===
        function getSpawnPositions(teamCount) {
            const positions = [];
            // Spawn radius - teams on points of a star shape
            const baseRadius = 380; // Slightly closer to center than pads (pads are at 280)

            // Star/Pentagram formation: 5 teams = 5 points of star (72° apart)
            // Start at top (12 o'clock position) for consistent star look
            const startAngle = -Math.PI / 2; // Top of screen

            // OFFSET: Spawn BETWEEN pads (half-step rotation)
            const halfStep = Math.PI / teamCount; // Half the angle between pads

            for (let t = 0; t < teamCount; t++) {
                // Each team spawns BETWEEN pad positions (offset by half-step)
                const angle = startAngle + (t / teamCount) * Math.PI * 2 + halfStep;
                const cx = Math.cos(angle) * baseRadius;
                const cy = Math.sin(angle) * baseRadius;

                // Spread team members in a triangle formation
                // Leader in front, flanks to the RIGHT (perpendicular to center direction)
                const spread = 45;
                const perpAngle = angle + Math.PI / 2; // Perpendicular (to the right from player's view)
                positions.push([
                    { x: cx, y: cy }, // Leader (front)
                    {
                        x: cx + Math.cos(perpAngle) * spread * 0.8,
                        y: cy + Math.sin(perpAngle) * spread * 0.8
                    }, // Right flank
                    {
                        x: cx + Math.cos(perpAngle) * spread * 1.5 - Math.cos(angle) * 20,
                        y: cy + Math.sin(perpAngle) * spread * 1.5 - Math.sin(angle) * 20
                    }  // Far right, slightly back
                ]);
            }
            console.log(`⭐ Pentagram spawn for ${teamCount} teams`);
            return positions;
        }

        // Shuffle helper for randomized class assignment
        function shuffleArray(arr) {
            const shuffled = [...arr];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // CLASS DISTRIBUTION RULES:
        // 1. No class appears twice on same team (3 unique per team)
        // 2. No class appears more than 3 times across all 5 teams

        // Track class assignments
        let teamClassPools = {};       // Per-team: array of assigned classes
        let globalClassCounts = {};    // Global: class -> count
        const MAX_PER_CLASS = 3;

        // Initialize global counts
        classKeys.forEach(c => globalClassCounts[c] = 0);

        function addPlayer(username, platform = 'Discord', serverSlot = null, serverClassKey = null, serverTeam = null, metadata = {}) {
            if (players.length >= MAX_PLAYERS) return null;
            if (players.find(p => p.username.toLowerCase() === username.toLowerCase())) return null;

            // FFA: each player is their own team
            // Teams: Sequential fill - players 1-3 → Team1, 4-6 → Team2, etc.
            // Visual layout uses snake pattern (handled in initLobbyCards)
            const isFFA = window.gameMode === 'ffa';
            const playersPerTeam = window.lobbyConfig?.playersPerTeam || 3;
            // Use server-provided team if available, else calculate locally
            const team = serverTeam || (isFFA ? (players.length + 1) : Math.floor(players.length / playersPerTeam) + 1);

            // Initialize team's class pool if new team
            if (!teamClassPools[team]) {
                teamClassPools[team] = [];
            }

            // Get classes that are:
            // 1. Not already on this team (no duplicates)
            // 2. Not at global max (max 3 per class)
            const usedOnTeam = teamClassPools[team];
            let available = classKeys.filter(c =>
                !usedOnTeam.includes(c) &&
                globalClassCounts[c] < MAX_PER_CLASS
            );

            // 3. Check if adding this class would create a duplicate team composition
            // Only check when team is about to be complete (2 players already, adding 3rd)
            if (usedOnTeam.length === 2) {
                available = available.filter(classToAdd => {
                    const potentialTeam = [...usedOnTeam, classToAdd].sort().join(',');
                    // Check all other complete teams
                    for (const [otherTeamId, otherClasses] of Object.entries(teamClassPools)) {
                        if (parseInt(otherTeamId) !== team && otherClasses.length === 3) {
                            const otherTeamCombo = [...otherClasses].sort().join(',');
                            if (potentialTeam === otherTeamCombo) {
                                return false; // Would create duplicate composition
                            }
                        }
                    }
                    return true;
                });
            }

            // Shuffle and pick first available
            const shuffled = shuffleArray(available);
            let classKey;

            // Use server-provided classKey if available (from Twitch/Discord), else assign randomly
            if (serverClassKey && classKeys.includes(serverClassKey)) {
                classKey = serverClassKey;
                console.log(`[Arena] Using server-assigned class: ${classKey} for ${username}`);
            } else if (shuffled.length > 0) {
                classKey = shuffled[0];
            } else {
                // Fallback: pick any class NOT already on this team AND under max global count
                const notOnTeam = classKeys.filter(c =>
                    !usedOnTeam.includes(c) && globalClassCounts[c] < MAX_PER_CLASS
                );
                if (notOnTeam.length > 0) {
                    classKey = notOnTeam[Math.floor(Math.random() * notOnTeam.length)];
                } else {
                    // LAST RESORT: just pick one not on team (should never happen with 5 classes)
                    const anyNotOnTeam = classKeys.filter(c => !usedOnTeam.includes(c));
                    classKey = anyNotOnTeam[0] || classKeys[0];
                    console.warn('Class assignment fallback - MAX_PER_CLASS may be exceeded!');
                }
            }

            // Update tracking
            teamClassPools[team].push(classKey);
            globalClassCounts[classKey]++;

            const config = CLASSES[classKey];

            // Position for lobby showcase - arrange to match snake pattern grid
            // Team determines column (0-4), slot within team determines row
            // Odd teams (1,3,5): fill top→bottom
            // Even teams (2,4): fill bottom→top (reversed visually)
            const slotInTeam = teamClassPools[team].length - 1; // 0, 1, or 2 within team
            const col = team - 1; // Team 1 = col 0, Team 2 = col 1, etc.

            // Calculate row based on snake pattern
            let row;
            if (team % 2 === 1) {
                // Odd team: top to bottom (slot 0 = row 0, slot 1 = row 1, slot 2 = row 2)
                row = slotInTeam;
            } else {
                // Even team: bottom to top visually, but we reverse display via CSS
                // So in terms of 3D position, we keep same order but CSS reverses
                row = slotInTeam;
            }

            // Grid position in 3D space - FOREFRONT of battlefield (negative Y = toward camera)
            // Negate X to appear left-to-right from camera's perspective (camera at 270 deg)
            const lobbyX = -(col - 2) * 100; // Flipped: team 1 on left, team 5 on right
            const lobbyY = -100 - row * 80;  // Negative Y = forefront, rows go back from there

            const player = {
                id: players.length, username, platform, team, classKey, config,
                hp: config.hp, maxHp: config.hp,
                x: lobbyX, y: lobbyY, vx: 0, vy: 0, targetX: lobbyX, targetY: lobbyY, homeX: 0, homeY: 0,
                alive: true, radius: 25 * config.hitbox, spawnProtection: 4, attackCooldown: 0,
                hasSecondChance: config.perks.includes('secondChance'),
                hasSecondLife: config.perks.includes('secondLife'),
                bleedTimer: 0, precisionTimer: 0, disruptedTimer: 0, stunnedTimer: 0, suppressedTimer: 0,
                parryTargets: {},  // Per-opponent parry: { playerId: true } = has parry available
                cautiousMode: false, currentTarget: null, anchorPoint: null,
                lobbyPosition: { x: lobbyX, y: lobbyY }, // Store lobby position
                reconMarkTimer: classKey === 'recon' ? RECON_MARK_COOLDOWN : 0, // Recon ability cooldown
                // === FLAIR METADATA ===
                isBirthday: metadata.isBirthday || false,
                isAdmin: metadata.isAdmin || false,
                badges: metadata.badges || []
            };
            players.push(player);
            orbs.push(new Orb3D(player));

            // === TRIGGER REPLICATOR RISE when first player joins (lobby becomes active) ===
            if (players.length === 1 && !replicatorRisen && !replicatorRising) {
                replicatorRising = true;
                console.log('🔵 Replicator rising - lobby activated!');
            }
            // === BOUNCE PADS NOW CREATED IN FORMATION AT START ===
            // Pads are created by createBouncePadsForTeams() in simulatePlayers()
            // This ensures proper geometric formations (square, triangle, etc.)

            // === COLOR PAD when team is complete (3 members) ===
            if (teamClassPools[team].length === 3) {
                // Get team's class colors and blend them
                const teamClasses = teamClassPools[team];
                const classColorsHex = teamClasses.map(c => CLASSES[c].colorHex);
                const blendedColor = blendColors(classColorsHex);

                // Find and update the pad for this team
                const teamPad = bouncePads.find(pad => pad.team === team);
                if (teamPad) {
                    // Update pad color to team blend
                    teamPad.originalColor = blendedColor;
                    if (teamPad.rings) {
                        teamPad.rings.forEach((ring, i) => {
                            const t = i / (teamPad.rings.length - 1);
                            ring.material.color.setHex(blendedColor);
                            ring.material.opacity = 0.8 - t * 0.4;
                        });
                    }
                    if (teamPad.border) teamPad.border.material.color.setHex(blendedColor);
                    console.log(`🚀 Team ${team} pad colored!`);
                    addLog(`🚀 Team ${team} ready!`, 'heal');
                }
            }

            updateLobbyUI();
            checkCountdown();
            return player;
        }

        // Remove a player from the lobby with seat shuffling
        function removePlayer(username) {
            const playerIndex = players.findIndex(p => p.username.toLowerCase() === username.toLowerCase());
            if (playerIndex === -1) {
                console.log(`❌ Player ${username} not found`);
                return false;
            }

            const player = players[playerIndex];
            const oldTeam = player.team;
            const oldClassKey = player.classKey;

            console.log(`👋 ${username} leaving (Team ${oldTeam}, ${oldClassKey})`);
            addLog(`👋 ${username} left the game`, 'info');

            // Clean up the orb
            const orbIndex = orbs.findIndex(o => o.player.id === player.id);
            if (orbIndex !== -1) {
                const orb = orbs[orbIndex];
                orb.destroy();
                scene.remove(orb.group);
                if (orb.shadow) scene.remove(orb.shadow);
                orbs.splice(orbIndex, 1);
            }

            // Remove from players array
            players.splice(playerIndex, 1);

            // Update class pools
            const classIndex = teamClassPools[oldTeam]?.indexOf(oldClassKey);
            if (classIndex !== -1) {
                teamClassPools[oldTeam].splice(classIndex, 1);
                globalClassCounts[oldClassKey]--;
            }

            // === SHUFFLE REMAINING PLAYERS FORWARD ===
            // Everyone after this player moves up one seat
            const playersPerTeam = window.lobbyConfig?.playersPerTeam || 3;

            // Reassign all players from scratch based on their new position
            players.forEach((p, newIndex) => {
                const newTeam = Math.floor(newIndex / playersPerTeam) + 1;
                const slotInTeam = newIndex % playersPerTeam;
                const col = newTeam - 1;
                let row = slotInTeam;

                // Update player properties
                const oldPlayerTeam = p.team;
                p.team = newTeam;

                // Update lobby position
                const lobbyX = -(col - 2) * 100;
                const lobbyY = -100 - row * 80;
                p.x = lobbyX;
                p.y = lobbyY;
                p.lobbyPosition = { x: lobbyX, y: lobbyY };

                // If team changed, we need to rebuild class pools
                if (oldPlayerTeam !== newTeam) {
                    const oldIndex = teamClassPools[oldPlayerTeam]?.indexOf(p.classKey);
                    if (oldIndex !== -1) teamClassPools[oldPlayerTeam].splice(oldIndex, 1);
                    if (!teamClassPools[newTeam]) teamClassPools[newTeam] = [];
                    teamClassPools[newTeam].push(p.classKey);
                }
            });

            // === UPDATE PAD COLORS ===
            // Check each team's status and update pads accordingly
            const targetTeams = window.lobbyConfig?.targetTeams || 5;
            for (let team = 1; team <= targetTeams; team++) {
                const teamPlayers = players.filter(p => p.team === team);
                const teamPad = bouncePads.find(pad => pad.team === team);

                if (!teamPad) continue;

                if (teamPlayers.length === 0) {
                    // No players - hide pad
                    if (teamPad.rings) teamPad.rings.forEach(r => r.visible = false);
                    if (teamPad.glow) teamPad.glow.visible = false;
                    if (teamPad.border) teamPad.border.visible = false;
                } else if (teamPlayers.length < 3) {
                    // Incomplete team - show GRAY pad
                    if (teamPad.rings) teamPad.rings.forEach(r => {
                        r.visible = true;
                        r.material.color.setHex(0x444444);
                    });
                    if (teamPad.glow) {
                        teamPad.glow.visible = true;
                    }
                    if (teamPad.border) {
                        teamPad.border.visible = true;
                        teamPad.border.material.color.setHex(0x444444);
                    }
                } else {
                    // Complete team - show team colors
                    const teamClasses = teamClassPools[team] || [];
                    const classColorsHex = teamClasses.map(c => CLASSES[c]?.colorHex || 0xffffff);
                    const blendedColor = blendColors(classColorsHex);

                    if (teamPad.rings) teamPad.rings.forEach((ring, i) => {
                        ring.visible = true;
                        ring.material.color.setHex(blendedColor);
                    });
                    if (teamPad.border) {
                        teamPad.border.visible = true;
                        teamPad.border.material.color.setHex(blendedColor);
                    }
                }
            }

            // Reassign all player IDs
            players.forEach((p, i) => p.id = i);

            updateLobbyUI();
            return true;
        }

        // Expose for debugging and external access
        window.addPlayer = addPlayer;
        window.removePlayer = removePlayer;

        // Mini character renderers for lobby (keyed by canvasId)
        const lobbyCharacterRenderers = [];
        const lobbyRenderersBySlot = new Map(); // Map<canvasId, { renderer, getAnimId }>
        let lobbyInitialized = false;
        let playersPanelUpdateTimer = null; // Throttle players panel updates

        function initLobbyCards() {
            // Center grid is now hidden - teams only shown in left PLAYERS panel
            // Just initialize lobbyConfig without creating team cards
            const grid = document.getElementById('playerGrid');
            if (grid) grid.innerHTML = ''; // Clear any leftover content

            // Get game mode and team count from URL
            const urlParams = new URLSearchParams(window.location.search);
            const teamsParam = urlParams.get('teams');
            const modeParam = urlParams.get('mode');
            const isFFA = teamsParam === 'ffa' || modeParam === 'ffa';
            const targetTeams = isFFA ? 6 : Math.max(2, Math.min(5, parseInt(teamsParam) || 5));
            const playersPerTeam = isFFA ? 1 : 3;

            // Store for later use
            window.lobbyConfig = { isFFA, targetTeams, playersPerTeam };

            // No team cards created - left PLAYERS panel is the only team display
            lobbyInitialized = true;
        }

        function updateLobbyUI() {
            if (!lobbyInitialized) {
                initLobbyCards();
            }

            const { isFFA, targetTeams, playersPerTeam } = window.lobbyConfig || { isFFA: false, targetTeams: 5, playersPerTeam: 3 };

            // Update player count display
            document.getElementById('currentCount').textContent = players.length;

            // Use unified team panel for lobby display (same panel used in-game)
            // Throttled to reduce stutter
            if (!playersPanelUpdateTimer) {
                playersPanelUpdateTimer = setTimeout(() => {
                    playersPanelUpdateTimer = null;
                    updateTeamScores(); // Unified function handles both lobby/game states
                }, 200);
            }
        }

        // (rebuildPlayersPanel removed - now using unified updateTeamScores for both lobby and game)

        // Shared renderer for lobby character cards (prevents WebGL context overflow)
        let lobbyCardRenderer = null;
        const lobbyCardScenes = new Map(); // canvasId -> { miniScene, camera, orb3d, angle }
        let lobbyCardAnimId = null;

        function initLobbyCardRenderer() {
            if (lobbyCardRenderer) return;
            const offscreenCanvas = document.createElement('canvas');
            offscreenCanvas.width = 50;
            offscreenCanvas.height = 50;
            lobbyCardRenderer = new THREE.WebGLRenderer({
                canvas: offscreenCanvas,
                alpha: true,
                antialias: true,
                preserveDrawingBuffer: true
            });
            lobbyCardRenderer.setSize(50, 50);
            lobbyCardRenderer.setClearColor(0x000000, 0);
        }

        function renderMiniCharacter(canvas, player) {
            initLobbyCardRenderer();

            const canvasId = canvas.id;

            // Create mini scene for this character
            const miniScene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
            camera.position.set(0, 40, 80);
            camera.lookAt(0, 20, 0);

            miniScene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(5, 10, 5);
            miniScene.add(dirLight);

            // Use actual Orb3D class for authentic character visuals (thumbnailMode = true)
            const orb3d = new Orb3D(player, true);
            orb3d.group.position.y = 20;
            orb3d.group.scale.setScalar(0.8);
            miniScene.add(orb3d.group);

            lobbyCardScenes.set(canvasId, {
                canvas,
                miniScene,
                camera,
                orb3d,
                angle: Math.random() * Math.PI * 2
            });
        }

        function animateLobbyCards() {
            if (lobbyCardScenes.size === 0 || !lobbyCardRenderer) {
                lobbyCardAnimId = requestAnimationFrame(animateLobbyCards);
                return;
            }

            // Render each character to shared renderer, then copy to target canvas
            lobbyCardScenes.forEach((data, canvasId) => {
                const { canvas, miniScene, camera, orb3d } = data;
                if (!canvas || !document.body.contains(canvas)) {
                    // Canvas removed from DOM, cleanup
                    lobbyCardScenes.delete(canvasId);
                    return;
                }

                data.angle += 0.02;
                orb3d.group.rotation.y = data.angle;

                // Render to shared offscreen canvas
                lobbyCardRenderer.render(miniScene, camera);

                // Copy to target canvas
                const ctx = canvas.getContext('2d');
                if (ctx) {
                    ctx.clearRect(0, 0, 50, 50);
                    ctx.drawImage(lobbyCardRenderer.domElement, 0, 0, 50, 50);
                }
            });

            lobbyCardAnimId = requestAnimationFrame(animateLobbyCards);
        }

        // Start lobby card animation loop
        animateLobbyCards();

        function checkCountdown() {
            if (players.length >= 9 && countdown <= 0) {
                countdown = COUNTDOWN_TIME;
                const timerEl = document.getElementById('countdownTimer');
                const msgEl = document.getElementById('waitingMsg');
                if (timerEl) timerEl.textContent = countdown;
                if (msgEl) msgEl.textContent = 'Starting soon...';
            }
        }

        function startCombat() {
            // Cleanup lobby character scenes (shared renderer stays for reuse)
            lobbyCardScenes.forEach((data, canvasId) => {
                // Dispose orb3d resources
                if (data.orb3d) {
                    data.orb3d.group.traverse(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(m => m.dispose());
                            } else {
                                child.material.dispose();
                            }
                        }
                    });
                }
            });
            lobbyCardScenes.clear();
            lobbyCharacterRenderers.length = 0; // Legacy cleanup

            gameState = 'playing';
            prepPhaseTimer = 10; // Reset prep phase
            firstDeathOccurred = false; // Reset chaos mode
            initialTargetAssignments.clear(); // Reset 1v1v1 assignments
            startingPlayerCount = players.length; // Track for growth scaling
            eliminationCount = 0; // Reset eliminations
            document.getElementById('lobbyUI').style.display = 'none';
            document.getElementById('overlayHUD').style.display = 'block';
            const teamCount = Math.ceil(players.length / 3);
            startingTeamCount = teamCount; // Track for size scaling (3 teams = 3x, 4 = 2x, 5 = 1x)

            // Bounce pads already created during lobby seating - persist into game
            // Ensure all pad colors are correct (in case shuffling corrupted them)
            refreshBouncePadColors();

            const spawns = getSpawnPositions(teamCount);

            // Apply team passives and assign team names
            for (let team = 1; team <= teamCount; team++) {
                const teamPlayers = players.filter(p => p.team === team);
                let teamDR = 0, teamDmg = 0, teamAcc = 0;

                // Get team name and colors from class composition
                const teamClasses = teamPlayers.map(p => p.classKey).filter(Boolean);
                const teamName = getTeamName(teamClasses);
                const teamColorsHex = getTeamColors(teamClasses);
                const teamBlendedColor = blendColors(teamColorsHex);

                // Store composition for HUD
                teamCompositions[team] = teamClasses;

                teamPlayers.forEach(p => {
                    if (p.classKey === 'support') teamDR += 0.05;
                    if (p.classKey === 'assault') teamDmg += 0.05;
                    if (p.classKey === 'recon') teamAcc += 0.05;
                });
                teamPlayers.forEach(p => {
                    p.teamDamageResist = teamDR;
                    p.teamDamageBonus = teamDmg;
                    p.teamAccuracyBonus = teamAcc;
                    p.teamName = teamName; // Assign thematic team name
                    p.teamColors = teamColorsHex; // Array of 3 class colors
                    p.teamBlendedColor = teamBlendedColor; // Single blended color
