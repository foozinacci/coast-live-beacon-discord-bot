                            this.pupil.position.z += (targetZ - this.pupil.position.z) * 0.1;

                            // Occasional suspicious narrow (squint)
                            const squint = Math.sin(time * 2 + p.id) > 0.7 ? 0.7 : 1.0;
                            this.pupil.scale.y = squint;
                        }
                    }

                    // === RECON CROSSHAIRS GYRATION (runs in lobby) ===
                    if (this.isCrosshairs && this.crosshairsRing) {
                        this.crosshairsRing.rotation.x += dt * 0.8;
                        this.crosshairsRing.rotation.y += dt * 1.2;
                        this.crosshairsRing.rotation.z += dt * 0.5;
                    }

                    // === CONTROLLER TENTACLE ANIMATION (runs in lobby) ===
                    if (this.isDrippyDiamond && this.drips) {
                        const jellyTime = time;
                        this.drips.forEach(drip => {
                            const phase = drip.userData.phase;
                            drip.position.y = drip.userData.baseY + Math.sin(jellyTime * 2 + phase) * 3;
                        });
                    }

                    // === SKIRMISHER PETAL SPIN (runs in lobby) ===
                    if (this.isFlower && this.petalGroup) {
                        this.petalGroup.rotation.y += dt * 0.5;
                    }

                    // === LOBBY PARTICLE ANIMATION ===
                    // Particles orbit smoothly in lobby state
                    const lobbyTime = Date.now() * 0.001;
                    this.particles.forEach((particle, i) => {
                        const data = particle.userData;
                        data.angle += dt * data.speed * 0.5; // Slower in lobby

                        let x, y, z;
                        switch (this.classKey) {
                            case 'assault':
                                x = Math.cos(data.angle) * data.radius;
                                y = 15 + Math.sin(lobbyTime * 3 + i) * 8;
                                z = Math.sin(data.angle) * data.radius;
                                particle.material.opacity = 0.6;
                                break;
                            case 'support':
                                x = Math.cos(data.angle * 0.5) * data.radius;
                                y = 20 + Math.sin(lobbyTime + i) * 10;
                                z = Math.sin(data.angle * 0.5) * data.radius;
                                break;
                            case 'recon':
                                x = Math.cos(data.angle) * data.radius * 0.8;
                                y = 15 + Math.sin(lobbyTime * 2 + i) * 6;
                                z = Math.sin(data.angle) * data.radius * 0.8;

                                // GLOSSY BUBBLE ANIMATION with wobble and wet pops
                                if (data.isBubble) {
                                    // Bubble wobble (liquid jiggle)
                                    const wobble = Math.sin(lobbyTime * 8 + (data.wobblePhase || 0)) * 0.1;
                                    const baseScale = data.baseScale || 1;

                                    // Pop timer countdown
                                    data.popTimer -= dt;

                                    if (data.popTimer <= 0.3 && data.popTimer > 0) {
                                        // PRE-POP: Bubble swells up before bursting
                                        const swellPhase = 1 - (data.popTimer / 0.3);
                                        const swell = 1 + swellPhase * 0.5; // Grow up to 1.5x
                                        particle.scale.setScalar(baseScale * swell * (1 + wobble));
                                        particle.material.opacity = 0.6 - swellPhase * 0.15; // Stay more visible
                                    } else if (data.popTimer <= 0) {
                                        // WET POP: Rapid shrink with splash
                                        const popPhase = Math.min(1, -data.popTimer / 0.1);
                                        particle.scale.setScalar(baseScale * (1 - popPhase) * 1.5);
                                        particle.material.opacity = 0.7 * (1 - popPhase);

                                        // Reset after pop completes
                                        if (data.popTimer < -0.15) {
                                            data.popTimer = 0.8 + Math.random() * 1.2; // FASTER respawn
                                            particle.scale.setScalar(baseScale * 0.3);
                                            particle.material.opacity = 0.35; // Start more visible
                                        }
                                    } else {
                                        // Normal floating with wobble
                                        particle.scale.setScalar(baseScale * (1 + wobble));
                                        // Higher base opacity for visibility
                                        particle.material.opacity = 0.45 + Math.sin(lobbyTime * 2 + i) * 0.1;
                                    }
                                }
                                break;
                            case 'controller':
                                // FERROFLUID SLUDGE ANIMATION
                                x = Math.cos(data.angle) * data.radius;
                                y = data.yOffset + Math.sin(lobbyTime * 1.5 + i) * 5;
                                z = Math.sin(data.angle) * data.radius;

                                // Animate ferrofluid particles
                                if (data.isFerrofluid) {
                                    // Tumbling rotation
                                    particle.rotation.x += dt * (0.5 + Math.sin(i) * 0.3);
                                    particle.rotation.y += dt * (0.8 + Math.cos(i * 0.7) * 0.4);
                                    particle.rotation.z += dt * 0.3;

                                    // SLUDGE COLOR PULSING - shifts between dark and slightly brighter
                                    const sludgePulse = 0.5 + Math.sin(lobbyTime * 2 + (data.sludgePhase || 0)) * 0.5;
                                    const baseR = 0.1 + sludgePulse * 0.15;
                                    const baseG = 0.02 + sludgePulse * 0.05;
                                    const baseB = 0.2 + sludgePulse * 0.2;

                                    if (data.isSplit && data.half1 && data.half2) {
                                        // SPLIT PAIRS - orbit around each other magnetically
                                        data.orbitPhase += dt * data.orbitSpeed;

                                        // Pulsing orbit radius (coming together and apart)
                                        const pulseRadius = data.orbitRadius * (0.7 + Math.sin(lobbyTime * 2 + i) * 0.5);

                                        data.half1.position.x = Math.cos(data.orbitPhase) * pulseRadius;
                                        data.half1.position.z = Math.sin(data.orbitPhase) * pulseRadius;
                                        data.half2.position.x = Math.cos(data.orbitPhase + Math.PI) * pulseRadius;
                                        data.half2.position.z = Math.sin(data.orbitPhase + Math.PI) * pulseRadius;

                                        // Halves spin independently
                                        data.half1.rotation.y += dt * 2;
                                        data.half2.rotation.y -= dt * 1.5;

                                        // Apply sludge color to both halves
                                        if (data.mat1) data.mat1.color.setRGB(baseR, baseG, baseB);
                                        if (data.mat2) data.mat2.color.setRGB(baseR * 0.8, baseG * 0.8, baseB * 0.9);

                                        // FADE INTO SLUDGE when far apart (separated = fading)
                                        const separationFade = 1 - (pulseRadius / (data.orbitRadius * 1.2)) * 0.5;
                                        if (data.mat1) data.mat1.opacity = Math.max(0.3, separationFade);
                                        if (data.mat2) data.mat2.opacity = Math.max(0.3, separationFade);
                                    } else {
                                        // WHOLE BLOBS - pulsate in size (breathing)
                                        const breathe = 1 + Math.sin(lobbyTime * 3 + i * 0.5) * 0.4;
                                        particle.scale.setScalar(breathe);

                                        // GRAVITY - big blobs sink, small blobs rise
                                        const gravityOffset = (breathe - 1) * -15;
                                        y = data.yOffset + Math.sin(lobbyTime * 1.5 + i) * 3 + gravityOffset;

                                        // FADE INTO SLUDGE when big
                                        const fadeOpacity = 1.1 - breathe * 0.5;
                                        const clampedOpacity = Math.max(0.25, Math.min(0.95, fadeOpacity));

                                        // Apply sludge color and fade to the octahedron mesh
                                        const blob = particle.children[0];
                                        if (blob && blob.material) {
                                            blob.material.color.setRGB(baseR, baseG, baseB);
                                            blob.material.opacity = clampedOpacity;
                                        }
                                    }
                                }
                                break;
                            case 'skirmisher':
                                // UNIFIED SPEED TRAIL ANIMATION
                                // Fast spiraling orbit
                                data.angle += dt * data.speed * 1.5;
                                x = Math.cos(data.angle) * data.radius;
                                y = data.yOffset + Math.sin(lobbyTime * 3 + i) * 6;
                                z = Math.sin(data.angle) * data.radius;

                                // Orient streak toward direction of travel
                                particle.rotation.y = -data.angle + Math.PI / 2;

                                // Speed-based color shift (green → yellow)
                                if (data.isSpeedStreak && data.baseMat) {
                                    // Calculate speed factor (0-1 based on orbit speed and time variance)
                                    const speedFactor = 0.5 + Math.sin(lobbyTime * 4 + i * 0.7) * 0.5;

                                    // Interpolate: Green (0.27, 0.87, 0.4) → Yellow (1.0, 0.87, 0.27)
                                    const r = 0.27 + speedFactor * 0.73; // 0.27 → 1.0
                                    const g = 0.87; // stays constant
                                    const b = 0.4 - speedFactor * 0.13; // 0.4 → 0.27

                                    data.baseMat.color.setRGB(r, g, b);
                                    if (data.trailMat) {
                                        data.trailMat.color.setRGB(r * 0.8, g * 0.9, b * 0.7);
                                    }

                                    // Stretch based on speed
                                    const stretch = 1 + speedFactor * 0.5;
                                    particle.scale.y = stretch;
                                }
                                break;
                            default:
                                x = Math.cos(data.angle) * data.radius;
                                y = data.yOffset;
                                z = Math.sin(data.angle) * data.radius;
                        }
                        particle.position.set(x, y, z);
                    });
                }

                // === SHADOW POSITION UPDATE (runs in ALL states including lobby) ===
                // This ensures shadows follow players during seating instead of piling up at center
                if (this.shadow) {
                    this.shadow.position.x = p.x;
                    this.shadow.position.z = p.y;
                    this.shadow.visible = p.alive;
                }

                // === GAMEPLAY (not lobby) ===
                if (gameState !== 'lobby') {
                    const hpPct = p.hp / p.maxHp;
                    this.coreLight.intensity = 0.3 + hpPct * 0.7;
                    this.core.material.opacity = 0.4 + hpPct * 0.6;
                    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                    this.shell.scale.setScalar(1.0 + Math.sin(Date.now() * 0.01) * 0.02);

                    // GROW BASED ON ELIMINATIONS - dramatic scaling at 2x combat rate
                    // From 1.0 (start) to 2.2 (everyone but winner eliminated)
                    let baseScale = getGrowthScale();

                    // === LOBBY→GAME SCALE TRANSITION (during prep phase) ===
                    // Animate from LOBBY_SCALE (0.5) to full game scale over prep phase
                    // scaleTransitionProgress: 0 = still lobby size, 1 = full game size
                    const transitionScale = LOBBY_SCALE + (1 - LOBBY_SCALE) * scaleTransitionProgress;
                    baseScale *= transitionScale;

                    // === REGENERATION SHRINK-GROW ANIMATION ===
                    if (p.regenScaleTimer > 0) {
                        p.regenScaleTimer -= dt;
                        // First half: shrink to 10%, second half: grow back to full
                        const progress = 1 - (p.regenScaleTimer / 0.8);
                        if (progress < 0.5) {
                            // Shrinking phase: 1.0 → 0.1
                            baseScale *= 1.0 - (progress * 2) * 0.9;
                        } else {
                            // Growing phase: 0.1 → 1.0
                            baseScale *= 0.1 + ((progress - 0.5) * 2) * 0.9;
                        }
                    }
                    this.group.scale.setScalar(baseScale);

                    // === SEISMIC BURST ANIMATION ===
                    if (this.seismicBurstTimer > 0) {
                        this.seismicBurstTimer -= dt;

                        // Create expanding ring if not yet created
                        if (!this.seismicRing) {
                            const ringGeo = new THREE.RingGeometry(10, 15, 32);
                            const ringMat = new THREE.MeshBasicMaterial({
                                color: 0xff4500, // Blood orange
                                side: THREE.DoubleSide,
                                transparent: true,
                                opacity: 0.3
                            });
                            this.seismicRing = new THREE.Mesh(ringGeo, ringMat);
                            this.seismicRing.rotation.x = -Math.PI / 2;
                            this.seismicRing.position.y = PLATFORM_HEIGHT + 3; // Above shadows (shadows at +1)
                            scene.add(this.seismicRing);
                        }

                        // Expand and fade
                        const progress = 1 - (this.seismicBurstTimer / 0.5);
                        const ringScale = 1 + progress * 8; // Expand to 9x
                        this.seismicRing.scale.setScalar(ringScale);
                        this.seismicRing.material.opacity = 0.3 * (1 - progress); // Fade from 30% to 0%
                        this.seismicRing.position.x = p.x;
                        this.seismicRing.position.z = p.y;

                        // Remove when done
                        if (this.seismicBurstTimer <= 0 && this.seismicRing) {
                            scene.remove(this.seismicRing);
                            this.seismicRing = null;
                        }
                    }

                    // === SHAKE ANIMATION (from being hit by seismic burst) ===
                    if (this.shakeTimer > 0) {
                        this.shakeTimer -= dt;
                        const shakeIntensity = this.shakeTimer * 20;
                        this.group.position.x += (Math.random() - 0.5) * shakeIntensity;
                        this.group.position.z += (Math.random() - 0.5) * shakeIntensity;
                    }

                    // Trail streaks - DISABLED per user request
                    if (this.trailPoints && this.trail) {
                        if (this.trailPoints.length < 40) {
                            this.trailPoints.unshift(new THREE.Vector3(p.x, PLATFORM_HEIGHT + 15, p.y));
                        } else {
                            // Recycle the oldest point
                            const recycled = this.trailPoints.pop();
                            recycled.set(p.x, PLATFORM_HEIGHT + 15, p.y);
                            this.trailPoints.unshift(recycled);
                        }
                        // Trail length scales with speed: 10 at slow, 40 at fast
                        const trailLength = speed > 100 ? 40 : (speed > 50 ? 25 : 10);
                        while (this.trailPoints.length > trailLength) this.trailPoints.pop();
                        this.trailGeometry.setFromPoints(this.trailPoints);
                        // Opacity and width scale with speed
                        const speedIntensity = Math.min(1, speed / 200);
                        this.trail.material.opacity = 0.2 + speedIntensity * 0.6; // 0.2 to 0.8
                        this.trail.material.linewidth = 1 + speedIntensity * 3; // Thicker at speed
                    }

                    // Shadow stays on platform, scales with height
                    if (this.shadow) {
                        this.shadow.position.x = p.x;
                        this.shadow.position.z = p.y;
                        this.shadow.rotation.z += dt * 0.5;

                        // Update shadow color when team composition is assigned
                        if (p.teamBlendedColor && !this.shadowColorSet) {
                            this.shadow.material.color.setHex(p.teamBlendedColor);
                            this.shadowColorSet = true;
                        }

                        // Scale shadow based on height - smaller when higher
                        const height = verticalOffset || 0;
                        const heightScale = Math.max(0.3, 1 - height / 150); // 1.0 at ground, 0.3 at max height
                        this.shadow.scale.setScalar(heightScale * getGrowthScale());

                        // Hide shadow when dead OR outside the ring (soul orbs represent respawn)
                        const shadowDist = Math.sqrt(p.x * p.x + p.y * p.y);
                        const insideRing = shadowDist < currentRingRadius;
                        const showShadow = p.alive && insideRing;
                        this.shadow.visible = showShadow;
                        this.shadow.material.opacity = showShadow ? (0.3 * heightScale) : 0;
                    }

                    // Gentle heart pulse for Support class
                    if (this.isHeart) {
                        const time = Date.now() * 0.001;
                        // Gentle heartbeat pulse - subtle size oscillation
                        const pulse = 1 + Math.sin(time * 2) * 0.05 + Math.sin(time * 4) * 0.02;
                        this.shell.scale.setScalar(pulse);

                        // Gentle vertical bob
                        this.shell.position.y = Math.sin(time * 1.5) * 1.5;

                        // Slow clockwise rotation (matches lobby)
                        this.shell.rotation.y -= dt * 0.3;
                    }

                    // Rotating crosshairs for Recon class
                    if (this.isCrosshairs && this.crosshairsRing) {
                        // GYROSCOPE - responds to movement like a gimbal
                        const time = Date.now() * 0.001;

                        // Movement direction affects tilt
                        const forwardSpeed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                        const maxTilt = 0.4; // Max tilt angle in radians

                        // Moving forward: front tilts down
                        // Moving backward/slowing: front tilts up
                        const targetTiltX = -(forwardSpeed / 300) * maxTilt; // Negative = front down

                        // Smooth interpolation to target tilt
                        if (!this.gyroTiltX) this.gyroTiltX = 0;
                        this.gyroTiltX += (targetTiltX - this.gyroTiltX) * dt * 3;

                        // Alternating spin direction every 10 seconds
                        const cyclePhase = Math.floor(time / 10) % 2;
                        const spinDir = cyclePhase === 0 ? 1 : -1;

                        // Apply gyroscope rotations
                        this.crosshairsRing.rotation.x = this.gyroTiltX; // Tilt based on movement
                        this.crosshairsRing.rotation.y += dt * 1.2 * spinDir; // Alternating horizontal spin
                        this.crosshairsRing.rotation.z += dt * 0.3 * spinDir; // Subtle roll
                    }

                    // Tornado spin for Assault class - ENTIRE shell spins (cone + spiral together)
                    if (this.isInvertedCone) {
                        this.shell.rotation.y -= dt * 2.5; // Fast aggressive CLOCKWISE tornado spin
                    }

                    // Rotate petals for Skirmisher flower class
                    if (this.isFlower && this.petalGroup) {
                        // Spin faster when moving faster (base spin + speed-based spin)
                        const speedFactor = Math.min(speed / 150, 1); // 0-1 based on speed
                        const spinSpeed = 0.3 + speedFactor * 2.0; // 0.3 to 2.3 rad/s
                        this.petalGroup.rotation.y += dt * spinSpeed;

                        // REGENERATION ANIMATION: Petals stand up one by one, then fall back
                        if (p.regenScaleTimer > 0 && this.petalGroup.children) {
                            const totalTime = 0.8;
                            const progress = 1 - (p.regenScaleTimer / totalTime);
                            const petalCount = this.petalGroup.children.length;

                            this.petalGroup.children.forEach((petal, i) => {
                                if (!petal.rotation) return;

                                // Each petal stands up at different time (staggered)
                                const petalStartTime = (i / petalCount) * 0.5; // 0 to 0.5
                                const petalProgress = Math.max(0, (progress - petalStartTime) / 0.3);

                                if (progress < 0.7) {
                                    // Standing up phase: rotate toward vertical
                                    const targetAngle = 0; // Upright
                                    const baseAngle = -Math.PI / 6; // Normal tilted down
                                    petal.rotation.x = baseAngle + (targetAngle - baseAngle) * Math.min(1, petalProgress);
                                } else {
                                    // Fall back phase: all petals return to normal
                                    const fallProgress = (progress - 0.7) / 0.3;
                                    const baseAngle = -Math.PI / 6;
                                    petal.rotation.x = baseAngle * fallProgress;
                                }
                            });
                        } else if (p.regenerated && this.petalGroup.children) {
                            // After regeneration complete, keep petals slightly elevated
                            this.petalGroup.children.forEach(petal => {
                                if (petal.rotation) {
                                    petal.rotation.x += ((-Math.PI / 12) - petal.rotation.x) * dt * 2;
                                }
                            });
                        }

                        // Subtle breathing effect on petals
                        const breathe = 1 + Math.sin(Date.now() * 0.002) * 0.05;
                        this.petalGroup.scale.setScalar(breathe);
                    }

                    // Controller drippy diamond animation
                    if (this.isDrippyDiamond) {
                        const time = Date.now() * 0.001;

                        // Slow rotation of the diamond core
                        if (this.diamondCore) {
                            this.diamondCore.rotation.y += dt * 0.5;
                            this.diamondCore.rotation.x = Math.sin(time * 0.5) * 0.15;
                        }

                        // Animate drips - wobble and bob independently
                        if (this.drips) {
                            this.drips.forEach(drip => {
                                const phase = drip.userData.phase;
                                const speed = drip.userData.speed;
                                // Vertical bobbing
                                drip.position.y = drip.userData.baseY + Math.sin(time * speed + phase) * 3;
                                // Stretchy effect
                                const stretch = 1 + Math.sin(time * speed * 0.7 + phase) * 0.2;
                                drip.scale.y = (1.5 + Math.random() * 0.3) * stretch;
                            });
                        }

                        // Main drip grows and shrinks
                        if (this.mainDrip) {
                            const dripPulse = 1 + Math.sin(time * 3) * 0.15;
                            this.mainDrip.scale.set(1, dripPulse, 1);
                        }

                        // Tentacles hanging from underside of dome
                        if (!this.tendrils) {
                            this.tendrils = [];
                            const tentacleCount = 6;
                            for (let i = 0; i < tentacleCount; i++) {
                                const tendril = new THREE.Mesh(
                                    new THREE.ConeGeometry(3, 25, 5),
                                    new THREE.MeshPhongMaterial({
                                        color: 0x220033,
                                        emissive: 0x110022,
                                        emissiveIntensity: 0.4,
                                        transparent: true,
                                        opacity: 0.9
                                    })
                                );
                                tendril.userData.phase = (i / tentacleCount) * Math.PI * 2;
                                tendril.userData.baseAngle = (i / tentacleCount) * Math.PI * 2;
                                this.shell.add(tendril); // Attach to shell, not group
                                this.tendrils.push(tendril);
                            }
                        }

                        // Animate tentacles - hang from dome edge, gentle sway
                        const domeRadius = this.sizes.shell * 0.55; // Match dome edge
                        this.tendrils.forEach((tendril, i) => {
                            const phase = time * 1.2 + tendril.userData.phase;
                            const sway = Math.sin(phase) * 0.15; // Gentle sway
                            const angle = tendril.userData.baseAngle;

                            // Position at edge of dome, underneath
                            tendril.position.x = Math.cos(angle) * domeRadius;
                            tendril.position.z = Math.sin(angle) * domeRadius;
                            tendril.position.y = -this.sizes.shell * 0.1; // Just below dome

                            // Point downward with slight outward angle and sway
                            tendril.rotation.x = Math.PI + sway; // Hang down
                            tendril.rotation.z = 0.2; // Slight outward lean
                            tendril.rotation.y = angle;
                        });

                        // Parry effect - flash dome emissive when reacting
                        if (p.parryFlashTimer && p.parryFlashTimer > 0) {
                            if (this.diamondCore && this.diamondCore.material) {
                                this.diamondCore.material.emissiveIntensity = 0.8;
                                this.diamondCore.material.emissive.setHex(0x9933ff);
                            }
                            this.tendrils.forEach(t => {
                                t.material.emissiveIntensity = 0.8;
                            });
                        } else {
                            if (this.diamondCore && this.diamondCore.material) {
                                this.diamondCore.material.emissiveIntensity = 0.3;
                                this.diamondCore.material.emissive.setHex(0x110022);
                            }
                            this.tendrils.forEach(t => {
                                t.material.emissiveIntensity = 0.4;
                            });
                        }

                        // === SLUDGE TRAIL - drops when moving, crawls back 3x faster ===
                        if (!this.sludgeDrops) {
                            this.sludgeDrops = [];
                            this.sludgeDropTimer = 0;
                            this.sludgeSizeIndex = 0; // Rotate through sizes
                        }

                        // Drop sludge when moving - 3 different sizes (MAX 30 drops)
                        this.sludgeDropTimer -= dt;
                        if (speed > 30 && this.sludgeDropTimer <= 0 && this.sludgeDrops.length < 30) {
                            // Rotate through sizes: 0=small, 1=medium, 2=large
                            const sizeType = this.sludgeSizeIndex % 3;
                            this.sludgeSizeIndex++;

                            // Size-based properties (OPTIMIZED - slower spawn rates)
                            let dropSize, dropInterval, waitTime, crawlSpeed;
                            if (sizeType === 0) {
                                // SMALL: slower spawn, slow retract
                                dropSize = 3;
                                dropInterval = 0.15; // Slower (was 0.05)
                                waitTime = 0.8 + Math.random() * 0.4;
                                crawlSpeed = 120;
                            } else if (sizeType === 1) {
                                // MEDIUM
                                dropSize = 5;
                                dropInterval = 0.2;
                                waitTime = 0.5 + Math.random() * 0.3;
                                crawlSpeed = 160;
                            } else {
                                // LARGE: slow spawn, fast retract
                                dropSize = 8;
                                dropInterval = 0.25;
                                waitTime = 0.3 + Math.random() * 0.2;
                                crawlSpeed = 200;
                            }

                            this.sludgeDropTimer = dropInterval;

                            // BLOTCHY PATTERN - spawn 1-2 drops (reduced from 1-3)
                            const clusterCount = sizeType === 0 ? Math.ceil(Math.random() * 2) : 1;

                            for (let c = 0; c < clusterCount; c++) {
                                // Random offset for blotchy distribution
                                const offsetX = (Math.random() - 0.5) * 20;
                                const offsetZ = (Math.random() - 0.5) * 20;

                                // Irregular blob shape - random scale axes
                                const scaleX = 0.7 + Math.random() * 0.6;
                                const scaleZ = 0.7 + Math.random() * 0.6;

                                const drop = new THREE.Mesh(
                                    new THREE.SphereGeometry(dropSize * (0.8 + Math.random() * 0.4), 8, 8),
                                    new THREE.MeshPhongMaterial({
                                        color: 0x1a0520,
                                        emissive: 0x0a0210,
                                        transparent: true,
                                        opacity: 0.6 + Math.random() * 0.3
                                    })
                                );
                                drop.scale.set(scaleX, 0.2 + Math.random() * 0.2, scaleZ); // Irregular flat puddle
                                drop.position.set(p.x + offsetX, PLATFORM_HEIGHT + 10, p.y + offsetZ);
                                drop.rotation.y = Math.random() * Math.PI * 2; // Random rotation
                                drop.userData.startX = p.x + offsetX;
                                drop.userData.startY = p.y + offsetZ;
                                drop.userData.age = Math.random() * 0.1; // Slight age offset for variety
                                drop.userData.returning = false;
                                drop.userData.waitTime = waitTime * (0.8 + Math.random() * 0.4);
                                drop.userData.crawlSpeed = crawlSpeed * (0.9 + Math.random() * 0.2);
                                drop.userData.sizeType = sizeType;
                                scene.add(drop);
                                this.sludgeDrops.push(drop);
                            }
                        }

                        // Animate sludge drops - size affects crawl speed
                        for (let i = this.sludgeDrops.length - 1; i >= 0; i--) {
                            const drop = this.sludgeDrops[i];
                            drop.userData.age += dt;

                            if (drop.userData.age > drop.userData.waitTime) {
                                drop.userData.returning = true;
                            }

                            if (drop.userData.returning) {
                                // Crawl toward Controller - speed based on size
                                const dx = p.x - drop.position.x;
                                const dz = p.y - drop.position.z;
                                const dist = Math.sqrt(dx * dx + dz * dz);

                                if (dist > 10) {
                                    // Size-based crawl speed
                                    const crawlSpeed = drop.userData.crawlSpeed || 180;
                                    drop.position.x += (dx / dist) * crawlSpeed * dt;
                                    drop.position.z += (dz / dist) * crawlSpeed * dt;

                                    // Stretch toward target as it moves
                                    const angle = Math.atan2(dz, dx);
                                    drop.rotation.y = angle;
                                    drop.scale.x = 1 + Math.min(dist / 50, 1) * 0.5;
                                } else {
                                    // Fade out when close
                                    drop.material.opacity -= dt * 4;
                                    if (drop.material.opacity <= 0) {
                                        scene.remove(drop);
                                        this.sludgeDrops.splice(i, 1);
                                    }
                                }
                            } else {
                                // Puddle pulses while waiting
                                drop.scale.y = 0.3 + Math.sin(drop.userData.age * 5) * 0.1;
                            }

                            // === SNAG: Enemies touching sludge get slowed (1 per enemy per Controller) ===
                            if (drop.material.opacity > 0.3) {
                                // Initialize snag tracking for this Controller
                                if (!p.snaggedEnemies) p.snaggedEnemies = new Set();

                                players.filter(enemy => enemy.alive && enemy.team !== p.team).forEach(enemy => {
                                    // Skip if already snagged by this Controller
                                    if (p.snaggedEnemies.has(enemy.id)) return;

                                    const ex = enemy.x - drop.position.x;
                                    const ez = enemy.y - drop.position.z;
                                    const eDist = Math.sqrt(ex * ex + ez * ez);

                                    if (eDist < 20 && (!enemy.snagTimer || enemy.snagTimer <= 0)) {
                                        // SNAGGED!
                                        enemy.snagTimer = 0.8; // 0.8 second snag
                                        enemy.vx *= 0.3; // Major slow
                                        enemy.vy *= 0.3;
                                        addLog(`🕸️ ${enemy.username} SNAGGED by ${p.username}'s sludge!`, 'kill');

                                        // Mark enemy as snagged by this Controller (1 per enemy)
                                        p.snaggedEnemies.add(enemy.id);

                                        // Consume the sludge
                                        drop.material.opacity = 0.2;
                                    }
                                });
                            }
                        }

                        // Limit max sludge drops (with proper disposal)
                        while (this.sludgeDrops.length > 15) {
                            const old = this.sludgeDrops.shift();
                            scene.remove(old);
                            if (old.geometry) old.geometry.dispose();
                            if (old.material) old.material.dispose();
                        }
                    }

                    // === ELEMENTAL PARTICLE ANIMATION ===
                    const time = Date.now() * 0.001;
                    this.particles.forEach((particle, i) => {
                        const data = particle.userData;
                        data.angle += dt * data.speed;

                        // Class-specific movement patterns
                        let x, y, z;
                        switch (this.classKey) {
                            case 'assault':
                                // Fire rises and flickers
                                x = Math.cos(data.angle) * data.radius * 0.8;
                                y = data.yOffset + Math.sin(time * 5 + i) * 10 + 15;
                                z = Math.sin(data.angle) * data.radius * 0.8;
                                particle.material.opacity = 0.5 + Math.sin(time * 10 + i) * 0.3;
                                break;
                            case 'support':
                                // Spirits orbit gently higher
                                x = Math.cos(data.angle * 0.5) * data.radius;
                                y = 20 + Math.sin(time + i) * 15;
                                z = Math.sin(data.angle * 0.5) * data.radius;
                                break;
                            case 'recon':
                                // BUBBLES - float up and pop
                                x = Math.cos(data.angle * 1.5) * data.radius * 0.7;
                                y = data.yOffset + 10 + Math.sin(time * 2 + i) * 8;
                                z = Math.sin(data.angle * 1.5) * data.radius * 0.7;

                                // Bubble pop animation
                                if (data.isBubble) {
                                    data.popTimer -= dt;
                                    if (data.popTimer <= 0) {
                                        // Pop! Shrink rapidly then respawn
                                        particle.scale.setScalar(0.1);
                                        data.popTimer = 2 + Math.random() * 2; // Reset timer
                                        data.angle = Math.random() * Math.PI * 2; // New position
                                    } else if (data.popTimer < 0.2) {
                                        // Shrinking phase
                                        particle.scale.setScalar(data.popTimer / 0.2);
                                    } else {
                                        // Normal size, gentle pulse
                                        particle.scale.setScalar(1 + Math.sin(time * 3 + i) * 0.1);
                                    }
                                }
                                break;
                            case 'controller':
                                // Corruption drips down like thick tar
                                const dripPhase = (time * 2 + i * 0.5) % 3;
                                const drip = dripPhase < 1 ? dripPhase * 15 : Math.max(0, 15 - (dripPhase - 1) * 20);
                                x = Math.cos(data.angle + Math.sin(time) * 0.3) * data.radius * 0.9;
                                y = data.yOffset - drip; // Drips down
                                z = Math.sin(data.angle + Math.sin(time) * 0.3) * data.radius * 0.9;
                                particle.scale.setScalar(0.8 + drip * 0.05); // Grows as it drips
                                break;
                            case 'skirmisher':
                                // Vines trail behind movement
                                const trail = speed * 0.02;
                                x = Math.cos(data.angle) * data.radius - p.vx * 0.05;
                                y = data.yOffset + Math.sin(time * 2 + i) * 5;
                                z = Math.sin(data.angle) * data.radius - p.vy * 0.05;
                                break;
                            default:
                                x = Math.cos(data.angle) * data.radius;
                                y = data.yOffset;
                                z = Math.sin(data.angle) * data.radius;
                        }
                        particle.position.set(x, y, z);
                    });

                    // === EYE ANIMATIONS ===
                    // Eyes look at enemies when fighting, away when fleeing
                    if (this.eyeGroup && this.eyePupil) {
                        const target = p.currentTarget;
                        const isCautious = p.cautiousMode || (p.hp / p.maxHp < 0.3);

                        if (target && target.alive) {
                            const dx = target.x - p.x;
                            const dy = target.y - p.y;
                            const angleToTarget = Math.atan2(dy, dx);

                            if (isCautious) {
                                // FLEEING - look AWAY from target (opposite direction)
                                this.eyeGroup.rotation.z = -(angleToTarget + Math.PI);
                                this.eyePupil.position.x = this.eyeRadius * 0.3; // Looking away
                            } else {
                                // FIGHTING - look AT target
                                this.eyeGroup.rotation.z = -angleToTarget;
                                this.eyePupil.position.x = this.eyeRadius * 0.3; // Looking at
                            }
                        } else {
                            // No target - look in movement direction
                            if (speed > 30) {
                                const moveAngle = Math.atan2(p.vy, p.vx);
                                this.eyeGroup.rotation.z = -moveAngle;
                                this.eyePupil.position.x = this.eyeRadius * 0.2;
                            } else {
                                // Idle - pupil centered with slight wander
                                this.eyePupil.position.x = Math.sin(Date.now() * 0.001 + p.id) * 2;
                                this.eyePupil.position.y = Math.cos(Date.now() * 0.0015 + p.id) * 2;
                            }
                        }
                    }
                    // Clear status effects (properly dispose to prevent WebGL leak)
                    while (this.statusGroup.children.length > 0) {
                        const child = this.statusGroup.children[0];
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) child.material.dispose();
                        this.statusGroup.remove(child);
                    }
                    // Berserk (Assault < 40%) - only for mesh shells, not groups
                    if (!this.isPlusShape && !this.isCrosshairs && this.shell.material) {
                        if (p.classKey === 'assault' && hpPct < 0.4) {
                            this.shell.material.emissive.setHex(0xff3300);
                            this.shell.material.emissiveIntensity = 0.5 + Math.sin(Date.now() * 0.02) * 0.3;
                        } else if (p.classKey !== 'controller') {
                            // Don't reset Controller's emissive (handled by parry)
                            this.shell.material.emissive.setHex(0x000000);
                            this.shell.material.emissiveIntensity = 0;
                        }
                    }

                    // Controller parry animation handled in isDrippyDiamond section (emissive flash)
                    // Execute window
                    if (hpPct < 0.25) {
                        this.core.material.color.setHex(0xff5050);
                        this.core.material.opacity = Math.random() > 0.9 ? 0.3 : 0.9;
                        // Show execute halo (create ONCE, then reuse)
                        if (!this.executeHalo) {
                            const haloSize = this.sizes.shell * 1.4;
                            this.executeHalo = new THREE.Mesh(
                                new THREE.RingGeometry(haloSize, haloSize + 3, 32),
                                new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
                            );
                            this.executeHalo.rotation.x = -Math.PI / 2;
                            this.group.add(this.executeHalo); // Add to group, not statusGroup (statusGroup is cleared each frame)
                        }
                        this.executeHalo.visible = true;
                    } else {
                        this.core.material.color.setHex(0xffffff);
                        if (this.executeHalo) this.executeHalo.visible = false;
                    }
                    // Momentum now shown by trail streaks (no ring needed)
                    // Bleed visual - drops blood on floor (shell keeps team color)
                    if (p.bleedTimer > 0) {
                        // Track bleed drop timer
                        if (!this.bleedDropTimer) this.bleedDropTimer = 0;
                        this.bleedDropTimer -= dt;
                        if (this.bleedDropTimer <= 0) {
                            createBloodDrop(p.x, p.y);
                            this.bleedDropTimer = BLOOD_DROP_INTERVAL;
                        }
                    } else {
                        this.bleedDropTimer = 0;
                    }

                    // Controller Parry visual - simplified to shell glow instead of per-frame geometry
                    // (Creating new geometry every frame was causing major stutters)
                    if (p.classKey === 'controller' && p.parryTargets && this.shell.material) {
                        const activeCount = Object.values(p.parryTargets).filter(v => v).length;
                        if (activeCount > 0) {
                            // Pulse intensity based on number of parries available
                            const pulse = 0.2 + (activeCount * 0.1) + Math.sin(Date.now() * 0.005) * 0.1;
                            this.shell.material.emissive.setHex(0x9933ff);
                            this.shell.material.emissiveIntensity = pulse;
                        }
                    }

                    // Second Chance Used - Golden Halo above head (cached, not recreated each frame)
                    if (p.classKey === 'support' && !p.hasSecondChance) {
                        if (!this.halo) {
                            // Create halo ONCE
                            const haloRadius = this.sizes.shell * 0.8;
                            this.halo = new THREE.Mesh(
                                new THREE.TorusGeometry(haloRadius, 2, 6, 16), // Simpler geometry
                                new THREE.MeshBasicMaterial({
                                    color: 0xffd700,
                                    transparent: true,
                                    opacity: 0.7
                                })
                            );
                            this.halo.rotation.x = Math.PI / 2;
                            this.halo.position.y = this.sizes.shell * 1.5;
                            this.group.add(this.halo);
                        }
                        // Just update opacity for pulse
                        this.halo.material.opacity = 0.7 + Math.sin(Date.now() * 0.005) * 0.2;
                    }
                } // End of gameplay section (gameState !== 'lobby')
            }
            destroy() {
                // Recursively dispose all geometry and materials in the group
                const disposeObject = (obj) => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) {
                        if (Array.isArray(obj.material)) {
                            obj.material.forEach(m => m.dispose());
                        } else {
                            obj.material.dispose();
                        }
                    }
                    if (obj.children) {
                        obj.children.forEach(child => disposeObject(child));
                    }
                };

                disposeObject(this.group);
                scene.remove(this.group);

                if (this.trail) {
                    disposeObject(this.trail);
                    scene.remove(this.trail);
                }
                if (this.shadow) {
                    disposeObject(this.shadow);
                    scene.remove(this.shadow);
                }
                if (this.seismicRing) {
                    disposeObject(this.seismicRing);
                    scene.remove(this.seismicRing);
                }
                // Clean up controller sludge drops
                if (this.sludgeDrops) {
                    this.sludgeDrops.forEach(drop => {
                        disposeObject(drop);
                        scene.remove(drop);
                    });
                    this.sludgeDrops.length = 0;
                }
                // Clean up particles
                if (this.particles) {
                    this.particles.forEach(p => {
                        disposeObject(p);
                    });
                    this.particles.length = 0;
                }
                // Clean up controller tendrils (created dynamically in update)
                if (this.tendrils) {
                    this.tendrils.forEach(t => {
                        disposeObject(t);
                    });
                    this.tendrils.length = 0;
                }
                // Clean up execute halo (cached geometry)
                if (this.executeHalo) {
                    disposeObject(this.executeHalo);
                    this.group.remove(this.executeHalo);
                }
                // Clean up support halo
                if (this.halo) {
                    disposeObject(this.halo);
                    this.group.remove(this.halo);
                }
            }
        }

        // === PROJECTILE CLASS ===
        class Projectile3D {
            constructor(proj) {
                this.data = proj;
                // Use composition-based team color
                const teamColor = proj.attacker.teamBlendedColor || TEAM_COLORS_HEX[proj.attacker.team - 1];
                this.mesh = new THREE.Mesh(new THREE.SphereGeometry(5, 8, 8), new THREE.MeshBasicMaterial({ color: teamColor, transparent: true, opacity: 0.9 }));
                this.trailPoints = [];
                this.trailGeometry = new THREE.BufferGeometry();
                this.trail = new THREE.Line(this.trailGeometry, new THREE.LineBasicMaterial({ color: teamColor, transparent: true, opacity: 0.6 }));
                scene.add(this.mesh);
                scene.add(this.trail);
            }
            update() {
                this.mesh.position.set(this.data.x, PLATFORM_HEIGHT + 25, this.data.y);
                // Recycle Vector3 instead of creating new ones each frame
                if (this.trailPoints.length < 10) {
                    this.trailPoints.unshift(new THREE.Vector3(this.data.x, PLATFORM_HEIGHT + 25, this.data.y));
                } else {
                    const recycled = this.trailPoints.pop();
                    recycled.set(this.data.x, PLATFORM_HEIGHT + 25, this.data.y);
                    this.trailPoints.unshift(recycled);
                }
                this.trailGeometry.setFromPoints(this.trailPoints);
            }
            destroy() {
                scene.remove(this.mesh);
                scene.remove(this.trail);
                if (this.mesh.geometry) this.mesh.geometry.dispose();
                if (this.mesh.material) this.mesh.material.dispose();
                if (this.trailGeometry) this.trailGeometry.dispose();
                if (this.trail.material) this.trail.material.dispose();
            }
        }

        // === UTILITY FUNCTIONS ===
        function dist(a, b) { return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2); }

        // Floating damage numbers above/between players
        function spawnDamageNumber(target, damage, attacker, isMelee = false, isKick = false) {
            const targetOrb = orbs.find(o => o.player === target);
            const attackerOrb = orbs.find(o => o.player === attacker);
            if (!targetOrb) return;

            // Calculate position based on hit type
            let pos;
            if (isMelee && attackerOrb) {
                // MELEE: Position between attacker and target (at collision point)
                const midX = (targetOrb.group.position.x + attackerOrb.group.position.x) / 2;
                const midY = (targetOrb.group.position.y + attackerOrb.group.position.y) / 2 + 40;
                const midZ = (targetOrb.group.position.z + attackerOrb.group.position.z) / 2;
                pos = new THREE.Vector3(midX, midY, midZ);
            } else {
                // RANGED: Position above the target
                pos = targetOrb.group.position.clone();
                pos.y += 60; // Higher above for ranged hits
            }

            // Add slight random offset to prevent stacking
            pos.x += (Math.random() - 0.5) * 20;
            pos.z += (Math.random() - 0.5) * 20;

            pos.project(camera);

            const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
            const y = (1 - (pos.y * 0.5 + 0.5)) * window.innerHeight;

            // Create the DOM element
            const dmgEl = document.createElement('div');
            dmgEl.className = 'damage-number' + (isMelee ? ' melee' : '');
            // Every 3rd melee is a kick!
            dmgEl.textContent = isMelee ? (isKick ? '🦵' : '👊') : Math.round(damage);

            // Attacker's class color for text, team color for border (composition-based)
            const attackerColor = attacker.config.color || '#ff6b6b';
            const teamColorHex = attacker.teamBlendedColor || TEAM_COLORS_HEX[attacker.team - 1];
            const teamColor = '#' + teamColorHex.toString(16).padStart(6, '0');

            // Check if class color matches team color exactly (e.g., purple Controller on purple Team 3)
            const colorsSimilar = attackerColor.toLowerCase() === teamColor.toLowerCase();

            if (colorsSimilar) {
                // Black text with colored outline for readability
                dmgEl.style.color = '#000000';
                dmgEl.style.setProperty('--border-color', attackerColor);
                dmgEl.style.textShadow = `0 0 4px ${attackerColor}, 0 0 8px ${attackerColor}`;
            } else {
                dmgEl.style.color = attackerColor;
                dmgEl.style.setProperty('--border-color', teamColor);
            }
            dmgEl.style.left = x + 'px';
            dmgEl.style.top = y + 'px';

            document.body.appendChild(dmgEl);

            // Remove after animation
            setTimeout(() => dmgEl.remove(), 1200);
        }

        // Combat feed - only 3 entries visible with fade effect
        function addLog(text, type = 'kill') {
            // Only log eliminations, resurrections, and special events
            if (type !== 'kill' && type !== 'heal') return;

            logEntries.unshift({ text, type, time: Date.now() });
            if (logEntries.length > 3) logEntries.pop(); // Only keep 3

            // Render with opacity fade (newest=100%, middle=70%, oldest=40%)
            const opacities = [1, 0.7, 0.4];
            document.getElementById('feedContent').innerHTML = logEntries.map((l, i) =>
                `<div class="feed-entry ${l.type}" style="opacity: ${opacities[i] || 0.4}">${l.text}</div>`
            ).join('');
        }

        // === AI: PENTAGRAM TARGET SELECTION ===
        function selectTarget(p, enemies) {
            if (enemies.length === 0) return null;
            const counters = COUNTERS[p.classKey].counters;
            const counteredBy = COUNTERS[p.classKey].counteredBy;

            // Blood frenzy: prioritize low HP enemies (<35%)
            const bloodTargets = enemies.filter(e => e.hp / e.maxHp < 0.35);

            // Tier 1: Counter targets at low HP (execute priority)
            const counterBlood = bloodTargets.filter(e => counters.includes(e.classKey));
            if (counterBlood.length > 0) return counterBlood.reduce((a, b) => a.hp < b.hp ? a : b);

            // Tier 2: Any bleeding/weakened enemies
            if (bloodTargets.length > 0) {
                // Prefer ones we counter
                const preferred = bloodTargets.filter(e => counters.includes(e.classKey));
                if (preferred.length > 0) return preferred[0];
                // Avoid ones that counter us unless desperate
                const safe = bloodTargets.filter(e => !counteredBy.includes(e.classKey));
                if (safe.length > 0) return safe.reduce((a, b) => a.hp < b.hp ? a : b);
                return bloodTargets[0];
            }

            // Tier 3: Counter targets (primary focus)
            const counterTargets = enemies.filter(e => counters.includes(e.classKey));
            if (counterTargets.length > 0) {
                // Prefer closer ones
                return counterTargets.reduce((a, b) => dist(p, a) < dist(p, b) ? a : b);
            }

            // Tier 4: Neutral targets (not countered by)
            const neutral = enemies.filter(e => !counteredBy.includes(e.classKey));
            if (neutral.length > 0) return neutral.reduce((a, b) => dist(p, a) < dist(p, b) ? a : b);

            // Tier 5: Countered-by targets (cautious engagement)
            // Only engage if we have advantage (HP, allies nearby)
            const dangerous = enemies.filter(e => counteredBy.includes(e.classKey));
            if (dangerous.length > 0) {
                // Pick the lowest HP one and be defensive
                p.cautiousMode = true;
                return dangerous.reduce((a, b) => a.hp < b.hp ? a : b);
            }

            return enemies[0];
        }

        // === AI: AGGRESSION CALCULATOR ===
        function getAggression(p, target) {
            let aggro = p.config.baseAggression;
            const hpPct = p.hp / p.maxHp;
            const counters = COUNTERS[p.classKey].counters;
            const counteredBy = COUNTERS[p.classKey].counteredBy;

            // Counter matchup modifiers
            if (counters.includes(target.classKey)) aggro += 0.3; // Hunting prey
            if (counteredBy.includes(target.classKey)) aggro -= 0.25; // Cautious

            // HP modifiers
            if (hpPct < 0.3) aggro -= 0.2; // Low HP = cautious (except Assault)
            if (p.classKey === 'assault' && hpPct < 0.4) aggro += 0.4; // Berserk mode
            if (target.hp / target.maxHp < 0.25) aggro += 0.3; // Smell blood

            // Rampage bonus (Assault momentum scaling)
            if (p.classKey === 'assault') {
                const momScale = p.config.momentum / 40;
                aggro += momScale * 0.2;
            }

            // Second Chance bonus (Support more aggressive with safety net)
            if (p.classKey === 'support' && p.hasSecondChance) aggro += 0.15;
            if (p.classKey === 'support' && !p.hasSecondChance) aggro -= 0.1;

            // === RING PRESSURE ===
            // As the ring shrinks, aggression increases - force fights in tight spaces
            const ringProgress = 1 - ((currentRingRadius - RING_MIN_RADIUS) / (RING_START_RADIUS - RING_MIN_RADIUS));
            // ringProgress: 0 = full ring, 1 = minimum ring
            const ringPressure = ringProgress * 0.5; // Up to +0.5 aggression at minimum ring
            aggro += ringPressure;

            return Math.max(0.1, Math.min(1.0, aggro));
        }

        // === AI: CLASS-SPECIFIC MOVEMENT ===
        function getClassMovement(p, target, allies, enemies, time) {
            const phase = p.id * 2.1;
            const hpPct = p.hp / p.maxHp;
            const momentum = p.config.momentum / 40;
            const angleToTarget = Math.atan2(target.y - p.y, target.x - p.x);
            const distToTarget = dist(p, target);
            const maxRange = R * p.config.range;
            let moveX = p.x, moveY = p.y;

            switch (p.classKey) {
                case 'support':
                    // Backline positioning, maintain distance, prioritize aura range
                    const idealDist = maxRange * 0.7;
                    const allyCenter = allies.length > 0
                        ? { x: allies.reduce((s, a) => s + a.x, 0) / allies.length, y: allies.reduce((s, a) => s + a.y, 0) / allies.length }
                        : p;
                    // Stay near allies for aura
                    moveX = allyCenter.x + Math.cos(angleToTarget) * -80;
                    moveY = allyCenter.y + Math.sin(angleToTarget) * -80;
                    // Orbiting pattern
                    moveX += Math.sin(time * 0.8 + phase) * 40;
                    moveY += Math.cos(time * 0.8 + phase) * 40;
                    break;

                case 'recon':
                    // Flanking behavior, high mobility, hit-and-run
                    const flankAngle = angleToTarget + Math.PI / 2 + Math.sin(time * 2) * 0.5;
                    const flankDist = 80 + Math.sin(time * 3 + phase) * 60;
                    moveX = target.x + Math.cos(flankAngle) * flankDist;
                    moveY = target.y + Math.sin(flankAngle) * flankDist;
                    // Precision evasion after attacking
                    if (p.precisionTimer > 0) {
                        moveX += Math.cos(time * 10) * 30;
                        moveY += Math.sin(time * 10) * 30;
                    }
                    break;

                case 'controller':
                    // Anchor behavior - defensive but still engages
                    if (!p.anchorPoint || Math.random() < 0.02) {
                        // Pick position towards nearest threat but maintain some distance
                        const nearestEnemy = enemies.reduce((nearest, e) =>
                            dist(p, e) < dist(p, nearest) ? e : nearest, enemies[0]);
                        if (nearestEnemy) {
                            const angleToEnemy = Math.atan2(nearestEnemy.y - p.y, nearestEnemy.x - p.x);
                            const holdDist = maxRange * 0.6; // Stay at 60% of max range
                            let anchorX = nearestEnemy.x - Math.cos(angleToEnemy) * holdDist;
                            let anchorY = nearestEnemy.y - Math.sin(angleToEnemy) * holdDist;

                            // CLAMP anchor inside ring with buffer
                            const anchorDist = Math.sqrt(anchorX * anchorX + anchorY * anchorY);
                            const safeRadius = currentRingRadius - 100; // 100-unit buffer from edge
                            if (anchorDist > safeRadius && safeRadius > 0) {
                                const clampRatio = safeRadius / anchorDist;
                                anchorX *= clampRatio;
                                anchorY *= clampRatio;
                            }

                            p.anchorPoint = { x: anchorX, y: anchorY };
                        } else {
                            p.anchorPoint = { x: p.homeX, y: p.homeY };
                        }
                    }
                    moveX = p.anchorPoint.x;
                    moveY = p.anchorPoint.y;
                    // Slow defensive drift
                    moveX += Math.sin(time * 0.3 + phase) * 20;
                    moveY += Math.cos(time * 0.3 + phase) * 20;
                    break;

                case 'assault':
                    // Direct charge, berserk at low HP
                    if (hpPct < 0.4) {
                        // BERSERK - relentless pursuit
                        moveX = target.x + Math.cos(time * 8 + phase) * 20;
                        moveY = target.y + Math.sin(time * 8 + phase) * 20;
                    } else {
                        // Aggressive advance with minor weaving
                        moveX = target.x + Math.cos(time * 3) * 40;
                        moveY = target.y + Math.sin(time * 3) * 40;
                    }
                    // Ram through - head straight at target
                    const chargeWeight = 0.8;
                    moveX = moveX * (1 - chargeWeight) + target.x * chargeWeight;
                    moveY = moveY * (1 - chargeWeight) + target.y * chargeWeight;
                    break;

                case 'skirmisher':
                    // Circle-strafing, hit-and-run, constant repositioning
                    const spiralSpeed = 5 + momentum * 3;
                    const spiralRadius = 50 + Math.sin(time * 2) * 40;
                    const spiralAngle = time * spiralSpeed + phase;
                    moveX = target.x + Math.cos(spiralAngle) * spiralRadius;
                    moveY = target.y + Math.sin(spiralAngle) * spiralRadius;
                    // Quick direction changes
                    if (Math.random() < 0.02) {
                        moveX += (Math.random() - 0.5) * 100;
                        moveY += (Math.random() - 0.5) * 100;
                    }
                    break;
            }

            return { x: moveX, y: moveY };
        }

        // === AI: ANTI-CLUSTERING ===
        function applyAntiClustering(p, allPlayers) {
            let repelX = 0, repelY = 0;

            for (let i = 0; i < allPlayers.length; i++) {
                const other = allPlayers[i];
                if (other === p || !other.alive) continue;

                const d = dist(p, other);
                const isAlly = other.team === p.team;

                // Allies repel more strongly
                const repelDist = isAlly ? ALLY_REPULSION : SEPARATION_RADIUS;

                if (d < repelDist && d > 0) {
                    const force = (repelDist - d) / repelDist;
                    const angle = Math.atan2(p.y - other.y, p.x - other.x);
                    const strength = isAlly ? 2.0 : 1.5; // Allies push harder
                    repelX += Math.cos(angle) * force * strength * 100;
                    repelY += Math.sin(angle) * force * strength * 100;
                }
            }

            return { x: repelX, y: repelY };
        }

        // === AI: MAIN UPDATE ===
        let firstDeathOccurred = false; // Track if first death happened for chaos mode
        let initialTargetAssignments = new Map(); // Store 1v1v1 target assignments

        function aiUpdate(dt) {
            if (gameState !== 'playing') return;
            const time = Date.now() * 0.001;

            // CACHE: Filter once per frame, not per player
            const alivePlayers = players.filter(p => p.alive);

            // === PREP PHASE ===
            if (prepPhaseTimer > 0) {
                prepPhaseTimer -= dt;

                // === SCALE TRANSITION: Animate players from lobby size to game size ===
                // Progress goes from 0 to 1 over the prep phase (10 seconds)
                const PREP_PHASE_DURATION = 10;
                scaleTransitionProgress = Math.min(1, 1 - (prepPhaseTimer / PREP_PHASE_DURATION));

                // Update the prep phase display
                const prepDisplay = document.getElementById('prepPhaseDisplay');
                const prepTimerEl = document.getElementById('prepTimer');
                if (prepDisplay && prepTimerEl) {
                    prepDisplay.classList.add('visible');
                    prepTimerEl.textContent = Math.ceil(prepPhaseTimer);
                }

                // During prep: teams move into TACTICAL FORMATION (like a football play)
                alivePlayers.forEach(p => {
                    // Get team's base position (star/pentagram formation)
                    const totalTeams = Math.ceil(players.length / 3);
                    const teamAngle = -Math.PI / 2 + ((p.team - 1) / totalTeams) * Math.PI * 2; // Start at top
                    const teamCenterX = Math.cos(teamAngle) * 350;
                    const teamCenterY = Math.sin(teamAngle) * 350;

                    // Formation offset based on class role
                    const role = p.config.role;
                    let offsetX = 0, offsetY = 0;
                    const spread = 60;

                    switch (role) {
                        case 'frontline': // Assault - point position
                            offsetX = -Math.cos(teamAngle) * spread * 1.2;
                            offsetY = -Math.sin(teamAngle) * spread * 1.2;
                            break;
                        case 'backline': // Support - rear position
                            offsetX = Math.cos(teamAngle) * spread * 0.8;
                            offsetY = Math.sin(teamAngle) * spread * 0.8;
                            break;
                        case 'flank': // Recon - side left
                            offsetX = Math.cos(teamAngle + Math.PI / 2) * spread;
                            offsetY = Math.sin(teamAngle + Math.PI / 2) * spread;
                            break;
                        case 'anchor': // Controller - center
                            offsetX = 0; offsetY = 0;
                            break;
                        case 'roam': // Skirmisher - side right
                            offsetX = Math.cos(teamAngle - Math.PI / 2) * spread;
                            offsetY = Math.sin(teamAngle - Math.PI / 2) * spread;
                            break;
                    }

                    // Subtle shuffle animation
                    const shuffle = Math.sin(time * 2 + p.id) * 8;
                    p.targetX = teamCenterX + offsetX + shuffle;
                    p.targetY = teamCenterY + offsetY + Math.cos(time * 1.5 + p.id) * 5;
                });
                return; // No combat during prep
            } else {
                // Hide prep display when done
                const prepDisplay = document.getElementById('prepPhaseDisplay');
                if (prepDisplay) prepDisplay.classList.remove('visible');
            }

            // === INITIAL ENGAGEMENT: Assign unique 1v1v1 targets ===
            if (!firstDeathOccurred && initialTargetAssignments.size === 0) {
                // Assign each player a unique enemy to create scattered 1v1v1 fights
                const allEnemies = players.filter(p => p.alive);
                const usedTargets = new Set();

                players.filter(p => p.alive).forEach(p => {
                    const enemies = allEnemies.filter(e => e.alive && e.team !== p.team && !usedTargets.has(e.id));
                    if (enemies.length > 0) {
                        // Pick the closest available enemy
                        const target = enemies.reduce((a, b) => dist(p, a) < dist(p, b) ? a : b);
                        initialTargetAssignments.set(p.id, target.id);
                        usedTargets.add(target.id);
                    }
                });
            }

            alivePlayers.forEach(p => {
                if (p.stunnedTimer > 0) return; // Stunned
                if (p.isInvisible) return; // Invisible (False Positive active)

                // === SUPPORT FALSE POSITIVE TRIGGER ===
                // Use when low health AND haven't used yet this life (1 per life)
                if (p.classKey === 'support' && !p.usedFalsePositive && p.hp / p.maxHp < 0.40) {
                    activateFalsePositive(p);
                    p.usedFalsePositive = true; // 1 per life
                }

                // === ASSAULT SEISMIC BURST ===
                // Triggers when: 3+ players cluster within 80 units OR low health (berserker panic)
                // No damage, 1 use per life cycle
                if (p.classKey === 'assault' && !p.usedSeismicBurst) {
                    const nearbyPlayers = players.filter(other =>
                        other !== p && other.alive && dist(p, other) < 80
                    );

                    const clusterTrigger = nearbyPlayers.length >= 3;
                    const berserkerTrigger = p.hp / p.maxHp < 0.35 && nearbyPlayers.length >= 1; // Low HP + at least 1 nearby

                    if (clusterTrigger || berserkerTrigger) {
                        // SEISMIC BURST!
                        p.usedSeismicBurst = true;

                        // Visual feedback - trigger on orb
                        const orb = orbs.find(o => o.player === p);
                        if (orb) {
                            orb.seismicBurstTimer = 0.5; // Animation timer
                        }

                        // Push all nearby players: UP first, then AWAY
                        nearbyPlayers.forEach(target => {
                            const dx = target.x - p.x;
                            const dy = target.y - p.y;
                            const d = Math.sqrt(dx * dx + dy * dy) || 1;
                            const pushForce = 600; // Strong horizontal push

                            // KNOCK UP FIRST - high vertical velocity
                            target.verticalVelocity = (target.verticalVelocity || 0) + 400;

                            // Store delayed knockback to apply after airborne
                            target.seismicKnockback = {
                                vx: (dx / d) * pushForce,
                                vy: (dy / d) * pushForce,
                                delay: 0.1 // Apply after 100ms (at peak of jump)
                            };

                            // Find their orb for visual shake
                            const targetOrb = orbs.find(o => o.player === target);
                            if (targetOrb) {
                                targetOrb.shakeTimer = 0.4;
                            }
                        });

                        addLog(`💥 ${p.username} SEISMIC BURST! Scattered ${nearbyPlayers.length} players!`, 'kill');
                    }
                }

                // === RECON MARK ABILITY ===
                // Every 20s, Recon places an electric mark at their position
                if (p.classKey === 'recon' && p.reconMarkTimer !== undefined) {
                    p.reconMarkTimer -= dt;
                    if (p.reconMarkTimer <= 0) {
                        createReconMark(p.x, p.y, p.team);
                        p.reconMarkTimer = RECON_MARK_COOLDOWN; // Reset cooldown
                    }
                }

                // Include enemy decoys as valid targets (use cached alivePlayers)
                const enemies = alivePlayers.filter(e => e.team !== p.team && !e.isInvisible);
                const enemyDecoys = decoys.filter(d => d.team !== p.team);
                const allies = alivePlayers.filter(a => a.team === p.team && a !== p);
                if (enemies.length === 0 && enemyDecoys.length === 0) return;

                let target;

                // Use initial 1v1v1 target if first death hasn't happened yet
                if (!firstDeathOccurred && initialTargetAssignments.has(p.id)) {
                    const assignedId = initialTargetAssignments.get(p.id);
                    target = players.find(e => e.id === assignedId && e.alive);
                    // If assigned target died, fall back to normal targeting
                    if (!target) target = selectTarget(p, enemies);
                } else {
                    // Normal pentagram targeting (chaos mode)
                    target = selectTarget(p, enemies);
                }

                if (!target) return;
                p.currentTarget = target;

                // Calculate aggression
                const aggro = getAggression(p, target);

                // Get class-specific movement
                const movement = getClassMovement(p, target, allies, enemies, time);

                // Apply anti-clustering
                const repulsion = applyAntiClustering(p, players);

                // Combine movement vectors
                let targetX = movement.x + repulsion.x;
                let targetY = movement.y + repulsion.y;

                // Aggression modifies distance
                const distToTarget = dist(p, target);
                const maxRange = R * p.config.range;
                const idealDist = maxRange * (1.0 - aggro * 0.5); // Higher aggro = closer

                // Adjust based on ideal distance
                if (distToTarget > idealDist * 1.2) {
                    // Too far - move closer
                    targetX = target.x + (p.x - target.x) * 0.3;
                    targetY = target.y + (p.y - target.y) * 0.3;
                } else if (distToTarget < idealDist * 0.5 && p.cautiousMode) {
                    // Too close and cautious - back off
                    targetX = p.x + (p.x - target.x) * 0.5;
                    targetY = p.y + (p.y - target.y) * 0.5;
                }

                // === EDGE AWARENESS (only when dome is DOWN - falling is possible) ===
                // Calculate how close player is to the ring edge
                const myDistFromCenter = Math.sqrt(p.x * p.x + p.y * p.y);
                const edgeBuffer = 80; // Danger zone near edge
                const safeRadius = currentRingRadius - edgeBuffer;
                const isNearEdge = myDistFromCenter > safeRadius;
                const edgeDanger = Math.max(0, (myDistFromCenter - safeRadius) / edgeBuffer); // 0-1 danger level

                // If near edge AND dome is down, strongly pull toward center (self-preservation)
                if (!domeActive && isNearEdge) {
                    const pullStrength = 0.5 + edgeDanger * 0.5; // Stronger pull when closer to edge
